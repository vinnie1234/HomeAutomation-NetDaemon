            const fx = homeX - 9, fy = halfMast ? 22 : 4;
            festive += svgAt(fx, groundBottom(fx) - 1, 40, 70, '0 0 34 60', `
                <path d="M4 60 V2" stroke="${dim('rgb(226,232,240)')}" stroke-width="1.6"/><circle cx="4" cy="2" r="1.4" fill="#facc15"/>
                <g style="transform-box:view-box;transform-origin:4px ${fy}px;animation:hero-flag 2.4s ease-in-out infinite">
                  <rect x="4" y="${fy}" width="22" height="4.4" fill="#ae1c28"/><rect x="4" y="${fy + 4.4}" width="22" height="4.4" fill="#fff"/>
                  <rect x="4" y="${fy + 8.8}" width="22" height="4.4" fill="#21468b"/>
                  ${kind === 'king' ? `<path d="M4 ${fy - 2.6} L33 ${fy - 1.2} L4 ${fy + 0.2} Z" fill="#f97316"/>` : ''}</g>`,
              'filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25))');
          }
          if (kind === 'remembrance' && !day) {
            festive += svgAt(homeX + 4.4, groundBottom(homeX + 4.4) - 1.5, 14, 22, '0 0 14 22', `
                <rect x="3" y="9" width="8" height="12" rx="1" fill="#f1f5f9"/>
                <path d="M7 2 Q9.5 5.5 7 8.6 Q4.5 5.5 7 2 Z" fill="#ffd166" style="animation:hero-flicker 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px #ffb703)"/>`);
          }
          if (kind !== 'remembrance') {
            let balloons = '';
            [[10, 16, 0], [20, 8, 1], [30, 14, 2], [16, 2, 3], [26, 0, 4]].forEach(([x, y, i]) => {
              const c = colors[i % colors.length];
              balloons += `<path d="M${x} ${y + 12} Q${x + (i % 2 ? 2 : -2)} ${y + 24} 20 46" stroke="rgba(255,255,255,0.7)" stroke-width="0.5" fill="none"/>
                <g style="transform-box:fill-box;transform-origin:center bottom;animation:hero-balloon ${2.4 + i * 0.3}s ease-in-out ${-i * 0.5}s infinite">
                  ${kind === 'love'
                    ? `<path d="M${x} ${y + 11} C${x - 9} ${y + 4} ${x - 5} ${y - 3} ${x} ${y + 2} C${x + 5} ${y - 3} ${x + 9} ${y + 4} ${x} ${y + 11} Z" fill="${c}"/>`
                    : `<ellipse cx="${x}" cy="${y + 5}" rx="5.4" ry="6.6" fill="${c}"/><path d="M${x - 1} ${y + 11.5} L${x + 1} ${y + 11.5} L${x} ${y + 12.6} Z" fill="${c}"/>`}
                  <ellipse cx="${x - 2}" cy="${y + 3}" rx="1.4" ry="2.2" fill="rgba(255,255,255,0.45)"/></g>`;
            });
            festive += svgAt(bx, groundBottom(bx) - 1, 70, 82, '0 0 40 47', balloons, 'filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25))');
            if (!['kerst', 'sinterklaas', 'pasen'].includes(theme)) festive += bunting(colors);
            if (kind === 'love') for (let i = 0; i < 6; i++) {
              festive += `<div style="position:absolute;left:${homeX - 1 + (i % 3) * 1.6}%;bottom:${groundBottom(homeX) + 20}%;font-size:${12 + (i % 3) * 3}px;
                  color:${colors[i % 3]};animation:hero-heart 4s ease-out ${-i * 0.7}s infinite;filter:drop-shadow(0 0 3px rgba(255,80,120,0.6))">♥</div>`;
            }
            // Pixel is jarig: een taartje met een visje bij de voordeur
            if (celebration.name === 'Pixel') {
              festive += svgAt(homeX + 3.6, groundBottom(homeX + 3.6) - 2, 26, 26, '0 0 30 30', `
                  <rect x="3" y="15" width="24" height="12" rx="2" fill="#fbcfe8"/><rect x="3" y="15" width="24" height="3.4" rx="1.6" fill="#fff"/>
                  <path d="M5 18 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0 q2.5 3 5 0" stroke="#f9a8d4" stroke-width="1.2" fill="none"/>
                  <path d="M9 12 Q14 8 19 12 Q14 16 9 12 Z M19 12 L23 9 L23 15 Z" fill="#60a5fa"/><circle cx="11.5" cy="11.4" r="0.7" fill="#1e293b"/>
                  <rect x="14.2" y="3" width="1.6" height="6" fill="#facc15"/>
                  <path d="M15 -1 Q16.6 1.4 15 3 Q13.4 1.4 15 -1 Z" fill="#fb923c" style="animation:hero-flicker 1s ease-in-out infinite"/>`,
                'filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25))');
            }
            // Confetti die naar beneden dwarrelt
            for (let i = 0; i < 26; i++) {
              festive += `<div style="position:absolute;left:${rnd() * 100}%;top:-10px;width:5px;height:8px;border-radius:1px;background:${colors[i % colors.length]};
                  animation:hero-petal ${7 + rnd() * 6}s linear ${-rnd() * 12}s infinite"></div>`;
            }
          }
        }
        // Op vakantie: een bordje bij het pad en af en toe een vliegtuigje met een spandoek
        if (onVacation) {
          festive += svgAt(homeX + 9, groundBottom(homeX + 9) - 1.5, 50, 34, '0 0 50 34', `
              <rect x="23.5" y="14" width="3" height="20" fill="${dim('rgb(120,84,52)')}"/>
              <rect x="2" y="2" width="46" height="14" rx="2" fill="${dim('rgb(196,150,96)')}" stroke="${dim('rgb(140,100,60)')}" stroke-width="1"/>
              <text x="25" y="11.6" text-anchor="middle" font-size="7.4" font-weight="700" font-family="sans-serif" fill="${dim('rgb(70,40,20)')}">${sitterHome ? 'Oppas is er' : 'Op vakantie'}</text>`,
            'filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3))');
          festive += `<div style="position:absolute;top:9%;left:-40%;pointer-events:none;animation:hero-plane 34s linear ${clockDelay(0.2, 17)}s infinite">
              <svg viewBox="0 0 190 30" style="width:210px;height:33px;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25))">
                <!-- Spandoek en tekst wapperen samen -->
                <g style="transform-box:view-box;transform-origin:120px 16px;animation:hero-flag 1.6s ease-in-out infinite">
                  <path d="M2 6 Q60 10 120 6 L120 26 Q60 22 2 26 Z" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
                  <text x="61" y="20" text-anchor="middle" font-size="11" font-weight="700" font-family="sans-serif" fill="#ea580c">🌴 Fijne vakantie!</text>
                </g>
                <path d="M120 16 L140 14" stroke="#64748b" stroke-width="0.8"/>
                <path d="M140 12 L176 11 Q186 12 186 15.5 Q184 19 174 19 L142 19 Q138 17 140 12 Z" fill="#ef4444"/>
                <path d="M146 11.6 L150 4 L155 4 L154 12 Z" fill="#b91c1c"/><path d="M160 15 L170 26 L174 26 L169 15 Z" fill="#991b1b"/>
                <circle cx="176" cy="14" r="1.6" fill="#bae6fd"/>
                <ellipse cx="187" cy="15.5" rx="1" ry="5" fill="rgba(30,41,59,0.6)" style="animation:hero-twinkle 0.15s linear infinite"/>
              </svg></div>`;
        }
        // ---------- Post: de brievenbus naast de deur, vol (met de vlag omhoog) als er vandaag of gisteren post was ----------
        // (sensor.buiten_postnl_brieven, per brief een datum), en pakketjes bij de deur als ze vandaag komen of gekomen zijn
        const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const todayIso = isoDay(today), yesterdayIso = isoDay(new Date(today.getTime() - 86400000));
        const letters = (states['sensor.buiten_postnl_brieven']?.attributes?.letters ?? [])
          .filter(l => [todayIso, yesterdayIso].includes(String(l.date ?? '').slice(0, 10))).length;
        const carriers = [['postnl', '#f97316'], ['dhl', '#facc15'], ['dpd', '#dc2626'], ['gls', '#1d4ed8']];
        const parcelDay = p => String(p.delivered_at ?? p.delivery_date ?? p.planned_from ?? p.planned_to ?? '').slice(0, 10);
        const parcels = carriers.flatMap(([key, color]) => {
          const incoming = (states[`sensor.buiten_${key}_inkomende_pakketten`]?.attributes?.parcels ?? []).filter(p => parcelDay(p) === todayIso);
          const delivered = (states[`sensor.buiten_${key}_bezorgde_pakketten`]?.attributes?.parcels ?? []).filter(p => parcelDay(p) === todayIso);
          // Zonder data per pakket: de volgende bezorging is vandaag
          const next = new Date(states[`sensor.buiten_${key}_volgende_bezorging`]?.state);
          const n = incoming.length + delivered.length || (!isNaN(next) && isoDay(next) === todayIso ? 1 : 0);
          return Array(n).fill(color);
        }).slice(0, 4);
        {
          const mx = homeX - 4.6;
          festive += svgAt(mx, groundBottom(mx) - 1.5, 18, 28, '0 0 18 28', `
              <rect x="7.6" y="11" width="2.8" height="17" fill="${dim('rgb(70,70,80)')}"/>
              ${letters ? `<path d="M3.4 4.6 L7.4 -0.6 L11 2.4 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.4"/>
                <path d="M7 4.6 L12.4 0.2 L14.6 4.6 Z" fill="#fef9c3" stroke="#cbd5e1" stroke-width="0.4"/>` : ''}
              <path d="M1 7 Q1 3 5 3 L13 3 Q17 3 17 7 L17 13 L1 13 Z" fill="${dim('rgb(30,96,64)')}"/>
              <rect x="4" y="5.6" width="10" height="1.4" rx="0.7" fill="${dim('rgb(14,54,36)')}"/>
              ${letters ? `<path d="M17 9 L17 1 L22 1 L22 4 L17 4" fill="#dc2626" stroke="#991b1b" stroke-width="0.4"/>`
                : `<path d="M17 10 L23 10 L23 12.6 L17 12.6" fill="${dim('rgb(150,40,40)')}"/>`}`,
            'filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3))');
        }
        // Pakketjes op de stoep van de voordeur, opgestapeld, met een sticker in de kleur van de vervoerder
        if (parcels.length) {
          const boxes = parcels.map((color, i) => {
            // Onderste rij twee dozen op de grond (y = 23), daarbovenop nog twee
            const [x, by, w, h] = [[0, 14, 11, 9], [11, 15, 9, 8], [2, 6, 8, 8], [12, 9, 7, 6]][i];
            return `<rect x="${x}" y="${by}" width="${w}" height="${h}" rx="0.6" fill="${dim('rgb(196,150,98)')}" stroke="${dim('rgb(150,108,64)')}" stroke-width="0.5"/>
              <rect x="${x + w / 2 - 0.8}" y="${by}" width="1.6" height="${h}" fill="${dim('rgb(222,196,150)')}"/>
              <rect x="${x + 1}" y="${by + h - 3.2}" width="3" height="2" rx="0.3" fill="${color}"/>`;
          }).join('');
          festive += svgAt(homeX + 6.4, groundBottom(homeX + 6.4) - 2.2, 24, 24, '0 0 21 24', boxes, 'filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3))');
        }
        out += festive;

        // ---------- Afval dat vandaag of morgen buiten moet: PMD-zakken of de blauwe kliko, klein op de stoep ----------
        const bins = [];
        for (const [sensor, when] of [['sensor.afval_vandaag', 'vandaag'], ['sensor.afval_morgen', 'morgen']]) {
          const kind = String(states[sensor]?.state ?? '').toLowerCase();
          if (kind.includes('pmd') || kind.includes('plastic')) bins.push(['pmd', when]);
          if (kind.includes('papier')) bins.push(['papier', when]);
        }
        bins.forEach(([kind, when], i) => {
          const body = kind === 'pmd'
            ? `<path d="M3 30 Q1 18 6 13 L8 10 L6 6 L10 8 L13 5 L13 10 L15 13 Q20 18 18 30 Z" fill="${dim('rgb(251,146,60)')}" opacity="0.85"/>
               <path d="M15 31 Q13 21 18 17 L19 14 L17 11 L21 13 L24 10 L24 14 L26 17 Q31 21 29 31 Z" fill="${dim('rgb(253,186,116)')}" opacity="0.8"/>
               <path d="M6 18 Q9 22 8 28 M19 21 Q22 25 21 29" stroke="rgba(255,255,255,0.45)" stroke-width="0.8" fill="none"/>`
            : `<rect x="5" y="9" width="20" height="21" rx="2" fill="${dim('rgb(37,99,235)')}"/>
               <rect x="3.5" y="6" width="23" height="4.5" rx="1.5" fill="${dim('rgb(29,78,216)')}"/>
               <rect x="23" y="4" width="4" height="2.5" rx="1" fill="${dim('rgb(30,64,175)')}"/>
               <rect x="9" y="14" width="12" height="1.6" rx="0.8" fill="rgba(255,255,255,0.35)"/>
               <circle cx="9" cy="31" r="2" fill="#1f2937"/><circle cx="21" cy="31" r="2" fill="#1f2937"/>`;
          // Op de voorgrond (de stoep) onderaan de kaart: bomen en huizen staan hoger, op de heuvelrand, dus daar staat nooit iets voor.
          // Aan het eind van het tuinpad langs de weg.
          out += `<svg viewBox="0 0 32 40" style="position:absolute;left:calc(max(${homeX + 15}%, 250px) + ${i * 28}px);bottom:2%;
              width:30px;height:38px;transform:translateX(-50%);overflow:visible;pointer-events:none;opacity:${when === 'morgen' ? 0.75 : 1};
              filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3))">${body}
              <text x="16" y="39.5" text-anchor="middle" font-size="5.5" font-family="sans-serif" fill="rgba(255,255,255,0.8)">${when}</text></svg>`;
        });

        // ---------- Pixel zit 10 minuten voor het voeren bij de voordeur (en zwiept met zijn staart) ----------
        // Het volgende voermoment (vandaag of morgen, een overgeslagen voeding telt niet). Vanaf het tekenen wordt met een
        // CSS-vertraging uitgerekend wanneer hij gaat zitten, zodat het ook klopt als de kaart niet opnieuw tekent.
        const feedWindow = (() => {
          const now = new Date();
          const times = ['first', 'second', 'third', 'fourth']
            .map(n => String(states[`input_datetime.pixelfeed${n}time`]?.state ?? ''))
            .filter(v => /^\d{1,2}:\d{2}/.test(v))
            .map(v => { const [h, m] = v.split(':').map(Number); const d = new Date(now); d.setHours(h, m, 0, 0); return d; });
          const upcoming = [...times, ...times.map(d => new Date(d.getTime() + 86400000))].filter(d => d > now).sort((a, b) => a - b);
          // "Volgende voeding overslaan": die eerstvolgende komt er niet, dus hij wacht op de daarna
          if (states['input_boolean.pixelskipnextautofeed']?.state === 'on') upcoming.shift();
          const feed = upcoming[0];
          if (!feed) return null;
          const until = (feed - now) / 1000;
          return { start: Math.max(0, until - 600), end: until };   // seconden vanaf nu
        })();

        // ---------- Een zwarte kat met een wit plekje in zijn nek dwaalt over de stoep ----------
        // Elke keer dat de kaart tekent kiest hij een nieuwe route van een minuut: lopen naar een willekeurig punt, even
        // stilstaan, weer verder. Bij het lopen zwaaien de pootjes heen en weer; bij stilstaan staan ze recht.
        {
          // Een rondje: een paar keer lopen en stilstaan, en tot slot terug naar het begin, zodat het einde naadloos
          // aansluit op het begin van de volgende ronde (anders springt hij terug).
          const stops = [];                                  // [tijd (s), x (%)]
          const startX = 30 + Math.random() * 60;
          let t = 0, x = startX;
          stops.push([0, x]);
          const legsCount = 5 + Math.floor(Math.random() * 4);
          for (let leg = 0; leg <= legsCount; leg++) {
            t += 2 + Math.random() * 4;                      // even stilstaan
            stops.push([t, x]);
            let next = leg === legsCount ? startX : 30 + Math.random() * 62;
            if (leg < legsCount && Math.abs(next - x) < 8) next = x + (next > x ? 12 : -12);
            next = Math.max(28, Math.min(94, next));
            t += Math.max(0.5, Math.abs(next - x) / 2.2);     // ongeveer 2,2% van de breedte per seconde
            stops.push([t, next]);
            x = next;
          }
          const total = t;                                   // seconden voor het hele rondje
          const pct = v => (v / total * 100).toFixed(2);
          const step = v => (+pct(v) + 0.01).toFixed(2);

          // Positie, kijkrichting en lopen/staan uit dezelfde route
          const move = stops.map(([v, px]) => `${pct(v)}% { left: ${px.toFixed(1)}%; }`).join(' ');
          let face = '0% { transform: scaleX(1); }', facing = 1;
          let walking = '0% { opacity: 0; }', standing = '0% { opacity: 1; }';
          for (let i = 1; i < stops.length; i++) {
            const [t0, x0] = stops[i - 1], [t1, x1] = stops[i];
            const dir = Math.sign(x1 - x0);
            if (dir && dir !== facing) {
              face += ` ${pct(t0)}% { transform: scaleX(${facing}); } ${step(t0)}% { transform: scaleX(${dir}); }`;
              facing = dir;
            }
            const isWalk = dir !== 0;
            walking += ` ${pct(t0)}% { opacity: ${isWalk ? 0 : 0}; } ${step(t0)}% { opacity: ${isWalk ? 1 : 0}; } ${pct(t1)}% { opacity: ${isWalk ? 1 : 0}; }`;
            standing += ` ${pct(t0)}% { opacity: ${isWalk ? 1 : 1}; } ${step(t0)}% { opacity: ${isWalk ? 0 : 1}; } ${pct(t1)}% { opacity: ${isWalk ? 0 : 1}; }`;
          }
          face += ` 100% { transform: scaleX(${facing}); }`;

          // Ronde pootjes die om de heup zwaaien; het diagonale paar (voor-ver en achter-dichtbij) loopt gelijk op
          const fur = day ? '#24242d' : '#1d1d26', far = '#0c0c11', near = '#17171e';
          const cycle = 0.7;                                 // seconden per pas
          const leg = (hx, hy, fill, phase, still) => `<g style="transform-origin:${hx}px ${hy}px;transform-box:view-box;${still ? '' :
              `animation:hero-cat-leg ${cycle / 2}s ease-in-out ${phase ? -cycle / 2 : 0}s infinite alternate`}">
              <rect x="${hx - 3.8}" y="${hy - 2}" width="7.6" height="${59.5 - hy}" rx="3.6" fill="${fill}"/>
              <ellipse cx="${hx + 0.8}" cy="56.6" rx="4.4" ry="2.4" fill="${fill}"/></g>`;
          const farLegs = still => `${leg(61, 43, far, 1, still)}${leg(30, 42, far, 0, still)}`;
          const nearLegs = still => `${leg(66, 43, near, 0, still)}${leg(35, 42, near, 1, still)}`;
          // Verkleed: eerst onze eigen feestdagen, dan de feestdagen van het jaar, dan het weer. Met dodenherdenking geen hoedje.
          const hatKind = celebration?.kind === 'remembrance' ? null
            : celebration?.kind === 'king' ? 'crown' : celebration?.kind === 'birthday' ? 'party' : celebration?.kind === 'love' ? 'hearts'
            : { halloween: 'witch', kerst: 'santa', sinterklaas: 'mitre', nieuwjaar: 'gold', pasen: 'bunny' }[theme]
              ?? (rain ? 'rain' : snow || temperature <= 3 ? 'beanie' : day && temperature >= 25 ? 'straw' : theme === 'lente' ? 'flowers' : null);
          // cx = midden van de kop, y = onderkant van het hoedje, k = schaal
          const catHat = (cx, y, k) => {
            const P = (...pts) => pts.map(([x, yy], i) => `${i ? 'L' : 'M'}${(cx + x * k).toFixed(2)} ${(y + yy * k).toFixed(2)}`).join(' ') + ' Z';
            const X = v => (cx + v * k).toFixed(2), Y = v => (y + v * k).toFixed(2);
            const coneHat = (fill, stripe, pom) => `<path d="${P([-6, 0], [1, -15], [7, 0])}" fill="${fill}"/>
                <path d="M${X(-3.6)} ${Y(-5)} L${X(4.6)} ${Y(-5)} M${X(-1.4)} ${Y(-10)} L${X(2.6)} ${Y(-10)}" stroke="${stripe}" stroke-width="${1.6 * k}"/>
                <circle cx="${X(1)}" cy="${Y(-15.5)}" r="${2 * k}" fill="${pom}"/>`;
            switch (hatKind) {
              case 'crown': return `<path d="${P([-7, 0], [-8, -8], [-3.5, -4], [0, -10], [3.5, -4], [8, -8], [7, 0])}" fill="#facc15" stroke="#ca8a04" stroke-width="${0.6 * k}"/>
                  <circle cx="${X(0)}" cy="${Y(-2.6)}" r="${1.4 * k}" fill="#ef4444"/>`;
              case 'party': return coneHat('#3b82f6', '#facc15', '#ef4444');
              case 'gold': return coneHat('#facc15', '#1f2937', '#f8fafc') + `<path d="M${X(-9)} ${Y(-12)} l${1 * k} ${2 * k} l${2 * k} ${0.4 * k} l${-2 * k} ${0.6 * k} l${-1 * k} ${2 * k} l${-1 * k} ${-2 * k}
                  l${-2 * k} ${-0.6 * k} l${2 * k} ${-0.4 * k} Z" fill="#fde68a" style="animation:hero-twinkle 1.2s ease-in-out infinite"/>`;
              case 'hearts': return `<path d="M${X(-9)} ${Y(1)} Q${X(0)} ${Y(-8)} ${X(9)} ${Y(1)}" stroke="#f43f5e" stroke-width="${1.4 * k}" fill="none"/>
                  ${[-4.5, 4.5].map(dx => `<path d="M${X(dx)} ${Y(-3)} L${X(dx * 1.4)} ${Y(-10)}" stroke="#f43f5e" stroke-width="${0.6 * k}"/>
                  <path d="M${X(dx * 1.4)} ${Y(-9)} C${X(dx * 1.4 - 4)} ${Y(-12)} ${X(dx * 1.4 - 2)} ${Y(-15.5)} ${X(dx * 1.4)} ${Y(-13)} C${X(dx * 1.4 + 2)} ${Y(-15.5)} ${X(dx * 1.4 + 4)} ${Y(-12)} ${X(dx * 1.4)} ${Y(-9)} Z"
                    fill="#fb7185" style="transform-box:fill-box;transform-origin:center bottom;animation:hero-balloon 1.6s ease-in-out infinite"/>`).join('')}`;
              case 'witch': return `<ellipse cx="${X(0)}" cy="${Y(0)}" rx="${13 * k}" ry="${2.6 * k}" fill="#3b1d5a"/>
                  <path d="M${X(-7)} ${Y(0)} Q${X(-2)} ${Y(-9)} ${X(4)} ${Y(-19)} Q${X(3)} ${Y(-9)} ${X(7.5)} ${Y(0)} Z" fill="#4c1d95"/>
                  <path d="M${X(-6.4)} ${Y(-1.6)} Q${X(0)} ${Y(-3.6)} ${X(7)} ${Y(-1.6)} L${X(7.2)} ${Y(-0.2)} Q${X(0)} ${Y(-2)} ${X(-6.8)} ${Y(-0.2)} Z" fill="#f97316"/>`;
              case 'santa': return `<path d="M${X(-10)} ${Y(-1)} Q${X(-2)} ${Y(-20)} ${X(11)} ${Y(-13)} Q${X(6)} ${Y(-8)} ${X(10)} ${Y(-1)} Z" fill="#dc2626"/>
                  <rect x="${X(-12)}" y="${Y(-3)}" width="${24 * k}" height="${4.4 * k}" rx="${2.2 * k}" fill="#f8fafc"/>
                  <circle cx="${X(11.5)}" cy="${Y(-13)}" r="${2.8 * k}" fill="#f8fafc"/>`;
              case 'mitre': return `<path d="M${X(-8)} ${Y(0)} L${X(-7)} ${Y(-14)} Q${X(0)} ${Y(-23)} ${X(7)} ${Y(-14)} L${X(8)} ${Y(0)} Z" fill="#c1121f" stroke="#facc15" stroke-width="${0.9 * k}"/>
                  <rect x="${X(-0.8)}" y="${Y(-16)}" width="${1.6 * k}" height="${9 * k}" fill="#facc15"/><rect x="${X(-3.2)}" y="${Y(-13)}" width="${6.4 * k}" height="${1.6 * k}" fill="#facc15"/>`;
              case 'bunny': return `<path d="M${X(-9)} ${Y(1)} Q${X(0)} ${Y(-7)} ${X(9)} ${Y(1)}" stroke="#f9a8d4" stroke-width="${1.4 * k}" fill="none"/>
                  ${[[-4, -14], [4, 14]].map(([dx, rot]) => `<g transform="rotate(${rot} ${X(dx)} ${Y(-3)})">
                    <ellipse cx="${X(dx)}" cy="${Y(-11)}" rx="${3 * k}" ry="${8.5 * k}" fill="#f8fafc"/><ellipse cx="${X(dx)}" cy="${Y(-11)}" rx="${1.4 * k}" ry="${6 * k}" fill="#fbcfe8"/></g>`).join('')}`;
              case 'rain': return `<path d="M${X(-15)} ${Y(1.4)} Q${X(0)} ${Y(-3)} ${X(13)} ${Y(0)} Q${X(0)} ${Y(3)} ${X(-15)} ${Y(1.4)} Z" fill="#eab308"/>
                  <path d="M${X(-9)} ${Y(0)} Q${X(-8)} ${Y(-12)} ${X(0)} ${Y(-12)} Q${X(8)} ${Y(-12)} ${X(9)} ${Y(0)} Z" fill="#facc15"/>
                  <path d="M${X(-6)} ${Y(-9)} Q${X(0)} ${Y(-11)} ${X(5)} ${Y(-9)}" stroke="rgba(255,255,255,0.5)" stroke-width="${0.8 * k}" fill="none"/>`;
              case 'beanie': return `<path d="M${X(-11)} ${Y(1)} Q${X(-10)} ${Y(-14)} ${X(0)} ${Y(-14)} Q${X(10)} ${Y(-14)} ${X(11)} ${Y(1)} Z" fill="#ef4444"/>
                  <rect x="${X(-11.5)}" y="${Y(-3)}" width="${23 * k}" height="${4.6 * k}" rx="${2 * k}" fill="#f8fafc"/>
                  ${[-6, -2, 2, 6].map(dx => `<path d="M${X(dx)} ${Y(-12)} L${X(dx * 1.2)} ${Y(-4)}" stroke="rgba(255,255,255,0.3)" stroke-width="${0.7 * k}"/>`).join('')}
                  <circle cx="${X(0)}" cy="${Y(-15)}" r="${3 * k}" fill="#f8fafc"/>`;
              case 'straw': return `<ellipse cx="${X(0)}" cy="${Y(0)}" rx="${16 * k}" ry="${3 * k}" fill="#e9c46a"/>
                  <path d="M${X(-8)} ${Y(0)} Q${X(-8)} ${Y(-10)} ${X(0)} ${Y(-10)} Q${X(8)} ${Y(-10)} ${X(8)} ${Y(0)} Z" fill="#d4a74a"/>
                  <path d="M${X(-8)} ${Y(-2)} Q${X(0)} ${Y(-3.6)} ${X(8)} ${Y(-2)} L${X(8)} ${Y(-0.2)} Q${X(0)} ${Y(-1.8)} ${X(-8)} ${Y(-0.2)} Z" fill="#ef4444"/>`;
              case 'flowers': return ['#f9a8d4', '#fde047', '#f8fafc', '#c4b5fd', '#f9a8d4'].map((c, i) => {
                  const fx = -10 + i * 5, fy = -1.5 - Math.sin(i / 4 * Math.PI) * 4;
                  return [0, 72, 144, 216, 288].map(d => `<circle cx="${(cx + (fx + Math.cos(d * Math.PI / 180) * 1.6) * k).toFixed(2)}" cy="${(y + (fy + Math.sin(d * Math.PI / 180) * 1.6) * k).toFixed(2)}" r="${1.3 * k}" fill="${c}"/>`).join('')
                    + `<circle cx="${X(fx)}" cy="${Y(fy)}" r="${0.9 * k}" fill="#f59e0b"/>`;
                }).join('');
              default: return '';
            }
          };
          // Een zonnebril bij het strohoedje
          const catGlasses = (x1, x2, ey, k) => hatKind !== 'straw' ? '' : `<g fill="#111827" stroke="#111827" stroke-width="${0.6 * k}">
              <ellipse cx="${x1}" cy="${ey}" rx="${4 * k}" ry="${3.2 * k}"/><ellipse cx="${x2}" cy="${ey}" rx="${4 * k}" ry="${3.2 * k}"/>
              <path d="M${x1 + 4 * k} ${ey - 0.6 * k} Q${(x1 + x2) / 2} ${ey - 2 * k} ${x2 - 4 * k} ${ey - 0.6 * k}" fill="none"/></g>
              <path d="M${x1 - 2.4 * k} ${ey - 1.4 * k} l${1.4 * k} ${-0.8 * k} M${x2 - 2.4 * k} ${ey - 1.4 * k} l${1.4 * k} ${-0.8 * k}" stroke="rgba(255,255,255,0.6)" stroke-width="${0.6 * k}"/>`;
          // Grote ogen die af en toe knipperen
          const catEye = (cx, cy, rx, ry, blink) => `<g style="transform-origin:${cx}px ${cy}px;transform-box:view-box;animation:hero-cat-blink ${blink}s ease-in-out infinite">
              <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${day ? '#cfe36a' : '#b9cc5a'}"/>
              <ellipse cx="${cx + rx * 0.15}" cy="${cy + 0.3}" rx="${rx * 0.6}" ry="${ry * 0.85}" fill="#050507"/>
              <circle cx="${cx - rx * 0.2}" cy="${cy - ry * 0.38}" r="${rx * 0.33}" fill="#fff"/></g>`;

          out += `<style>
              @keyframes hero-cat-move { ${move} }
              @keyframes hero-cat-face { ${face} }
              @keyframes hero-cat-walking { ${walking} }
              @keyframes hero-cat-standing { ${standing} }
            </style>
            <div style="position:absolute;bottom:2%;left:50%;width:68px;height:42px;margin-left:-34px;pointer-events:none;z-index:1;
                animation:hero-cat-move ${total}s linear infinite${feedWindow ? `, hero-cat-hide ${(feedWindow.end - feedWindow.start).toFixed(0)}s linear ${feedWindow.start.toFixed(0)}s 1` : ''}">
              <svg viewBox="0 -4 104 64" style="width:100%;height:100%;overflow:visible;animation:hero-cat-face ${total}s linear infinite;
                  filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35))${day ? '' : ' drop-shadow(0 0 3px rgba(255,255,255,0.15))'}">
                <ellipse cx="50" cy="58.6" rx="30" ry="2.2" fill="rgba(0,0,0,0.25)"/>
                <!-- Verre pootjes: lopen of stilstaan -->
                <g style="animation:hero-cat-walking ${total}s linear infinite">${farLegs(false)}</g>
                <g style="animation:hero-cat-standing ${total}s linear infinite">${farLegs(true)}</g>
                <!-- Staart en lijf (wippen licht mee bij elke pas) -->
                <g style="animation:hero-cat-bob ${cycle / 2}s ease-in-out infinite">
                  <path d="M27 31 C15 29 11 19 15 11 C16.5 8 20 8.5 19.5 11.5" stroke="${fur}" stroke-width="5.5" fill="none" stroke-linecap="round"
                    style="transform-origin:27px 31px;transform-box:view-box;animation:hero-cat-tail 2.8s ease-in-out infinite"/>
                  <path d="M30 25.5 C40 21.5 58 21.5 66 24 C76 27.5 77.5 42.5 68.5 46.5 C58 50.5 41 50.5 31 48.5 C19 46 18.5 30 30 25.5 Z" fill="${fur}"/>
                  <path d="M32 26.5 C42 23 57 23 64 25" stroke="rgba(255,255,255,0.08)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                </g>
                <!-- Nabije pootjes -->
                <g style="animation:hero-cat-walking ${total}s linear infinite">${nearLegs(false)}</g>
                <g style="animation:hero-cat-standing ${total}s linear infinite">${nearLegs(true)}</g>
                <!-- Kop met oren, het witte plekje op zijn keel, ogen, neusje, mondje, snorharen en roze wangetjes -->
                <g style="animation:hero-cat-bob ${cycle / 2}s ease-in-out infinite">
                  <path d="M68.5 13 Q67 1.5 70.5 0.5 Q73.5 1 79 7.5 Z" fill="${fur}"/><path d="M70.3 10 Q69.8 3.8 71.4 3.4 Q73 4 76 7.6 Z" fill="#c98a9a"/>
                  <path d="M93.5 13 Q95 1.5 91.5 0.5 Q88.5 1 83 7.5 Z" fill="${fur}"/><path d="M91.7 10 Q92.2 3.8 90.6 3.4 Q89 4 86 7.6 Z" fill="#c98a9a"/>
                  <ellipse cx="75.5" cy="35.5" rx="3.8" ry="3.2" fill="#ececf0"/>
                  <ellipse cx="81" cy="19" rx="14" ry="12.6" fill="${fur}"/>${catHat(81, 8.5, 1)}
                  ${catEye(75.4, 19.5, 3.3, 3.9, 5)}${catEye(86.6, 19.5, 3.3, 3.9, 5)}${catGlasses(75.4, 86.6, 19.5, 1)}
                  <path d="M79.6 24.6 Q81 23.9 82.4 24.6 Q81.6 26 81 26.2 Q80.4 26 79.6 24.6 Z" fill="#e59aac"/>
                  <path d="M81 26.2 L81 27 M78.8 27 Q79.9 28.4 81 27 Q82.1 28.4 83.2 27" stroke="#6b5058" stroke-width="0.55" fill="none" stroke-linecap="round"/>
                  <path d="M72 25 L63 23.5 M72 26.6 L63.2 27.6 M90 25 L99 23.5 M90 26.6 L98.8 27.6" stroke="rgba(255,255,255,0.5)" stroke-width="0.4" stroke-linecap="round"/>
                  <ellipse cx="73" cy="25.2" rx="2.2" ry="1.3" fill="rgba(255,120,150,0.18)"/><ellipse cx="89" cy="25.2" rx="2.2" ry="1.3" fill="rgba(255,120,150,0.18)"/>
                </g>
              </svg>
            </div>`;

          // Pixel zit bij de voordeur, kijkt je aan, en zwiept met zijn staart
          if (feedWindow) {
            const sitX = homeX + 4.2;
            out += `<div style="position:absolute;left:${sitX}%;bottom:${groundBottom(sitX) - 1.5}%;width:30px;height:36px;margin-left:-15px;
                pointer-events:none;z-index:1;opacity:0;
                animation:hero-cat-show ${(feedWindow.end - feedWindow.start).toFixed(0)}s linear ${feedWindow.start.toFixed(0)}s 1">
              <svg viewBox="0 0 40 48" style="width:100%;height:100%;overflow:visible;
                  filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35))${day ? '' : ' drop-shadow(0 0 3px rgba(255,255,255,0.15))'}">
                <ellipse cx="20" cy="47" rx="14" ry="1.8" fill="rgba(0,0,0,0.25)"/>
                <path d="M29 45 C36 45 38 39 35 33" stroke="${fur}" stroke-width="3.6" fill="none" stroke-linecap="round"
                  style="transform-origin:29px 45px;transform-box:view-box;animation:hero-cat-wag 0.6s ease-in-out infinite alternate"/>
                <path d="M9.5 46 C7 37 11 26 20 26 C29 26 33 37 30.5 46 Z" fill="${fur}"/>
                <ellipse cx="20" cy="31" rx="3.6" ry="3.4" fill="#f4f4f4"/>
                <ellipse cx="16.2" cy="45.4" rx="3" ry="1.9" fill="#2c2c36"/><ellipse cx="23.8" cy="45.4" rx="3" ry="1.9" fill="#2c2c36"/>
                <path d="M11.5 13 Q10 3 13 2.4 Q15.6 3 19 8 Z" fill="${fur}"/><path d="M12.8 10.6 Q12.4 5.4 13.7 5 Q15 5.6 17 8.4 Z" fill="#c98a9a"/>
                <path d="M28.5 13 Q30 3 27 2.4 Q24.4 3 21 8 Z" fill="${fur}"/><path d="M27.2 10.6 Q27.6 5.4 26.3 5 Q25 5.6 23 8.4 Z" fill="#c98a9a"/>
                <ellipse cx="20" cy="17" rx="10.5" ry="9.4" fill="${fur}"/>${catHat(20, 9, 0.75)}
                ${catEye(16, 17, 2.4, 2.8, 4.2)}${catEye(24, 17, 2.4, 2.8, 4.2)}${catGlasses(16, 24, 17, 0.75)}
                <path d="M19 21.2 Q20 20.7 21 21.2 Q20.5 22.2 20 22.3 Q19.5 22.2 19 21.2 Z" fill="#e59aac"/>
                <path d="M20 22.3 L20 22.9 M18.4 22.9 Q19.2 24 20 22.9 Q20.8 24 21.6 22.9" stroke="#6b5058" stroke-width="0.45" fill="none" stroke-linecap="round"/>
                <path d="M13.5 21.4 L6.5 20.4 M13.5 22.6 L6.8 23.6 M26.5 21.4 L33.5 20.4 M26.5 22.6 L33.2 23.6" stroke="rgba(255,255,255,0.5)" stroke-width="0.32" stroke-linecap="round"/>
                <ellipse cx="14" cy="21.4" rx="1.6" ry="1" fill="rgba(255,120,150,0.18)"/><ellipse cx="26" cy="21.4" rx="1.6" ry="1" fill="rgba(255,120,150,0.18)"/>
              </svg>
            </div>`;
          }
        }

        // ---------- De was hangt buiten: waslijn met wapperende was (harder bij wind, druppels bij regen) ----------
        if (states['input_boolean.laundryhangingoutside']?.state === 'on') {
          const swing = Math.min(28, 4 + windSpeed * 1.6);         // graden heen en weer
          const pace = Math.max(0.7, 2.6 - windSpeed * 0.12);      // seconden per slag
          const peg = x => `<rect x="${x - 0.8}" y="9.2" width="1.6" height="3" rx="0.4" fill="${dim('rgb(214,170,110)')}"/>`;
          // Elk kledingstuk hangt aan de lijn (y = 10) en zwaait om dat punt
          const piece = (x, body, delay) => `<g style="transform-origin:${x}px 10px;transform-box:view-box;--swing:${swing}deg;
              animation:hero-sway ${pace + rnd() * 0.6}s ease-in-out ${-delay}s infinite">${body}${peg(x - 3)}${peg(x + 3)}</g>`;
          const shirt = x => `<path d="M${x - 6} 10 L${x - 9.5} 13.5 L${x - 7.5} 16 L${x - 5.5} 14.5 L${x - 5.5} 26 L${x + 5.5} 26 L${x + 5.5} 14.5
              L${x + 7.5} 16 L${x + 9.5} 13.5 L${x + 6} 10 Q${x} 13 ${x - 6} 10 Z" fill="${dim('rgb(96,165,250)')}"/>`;
          const pants = x => `<path d="M${x - 5} 10 L${x + 5} 10 L${x + 5.6} 29 L${x + 1.6} 29 L${x} 16 L${x - 1.6} 29 L${x - 5.6} 29 Z" fill="${dim('rgb(55,65,81)')}"/>`;
          const towel = x => `<rect x="${x - 5.5}" y="10" width="11" height="15" rx="0.8" fill="${dim('rgb(251,191,36)')}"/>
              <rect x="${x - 5.5}" y="21" width="11" height="1.4" fill="${dim('rgb(255,255,255)')}" opacity="0.7"/>`;
          const socks = x => `<path d="M${x - 4} 10 L${x - 1.5} 10 L${x - 1.5} 17 L${x + 0.5} 19 L${x - 0.5} 20.5 L${x - 4} 18.5 Z" fill="${dim('rgb(244,114,182)')}"/>
              <path d="M${x + 1.5} 10 L${x + 4} 10 L${x + 4} 17 L${x + 6} 19 L${x + 5} 20.5 L${x + 1.5} 18.5 Z" fill="${dim('rgb(244,114,182)')}"/>`;
          // Bij regen druppelt de was
          let drips = '';
          if (rain) for (let i = 0; i < 8; i++) {
            const x = 18 + rnd() * 74;
            drips += `<ellipse cx="${x}" cy="27" rx="0.6" ry="1" fill="rgba(180,215,255,0.85)"
                style="animation:hero-drip ${0.9 + rnd() * 0.8}s ease-in ${-rnd() * 2}s infinite"/>`;
          }
          // Tussen de klok (links) en de temperatuur (rechts): meeschalend, zodat hij ook op de telefoon vrij staat
          out += `<svg viewBox="0 0 110 44" style="position:absolute;left:max(44%, 255px);bottom:${groundBottom(44) - 3}%;
              width:clamp(120px, 16%, 200px);transform:translateX(-50%);overflow:visible;pointer-events:none;
              filter:drop-shadow(0 3px 4px rgba(0,0,0,0.25))">` + `
              <path d="M8 44 L8 6 M102 44 L102 6" stroke="${dim('rgb(120,90,60)')}" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M8 8 Q55 13 102 8" stroke="${dim('rgb(230,230,230)')}" stroke-width="0.5" fill="none"/>
              ${piece(24, shirt(24), 0)}${piece(45, pants(45), 0.4)}${piece(64, towel(64), 0.8)}${piece(82, socks(82), 1.1)}${drips}</svg>`;
        }


        // ---------- Heerlijk weer (25° of warmer en zon): een opblaasbadje met badeend, een parasol en een strandbal ----------
        if (day && temperature >= 25 && ['sunny', 'partlycloudy'].includes(w) && cover <= 40) {
          const px = homeX + 26;
          out += `<svg viewBox="0 0 90 46" style="position:absolute;left:${px}%;bottom:${Math.max(1, groundBottom(px) - 16)}%;width:96px;height:49px;
              transform:translateX(-50%);overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25))">
              <ellipse cx="38" cy="42" rx="34" ry="4" fill="rgba(0,0,0,0.18)"/>
              <!-- Parasol achter het badje -->
              <path d="M70 41 L66 6" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M48 12 Q66 -4 84 4 Q78 6 74 9 Q70 5 64 7 Q60 7 56 11 Q52 10 48 12 Z" fill="#ef4444"/>
              <path d="M64 7 Q66 -2 74 9 Q70 5 64 7 Z M56 11 Q57 2 64 7 Q60 7 56 11 Z" fill="#fff7ed"/>
              <!-- Opblaasbadje: blauwe rand met een witte streep, water dat glinstert -->
              <path d="M6 26 L6 34 Q6 41 38 41 Q70 41 70 34 L70 26 Z" fill="#2563eb"/>
              <path d="M6 30 Q6 36.5 38 36.5 Q70 36.5 70 30 L70 32.4 Q70 38.8 38 38.8 Q6 38.8 6 32.4 Z" fill="#f8fafc"/>
              <ellipse cx="38" cy="26" rx="32" ry="7.5" fill="#3b82f6"/>
              <ellipse cx="38" cy="26" rx="28" ry="5.6" fill="#7dd3fc"/>
              <ellipse cx="38" cy="26" rx="28" ry="5.6" fill="none" stroke="#bae6fd" stroke-width="0.8"/>
              ${[[26, 25, 0], [46, 27, 1.1], [36, 24, 2.2]].map(([x, y, d]) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="1.4" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="0.6"
                style="transform-box:fill-box;transform-origin:center;animation:hero-ripple 3.3s ease-out ${-d}s infinite"/>`).join('')}
              <!-- Badeend die op het water dobbert -->
              <g style="animation:hero-duck 2.4s ease-in-out infinite">
                <ellipse cx="44" cy="25.5" rx="4.4" ry="2.6" fill="#facc15"/>
                <circle cx="47" cy="22" r="2.3" fill="#facc15"/>
                <path d="M49 22 L51.6 22.6 L49 23.4 Z" fill="#f97316"/>
                <circle cx="47.6" cy="21.4" r="0.45" fill="#1f2937"/>
              </g>
              <!-- Strandbal die naast het badje stuitert -->
              <g style="animation:hero-ball 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite">
                <circle cx="80" cy="37" r="4.6" fill="#f8fafc"/>
                <path d="M80 32.4 A4.6 4.6 0 0 1 84.6 37 L80 37 Z" fill="#ef4444"/>
                <path d="M80 41.6 A4.6 4.6 0 0 1 75.4 37 L80 37 Z" fill="#3b82f6"/>
                <path d="M75.4 37 A4.6 4.6 0 0 1 80 32.4 L80 37 Z" fill="#facc15"/>
                <circle cx="78.4" cy="35" r="1" fill="rgba(255,255,255,0.7)"/>
              </g>
            </svg>`;
        }

        // Deeltjes van het seizoen (niet bij zware regen of onweer)
        const calm = !storm && w !== 'pouring';
        if (springy && calm && !rain) {
          for (let i = 0; i < 16; i++) {
            out += `<div style="position:absolute;left:${rnd() * 100}%;top:-6%;width:7px;height:5px;border-radius:60% 40% 60% 40%;
              background:${['#f9c5d5', '#fde2ea', '#ffffff'][i % 3]};opacity:0.9;
              animation:hero-petal ${9 + rnd() * 7}s linear ${-rnd() * 15}s infinite"></div>`;
          }
        }
        if (theme === 'herfst' && calm) {
          const leaves = Math.round(10 + Math.min(14, windSpeed));
          for (let i = 0; i < leaves; i++) {
            out += `<ha-icon icon="mdi:leaf" style="position:absolute;left:${rnd() * 100}%;top:-8%;--mdc-icon-size:${12 + rnd() * 8}px;
              color:${['#d9692b', '#b8442a', '#e0a030', '#c9772f'][i % 4]};
              animation:hero-leaf ${Math.max(5, 12 - windSpeed / 2) + rnd() * 5}s linear ${-rnd() * 14}s infinite"></ha-icon>`;
          }
        }
        if (theme === 'zomer' && !day && !rain) {
          for (let i = 0; i < 18; i++) {
            out += `<div style="position:absolute;left:${rnd() * 100}%;top:${55 + rnd() * 35}%;width:3px;height:3px;border-radius:50%;
              background:#e8ff8a;box-shadow:0 0 8px 3px rgba(220,255,120,0.7);
              animation:hero-firefly ${4 + rnd() * 4}s ease-in-out ${-rnd() * 6}s infinite"></div>`;
          }
        }
        if (springy && day && !rain && !storm) {
          // Een zwerm vogels in V-vorm die langzaam overvliegt
          out += `<svg viewBox="0 0 60 20" style="position:absolute;top:20%;left:-15%;width:90px;height:30px;animation:hero-birds 40s linear -12s infinite">
              ${[[30, 6], [22, 10], [38, 10], [14, 14], [46, 14]].map(([x, y]) => `<path d="M${x - 3} ${y} Q${x - 1.5} ${y - 2} ${x} ${y} Q${x + 1.5} ${y - 2} ${x + 3} ${y}" stroke="rgba(20,30,45,0.75)" stroke-width="0.9" fill="none"/>`).join('')}
            </svg>`;
        }

        // Nieuwjaar: vuurwerk
        if (theme === 'nieuwjaar') {
          [[22, 22, '#ffd166'], [48, 14, '#ff5a5a'], [74, 24, '#7ee787'], [62, 34, '#7aa2ff'], [36, 30, '#ff9ec7']].forEach(([x, y, c], b) => {
            let sparks = '';
            for (let i = 0; i < 16; i++) {
              sparks += `<div style="position:absolute;left:0;top:0;width:3px;height:3px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c};
                --angle:${i * 22.5}deg;animation:hero-spark 3.2s ease-out ${b * 0.8}s infinite"></div>`;
            }
            out += `<div style="position:absolute;left:${x}%;top:${y}%">${sparks}</div>`;
          });
        }

        // Winter: ijsbloemen langs de randen
        if (theme === 'winter') {
          out += `<div style="position:absolute;inset:0;pointer-events:none;border-radius:28px;
            background:radial-gradient(ellipse at 0% 0%, rgba(230,242,255,0.45), transparent 22%),
                       radial-gradient(ellipse at 100% 0%, rgba(230,242,255,0.35), transparent 18%),
                       radial-gradient(ellipse at 0% 100%, rgba(230,242,255,0.3), transparent 20%),
                       radial-gradient(ellipse at 100% 100%, rgba(230,242,255,0.4), transparent 22%);
            box-shadow:inset 0 0 40px rgba(220,236,255,0.35)"></div>`;
        }

        // Donkere waas linksonder zodat de tekst altijd leesbaar is
        out += `<div style="position:absolute;inset:0;background:linear-gradient(15deg, rgba(5,8,18,0.62) 0%, rgba(5,8,18,0.18) 45%, transparent 75%)"></div>`;
        // Label linksboven: het thema (met aftellen naar pakjesavond of kerst), en een eventuele weerwaarschuwing
        const nightsTo = (monthIndex, day) => {
          let target = new Date(today.getFullYear(), monthIndex, day);
          if (target < dayOnly(today)) target = new Date(today.getFullYear() + 1, monthIndex, day);
          return Math.ceil((target - dayOnly(today)) / 86400000);
        };
        const labels = {
          lente: '🌸 Lente', zomer: '☀️ Zomer', herfst: '🍂 Herfst', winter: '❄️ Winter', pasen: '🐣 Pasen',
          sinterklaas: month === 12 && date === 5 ? '🎁 Pakjesavond!' : `🎁 Sinterklaas · nog ${nightsTo(11, 5)} nachtjes`,
          kerst: month === 12 && date >= 25 && date <= 26 ? '🎄 Fijne kerst!'
            : month === 12 && date < 25 ? `🎄 Kerst · nog ${nightsTo(11, 25)} nachtjes` : '🎄 Kerst',
          nieuwjaar: month === 12 && date === 31 ? '🥂 Oudejaarsdag' : '🎆 Gelukkig nieuwjaar!',
          halloween: month === 10 && date === 31 ? '🎃 Happy Halloween!' : '🎃 Halloween'
        };
        let badges = `<div style="display:inline-block;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,0.28);backdrop-filter:blur(6px);
            font-size:12px;color:#fff;white-space:nowrap">${labels[theme]}</div>`;
        if (celebration) {
          const age = celebrationYears > 0 ? ` · ${celebrationYears} jaar` : '';
          const [text, background] = {
            birthday: [`${celebration.name === 'Pixel' ? '🐱' : '🎂'} Hoera, ${celebration.name} is jarig${age}!`, 'linear-gradient(90deg, #ef4444, #f59e0b, #3b82f6)'],
            love: [celebration.valentine ? '💘 Fijne Valentijnsdag!' : `💕 ${celebrationYears > 0 ? `${celebrationYears} jaar samen` : 'Ons jubileum'}!`, 'linear-gradient(90deg, #f43f5e, #fb7185)'],
            king: ['👑 Fijne Koningsdag!', 'linear-gradient(90deg, #ea580c, #f97316)'],
            liberation: ['🕊️ Fijne Bevrijdingsdag!', 'linear-gradient(90deg, #ae1c28, #21468b)'],
            remembrance: [`🕯️ Dodenherdenking${today.getHours() < 20 || (today.getHours() === 20 && today.getMinutes() < 3) ? ' · om 20:00 twee minuten stilte' : ''}`,
              'rgba(30,32,40,0.75)']
          }[celebration.kind];
          badges += `<div style="margin-top:6px;display:block;width:max-content;padding:5px 12px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;
              background:${background};box-shadow:0 4px 16px rgba(0,0,0,0.25)">${text}</div>`;
        }

        if (onVacation) badges += `<div style="margin-top:6px;display:block;width:max-content;padding:5px 12px;border-radius:12px;font-size:13px;font-weight:700;
            color:#fff;background:linear-gradient(90deg, #0ea5e9, #14b8a6);box-shadow:0 4px 16px rgba(0,0,0,0.25)">🧳 Op vakantie${sitterHome ? ' · Timo past op' : ''}</div>`;

        // Weerwaarschuwing (KNMI): pulserende rand en een banner in de kleur van de code
        if (states['binary_sensor.weer_thuis_waarschuwing_actief']?.state === 'on') {
          const code = String(states['sensor.weer_thuis_waarschuwingscode']?.state ?? '').toLowerCase();
          const color = code.includes('rood') || code.includes('red') ? '#ff4d4d'
            : code.includes('oranje') || code.includes('orange') ? '#ff9f1c' : '#ffd60a';
          const name = code.includes('rood') || code.includes('red') ? 'Code rood' : code.includes('oranje') || code.includes('orange') ? 'Code oranje' : 'Code geel';
          const text = String(states['sensor.weer_thuis_waarschuwingen']?.state ?? '').replace(/^(unknown|unavailable)$/, '');
          badges += `<div style="margin-top:6px;max-width:340px;padding:6px 12px;border-radius:12px;background:${color};color:#14161c;
              font-size:13px;font-weight:700;box-shadow:0 4px 18px ${color}88;white-space:normal;line-height:1.25">
              ⚠️ ${name}${text ? `<span style="font-weight:500"> · ${text.length > 90 ? text.slice(0, 88) + '…' : text}</span>` : ''}</div>`;
          out += `<div style="position:absolute;inset:0;border-radius:28px;pointer-events:none;box-shadow:inset 0 0 0 3px ${color}, inset 0 0 40px ${color}55;
              animation:hero-warning 2.4s ease-in-out infinite"></div>
            <div style="position:absolute;inset:0;background:rgba(10,12,20,0.15)"></div>`;
        }
        out += `<div style="position:absolute;left:16px;top:${theme === 'kerst' ? 46 : 16}px;z-index:2;text-align:left">${badges}</div>`;

        this._heroSky = { signature: skySignature, html: out };
        return out;
      ]]]
    clock:
      card:
        type: markdown
        text_only: true
        content: |
          {% set h = now().hour %}
          {% set greeting = 'Goedenacht' if h < 6 else 'Goedemorgen' if h < 12 else 'Goedemiddag' if h < 18 else 'Goedenavond' %}
          {% set days = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'] %}
          {% set months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'] %}
          ## {{ greeting }} {{ (user or '').split(' ')[0] }}
          # {{ now().strftime('%H:%M') }}
          {% set alarm = as_timestamp(states('sensor.hub_vincent_alarms'), 0) %}
          {{ days[now().weekday()] | capitalize }} {{ now().day }} {{ months[now().month - 1] }}{{ ' · ⏰ ' ~ (alarm | timestamp_custom('%H:%M')) if 0 < alarm - now().timestamp() < 86400 else '' }}{{ ' · 🎄' if is_state('binary_sensor.kerst', 'on') else '' }}
        card_mod:
          style:
            ha-markdown$: |
              :host, ha-markdown-element { overflow: visible !important; }
              h1 {
                font-size: clamp(52px, 9vw, 84px);
                font-weight: 200;
                letter-spacing: -3px;
                line-height: 1;
                margin: 2px 0 6px 0;
                color: #fff;
                text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
              }
              h2 {
                font-size: 18px;
                font-weight: 500;
                margin: 0;
                color: rgba(255, 255, 255, 0.85);
              }
              p {
                font-size: 15px;
                margin: 0;
                color: rgba(255, 255, 255, 0.75);
              }
            .: |
              ha-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
                overflow: visible !important;
                padding: 2px 8px !important;
              }
    # Lopende timers van de speakers: oranje pil met aftellende minuten:seconden die na 75% van de tijd rood wordt,
    # de laatste 20 seconden knippert en daarna "klaar!" toont (blijft 5 minuten staan). Alles via CSS-animaties,
    # zodat de kaart niet elke seconde opnieuw getekend hoeft te worden.
    timers: |
      [[[
        const known = { 'sensor.keuken_timers': 'Keuken', 'sensor.badkamer_speaker_timers': 'Badkamer', 'sensor.gang_speaker_1_timers': 'Gang',
                        'sensor.woonkamer_timers': 'Woonkamer', 'sensor.hub_vincent_timers': 'Slaapkamer' };
        const speakers = Object.keys(states)
          .filter(id => id.startsWith('sensor.') && id.endsWith('_timers'))
          .map(id => [id, known[id] ?? (states[id].attributes.friendly_name ?? id)
            .replace(/google home|timers?/gi, '').trim().split(/\s+/)[0] ?? id]);
        const seconds = d => typeof d === 'number' ? d : /^\d+:\d+(:\d+)?$/.test(String(d ?? ''))
          ? String(d).split(':').map(Number).reduce((total, part) => total * 60 + part) : NaN;
        const now = Date.now();
        window.huisTimerStart = window.huisTimerStart ?? {};
        // @property werkt niet in de shadow DOM van een kaart: de tel-variabelen eenmalig op paginaniveau registreren
        if (typeof document !== 'undefined' && !document.getElementById('huis-timer-properties')) {
          const style = document.createElement('style');
          style.id = 'huis-timer-properties';
          style.textContent = ['--timer-t', '--timer-m', '--timer-s']
            .map(name => `@property ${name} { syntax: '<integer>'; inherits: true; initial-value: 0; }`).join(' ');
          document.head.appendChild(style);
        }
        // Alle timers van alle speakers (attribuut timers), anders de eerstvolgende uit de toestand; eerst aflopend eerst
        const timers = speakers.flatMap(([id, name]) => {
          const st = states[id];
          const list = Array.isArray(st?.attributes.timers) && st.attributes.timers.length ? st.attributes.timers : st ? [{}] : [];
          return list.map((timer, i) => {
            const end = timer.fire_time ? Number(timer.fire_time) * (Number(timer.fire_time) < 1e12 ? 1000 : 1)
              : new Date(timer.local_time_iso ?? (i === 0 ? st.state : NaN)).getTime();
            return { id: `${id}:${timer.timer_id ?? i}`, name, timer, end };
          });
        }).filter(t => !isNaN(t.end) && t.end >= now - 300000).sort((x, y) => x.end - y.end);
        return timers.map(({ id, name, timer, end }) => {
          let total = seconds(timer.duration);
          if (isNaN(total)) {
            // Geen duur bekend: rekenen vanaf het moment dat deze timer voor het eerst op het scherm stond
            window.huisTimerStart[id + end] = window.huisTimerStart[id + end] ?? now;
            total = (end - window.huisTimerStart[id + end]) / 1000;
          }
          total = Math.max(total, 1);
          const left = Math.max(0, (end - now) / 1000);
          const elapsed = total - left;
          const label = timer.label ? ` (${timer.label})` : '';
          return `<div style="position:relative;display:inline-flex;align-items:center;gap:8px;margin:6px 8px 0 0;padding:7px 14px;
                    border-radius:16px;color:#fff;overflow:hidden;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.25);
                    animation:hero-timer-color ${total}s linear ${-elapsed}s forwards,
                              hero-timer-blink 0.6s ease-in-out ${Math.max(0, left - 20)}s infinite">
                    <ha-icon icon="mdi:timer-outline" style="--mdc-icon-size:20px"></ha-icon>
                    <span style="white-space:nowrap">${name}${label}</span>
                    <span style="position:relative">
                      <span style="animation:hero-timer-hide 0s linear ${left}s forwards"><span class="hero-countdown"
                        style="--timer-from:${Math.round(left)};--timer-dur:${left}s;font-size:19px;font-weight:700"></span></span>
                      <span style="position:absolute;left:0;top:0;white-space:nowrap;opacity:0;font-size:19px;font-weight:700;animation:hero-timer-show 0s linear ${left}s forwards">klaar!</span>
                    </span>
                  </div>`;
        }).join('');
      ]]]
    temp: |
      [[[
        const names = {
          'clear-night': 'Helder', cloudy: 'Bewolkt', fog: 'Mist', hail: 'Hagel', lightning: 'Onweer',
          'lightning-rainy': 'Onweersbuien', partlycloudy: 'Half bewolkt', pouring: 'Stortregen', rainy: 'Regen',
          snowy: 'Sneeuw', 'snowy-rainy': 'Natte sneeuw', sunny: 'Zonnig', windy: 'Winderig', 'windy-variant': 'Winderig'
        };
        const num = id => parseFloat(states[id]?.state);
        const deg = v => isNaN(v) ? '–' : `${Math.round(v)}°`;
        const now = num('sensor.weer_thuis_temperatuur');

        // Pollen: alle soorten (planten en pollentypen) vanaf 'Laag', hoogste eerst; geen, zeer laag of onbekend wordt niet getoond
        const levels = ['Geen', 'Zeer laag', 'Laag', 'Matig', 'Hoog', 'Zeer hoog'];
        const colors = ['#4ade80', '#a3e635', '#facc15', '#fb923c', '#ff6b6b'];
        const pollenNames = {
          gras: 'Gras', onkruid: 'Onkruid', grassen: 'Grassen', berk: 'Berk', els: 'Els', es: 'Es', eik: 'Eik', hazelaar: 'Hazelaar',
          olijfboom: 'Olijfboom', pijnboom: 'Pijnboom', cottonwood: 'Populier', ambrosia: 'Ambrosia', bijvoet: 'Bijvoet'
        };
        const pollenIcon = key => ['gras', 'grassen'].includes(key) ? 'mdi:grass' : ['onkruid', 'ambrosia', 'bijvoet'].includes(key) ? 'mdi:sprout-outline' : 'mdi:tree-outline';
        const present = Object.entries(states)
          .filter(([id]) => /^sensor\.thuis_(planten|pollentypen)_52_035_53_/.test(id))
          .map(([id, st]) => ({ key: id.split('_').pop(), level: Math.round(parseFloat(st.state)) }))
          .filter(p => pollenNames[p.key] && p.level >= 2)  // vanaf 'Laag'; 'Zeer laag' is niet de moeite
          .map(p => ({ label: pollenNames[p.key], icon: pollenIcon(p.key), level: p.level }))
          .sort((a, b) => b.level - a.level)
          .slice(0, 3);
        const pill = p => `<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:12px;
              background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);font-size:12px;text-shadow:none">
              <ha-icon icon="${p.icon}" style="--mdc-icon-size:15px;color:${colors[p.level - 1]}"></ha-icon>
              <span>${p.label} · ${levels[p.level]}</span>
              <span style="display:inline-flex;gap:2px">${colors.map((c, i) =>
                `<span style="width:4px;height:9px;border-radius:2px;background:${i < p.level ? c : 'rgba(255,255,255,0.2)'}"></span>`).join('')}</span>
            </div>`;
        const pollen = present.length
          ? `<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px">${present.map(pill).join('')}</div>`
          : '';
        return `<div style="text-align:right;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,0.45)">
                  <div style="font-size:48px;font-weight:300;line-height:1">${isNaN(now) ? '–' : now.toFixed(1).replace('.', ',') + '°'}</div>
                  <div style="font-size:15px;margin-top:4px">${names[[states['weather.weer_thuis_waarnemingen']?.state, states['weather.weer_thuis']?.state].find(v => names[v])] ?? ''}</div>
                  <div style="font-size:13px;opacity:0.8;margin-top:2px">
                    ↑ ${deg(num('sensor.weer_thuis_max_temperatuur_vandaag'))} &nbsp; ↓ ${deg(num('sensor.weer_thuis_min_temperatuur_vandaag'))}
                  </div>
                  ${pollen}
                </div>`;
      ]]]
    # Personen als geneste kaarten, zodat je erop kunt tikken om slapen aan of uit te zetten
    persons:
      card:
        type: custom:button-card
        show_icon: false
        show_name: false
        tap_action:
          action: none
        styles:
          card:
            - cursor: default
            - background: none
            - border: none
            - box-shadow: none
            - backdrop-filter: none
            - padding: 0
          grid:
            - display: flex
            - flex-wrap: wrap
            - justify-content: flex-end
            - gap: 6px
        custom_fields:
          v:
            card:
              type: custom:button-card
              template: hero_person
              entity: person.vincent_maarschalkerweerd
              variables:
                sleeping: input_boolean.sleepingvincent
                working: input_boolean.workingvincent
                battery: sensor.vincent_phone_battery_level
                charging: binary_sensor.vincent_phone_is_charging
                distance: sensor.thuis_sm_s938b_distance
                direction: sensor.thuis_sm_s938b_direction_of_travel
          c:
            card:
              type: custom:button-card
              template: hero_person
              entity: person.carleen
              variables:
                sleeping: input_boolean.sleepingcarleen
                working: input_boolean.workingcarleen
                battery: sensor.carleen_mobiel_battery_level
                charging: sensor.carleen_mobiel_battery_state
  styles:
    card:
      - cursor: default
      - height: 320px
      - padding: 0
      - overflow: hidden
      - border-radius: 28px
      - border: none
      - background: "#0b0f19"
    grid:
      - grid-template-areas: '"clock persons" "clock temp" "timers temp"'
      - grid-template-columns: 1fr auto
      - grid-template-rows: auto 1fr auto
    custom_fields:
      sky:
        - position: absolute
        - inset: 0
        - overflow: hidden
        - pointer-events: none
      clock:
        - z-index: 1
        - align-self: end
        - justify-self: start
        - padding: 0 0 18px 10px
        - text-align: left
      timers:
        - z-index: 1
        - justify-self: start
        - align-self: end
        - padding: 0 0 16px 18px
        - text-align: left
      persons:
        - z-index: 1
        - justify-self: end
        - padding: 16px 16px 0 0
      temp:
        - z-index: 1
        - align-self: end
        - justify-self: end
        - padding: 0 22px 24px 0

# Apparaat in het netwerk (device_tracker van de router): naam, IP en hoe het verbonden is.
network_device:
  template: glass
  show_label: true
  tap_action:
    action: more-info
  name: '[[[ return entity.attributes.friendly_name ?? entity.entity_id; ]]]'
  icon: |
    [[[
      const c = String(entity.attributes.connection_type ?? '').toLowerCase();
      if (entity.state !== 'home') return 'mdi:lan-disconnect';
      if (c.includes('wire') || c.includes('lan') || c.includes('kabel')) return 'mdi:ethernet';
      if (c.includes('5')) return 'mdi:wifi';
      if (c.includes('2')) return 'mdi:wifi-strength-2';
      return 'mdi:devices';
    ]]]
  label: |
    [[[
      const c = String(entity.attributes.connection_type ?? '').toLowerCase();
      const kind = c.includes('wire') || c.includes('lan') ? 'Kabel'
        : c.includes('5') ? '5 GHz' : c.includes('2') ? '2,4 GHz' : (entity.attributes.connection_type ?? '');
      return [entity.attributes.ip, entity.state === 'home' ? kind : 'Offline'].filter(Boolean).join(' · ');
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: auto 1fr
      - column-gap: 12px
    card:
      - height: 64px
      - padding: 10px 14px
      - opacity: '[[[ return entity.state === "home" ? 1 : 0.55; ]]]'
    img_cell:
      - width: 38px
      - height: 38px
      - border-radius: 50%
      - background: rgba(255, 255, 255, 0.08)
    icon:
      - width: 20px
      - color: |
          [[[
            const c = String(entity.attributes.connection_type ?? '').toLowerCase();
            if (entity.state !== 'home') return 'rgba(242, 244, 248, 0.4)';
            return c.includes('wire') || c.includes('lan') ? '#7aa2ff' : c.includes('5') ? '#4ade80' : '#ffb060';
          ]]]
    name:
      - font-size: 14px
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
    label:
      - font-family: monospace
      - font-size: 12px

# Teller: aantal verbonden apparaten, eventueel per verbindingstype (variables.kind: all, wired, 5ghz, 2ghz).
network_count:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    kind: all
  label: |
    [[[
      const kindOf = s => {
        const c = String(s.attributes.connection_type ?? '').toLowerCase();
        return c.includes('wire') || c.includes('lan') ? 'wired' : c.includes('5') ? '5ghz' : c.includes('2') ? '2ghz' : 'other';
      };
      const online = Object.values(states).filter(s =>
        s.entity_id.startsWith('device_tracker.') && s.attributes.ip && s.state === 'home');
      const n = variables.kind === 'all' ? online.length : online.filter(s => kindOf(s) === variables.kind).length;
      return String(n);
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "l l"'
      - grid-template-columns: auto 1fr
      - column-gap: 10px
    card:
      - height: 96px
    icon:
      - width: 20px
      - color: var(--accent-color)
    name:
      - font-size: 13px
      - opacity: 0.8
    label:
      - font-size: 28px
      - font-weight: 700
      - opacity: 1
      - align-self: end

# Knop "Speel hier" naast de speaker van een kamer (entity = de speaker).
# Speelt Spotify al ergens anders, dan verhuist de muziek naar deze speaker; anders start variables.playlist hier.
# Groen als de muziek nu op deze speaker speelt. Of er muziek speelt weet de gewone Spotify-speler; verhuizen gaat via
# SpotifyPlus, want alleen die kent alle speakers (de gewone kent de Cast-speakers niet als bron).
play_here:
  template: action
  triggers_update: all
  variables:
    spotify: media_player.spotify_vincent_maarschalkerweerd
    transfer: media_player.spotifyplus_vincent_maarschalkerweerd
    playlist: https://open.spotify.com/playlist/6oZLDHU5xcpk3lwe8ZXnqd
  icon: mdi:music-note-plus
  name: '[[[ return entity.state === "playing" ? "Speelt hier" : "Speel hier"; ]]]'
  tap_action:
    action: javascript
    javascript: |
      [[[
        const spotify = states[variables.spotify];
        const name = (entity.attributes.friendly_name ?? '').toLowerCase();
        const source = (states[variables.transfer]?.attributes.source_list ?? []).find(s => s.toLowerCase() === name);
        if (spotify?.state === 'playing' && source) {
          hass.callService('media_player', 'select_source', { entity_id: variables.transfer, source });
          return;
        }
        const deviceId = hass.entities?.[entity.entity_id]?.device_id;
        hass.callService('spotcast', 'play_media', {
          media_player: deviceId ? { device_id: deviceId } : { entity_id: entity.entity_id },
          spotify_uri: variables.playlist,
          data: { shuffle: true }
        });
      ]]]
  styles:
    card:
      - height: 100%
      - min-height: 64px
      - background: '[[[ return entity.state === "playing" ? "rgba(74, 222, 128, 0.22)" : "rgba(255, 255, 255, 0.06)"; ]]]'
    icon:
      - color: '[[[ return entity.state === "playing" ? "#4ade80" : "var(--accent-color)"; ]]]'
    name:
      - font-size: 12px

# Grote tegel op de Media-overzichtspagina. variables.color: kleur van de gloed (r, g, b).
media_tile:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    color: 122, 162, 255
  styles:
    grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-rows: 1fr auto auto
      - justify-items: start
    card:
      - height: 150px
      - padding: 18px
      - background: |
          [[[ return `linear-gradient(140deg, rgba(${variables.color}, 0.38) 0%, rgba(${variables.color}, 0.08) 60%, rgba(255, 255, 255, 0.03) 100%)`; ]]]
      - box-shadow: '[[[ return `0 10px 34px rgba(${variables.color}, 0.18)`; ]]]'
    img_cell:
      - justify-self: start
      - align-self: start
      - width: 48px
      - height: 48px
      - border-radius: 14px
      - background: '[[[ return `rgba(${variables.color}, 0.25)`; ]]]'
    icon:
      - width: 26px
      - color: '[[[ return `rgb(${variables.color})`; ]]]'
    name:
      - font-size: 19px
      - font-weight: 700
    label:
      - font-size: 12px
      - opacity: 0.8
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%

# Snel een playlist starten. Speelt op de speaker waar de muziek nu al speelt, anders in de kamer met de laatste
# beweging, anders in de woonkamer. variables.playlist: Spotify-URL.
playlist:
  template: action
  variables:
    # Spotify-spelers die weten op welk apparaat er gespeeld wordt (attribuut source)
    spotify:
      - media_player.spotify_vincent_maarschalkerweerd
      - media_player.spotifyplus_vincent_maarschalkerweerd
    # De speakers, groepen eerst: speelt het hele huis, dan ook daar verder
    speakers:
      - media_player.hele_huis
      - media_player.friends_speakers
      - media_player.woonkamer
      - media_player.nestmini9818
      - media_player.googlehome0351
      - media_player.hub_vincent
      - media_player.googlehome7421
      - media_player.googlehome8627
    playlist: ""
    rooms:
      - [binary_sensor.motionwoonkamer, media_player.woonkamer]
      - [binary_sensor.badkamer_motion, media_player.googlehome0351]
      - [binary_sensor.gang_motion, media_player.friends_speakers]
  tap_action:
    action: javascript
    javascript: |
      [[[
        // 1. Een speaker die nu speelt, 2. het apparaat waar Spotify op speelt
        const active = variables.speakers.find(id => states[id]?.state === 'playing');
        const source = variables.spotify.map(id => states[id]).find(s => s?.state === 'playing' && s.attributes.source)?.attributes.source;
        const bySource = source ? variables.speakers.find(id => states[id] && states[id].state !== 'unavailable'
          && (states[id].attributes.friendly_name ?? '').toLowerCase() === source.toLowerCase()) : null;
        const lastMotion = variables.rooms
          .map(([motion, speaker]) => ({ speaker, at: new Date(states[motion]?.last_changed ?? 0) }))
          .sort((a, b) => b.at - a.at)[0];
        const target = active ?? bySource ?? lastMotion?.speaker ?? 'media_player.woonkamer';
        const deviceId = hass.entities?.[target]?.device_id;
        hass.callService('spotcast', 'play_media', {
          media_player: deviceId ? { device_id: deviceId } : { entity_id: target },
          spotify_uri: variables.playlist,
          data: { shuffle: true }
        });
      ]]]

# Oral-B tandenborstel: status, poetstijd als ring (2 minuten = vol), kwadrant, druk en batterij.
toothbrush:
  template: glass
  triggers_update:
    - sensor.smart_series_4000_97ae_toothbrush_state
    - sensor.smart_series_4000_97ae_time
    - sensor.smart_series_4000_97ae_sector
    - sensor.smart_series_4000_97ae_pressure
    - sensor.smart_series_4000_97ae_battery
    - sensor.smart_series_4000_97ae_mode
  entity: sensor.smart_series_4000_97ae_toothbrush_state
  show_icon: false
  show_label: true
  name: |
    [[[
      const map = { running: 'Aan het poetsen', idle: 'Klaar', charging: 'Laadt op', 'power off': 'Uit', unavailable: 'Niet in de buurt' };
      return map[entity.state] ?? entity.state;
    ]]]
  label: |
    [[[
      const s = id => states[`sensor.smart_series_4000_97ae_${id}`]?.state;
      const modes = { daily_clean: 'Dagelijks', sensitive: 'Gevoelig', massage: 'Massage', whitening: 'Whitening',
                      deep_clean: 'Dieptereiniging', tongue_cleaning: 'Tong', turbo: 'Turbo', off: 'Uit' };
      const pressure = { normal: 'Druk goed', high: 'Te hard!', low: 'Druk laag' };
      const parts = [];
      if (s('mode') && !['unknown', 'unavailable'].includes(s('mode'))) parts.push(modes[s('mode')] ?? s('mode'));
      if (entity.state === 'running' && s('pressure')) parts.push(pressure[s('pressure')] ?? s('pressure'));
      const battery = parseInt(s('battery'));
      if (!isNaN(battery)) parts.push(`🔋 ${battery}%`);
      return parts.join(' · ');
    ]]]
  custom_fields:
    ring: |
      [[[
        const sec = parseInt(states['sensor.smart_series_4000_97ae_time']?.state) || 0;
        const pct = Math.min(100, sec / 120 * 100);
        const sector = parseInt(String(states['sensor.smart_series_4000_97ae_sector']?.state ?? '').replace(/\D/g, '')) || 0;
        const running = entity.state === 'running';
        const tooHard = states['sensor.smart_series_4000_97ae_pressure']?.state === 'high';
        const color = tooHard ? '#ff6b6b' : pct >= 100 ? '#4ade80' : '#7aa2ff';
        const quadrants = [1, 2, 3, 4].map(q =>
          `<div style="width:8px;height:8px;border-radius:2px;background:${running && q === sector ? color : q < sector || pct >= 100 ? 'rgba(74,222,128,0.7)' : 'rgba(255,255,255,0.12)'}"></div>`).join('');
        return `<div style="width:86px;height:86px;border-radius:50%;
                  background:conic-gradient(${color} ${pct * 3.6}deg, rgba(255,255,255,0.08) 0);
                  display:flex;align-items:center;justify-content:center">
                  <div style="width:70px;height:70px;border-radius:50%;background:#121828;display:flex;flex-direction:column;
                    align-items:center;justify-content:center;gap:4px">
                    <span style="font-size:18px;font-weight:700">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</span>
                    <div style="display:grid;grid-template-columns:8px 8px;gap:2px">${quadrants}</div>
                  </div>
                </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"ring n" "ring l"'
      - grid-template-columns: auto 1fr
      - column-gap: 16px
    card:
      - height: 112px
    name:
      - align-self: end
      - font-size: 17px
    label:
      - align-self: start
      - white-space: normal
      - text-align: left


# Tab in de menubalk van Media. Licht op als je op die pagina bent (variables.path).
tab:
  template: glass
  variables:
    path: ""
  styles:
    grid:
      - grid-template-areas: '"i" "n"'
      - row-gap: 4px
    card:
      - height: 62px
      - padding: 8px 4px
      - background: |
          [[[ return window.location.pathname === variables.path ? 'rgba(255, 176, 96, 0.22)' : 'rgba(255, 255, 255, 0.05)'; ]]]
      - border: |
          [[[ return window.location.pathname === variables.path ? '1px solid rgba(255, 176, 96, 0.5)' : '1px solid rgba(255, 255, 255, 0.08)'; ]]]
    icon:
      - width: 22px
      - color: '[[[ return window.location.pathname === variables.path ? "var(--accent-color)" : "var(--secondary-text-color)"; ]]]'
    name:
      - justify-self: center
      - font-size: 12px
      - font-weight: 500

# Persoon in de weer-hero: foto (of letter), naam, telefoonbatterij en thuis/weg/slaapt (met afstand en richting).
# Tik zet slapen aan of uit (variables.sleeping), lang drukken toont de persoon.
# Optioneel: variables.battery / charging (telefoon) en distance / direction (Proximity-sensoren van de zone Thuis).
hero_person:
  show_icon: false
  show_name: false
  variables:
    sleeping: null
    working: null
    battery: null
    charging: null
    distance: null
    direction: null
  tap_action:
    action: javascript
    haptic: medium
    javascript: "[[[ hass.callService('input_boolean', 'toggle', { entity_id: variables.sleeping }); ]]]"
  hold_action:
    action: more-info
  triggers_update: all
  custom_fields:
    pill: |
      [[[
        const home = entity?.state === 'home';
        const asleep = states[variables.sleeping]?.state === 'on';
        const first = (entity?.attributes.friendly_name ?? '?').split(' ')[0];
        const working = !asleep && states[variables.working]?.state === 'on';
        let status = asleep ? 'Slaapt' : working ? (home ? 'Werkt thuis' : 'Aan het werk')
          : home ? 'Thuis' : entity?.state === 'not_home' ? 'Weg' : entity?.state ?? '';

        // Onderweg: afstand tot huis en of de persoon naar huis komt
        const d = states[variables.distance];
        const meters = parseFloat(d?.state) * (d?.attributes.unit_of_measurement === 'km' ? 1000 : 1);
        if (!home && !isNaN(meters)) {
          const dist = meters >= 1000 ? `${(meters / 1000).toFixed(meters >= 10000 ? 0 : 1).replace('.', ',')} km` : `${Math.round(meters)} m`;
          const dir = { towards: ' · komt eraan', away_from: ' · gaat weg' }[states[variables.direction]?.state] ?? '';
          status = `${working ? 'Werkt · ' : ''}${dist}${dir}`;
        }

        // Telefoonbatterij: klein, rood als hij bijna leeg is, bliksem als hij laadt
        const level = parseInt(states[variables.battery]?.state);
        const charging = ['on', 'charging'].includes(states[variables.charging]?.state);
        const batteryHtml = isNaN(level) ? '' : ` · <span style="color:${level <= 20 && !charging ? '#ff6b6b' : 'inherit'}">${charging ? '⚡' : '🔋'}${level}%</span>`;

        const ring = asleep ? 'rgba(167,139,250,0.9)' : working ? 'rgba(251,191,36,0.9)' : home ? 'rgba(74,222,128,0.8)' : 'rgba(255,255,255,0.15)';
        const avatar = entity?.attributes.entity_picture
          ? `<img src="${entity.attributes.entity_picture}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">`
          : `<div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;
               align-items:center;justify-content:center;font-weight:700">${first[0]}</div>`;
        return `<div style="display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:20px;
                  background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);color:#fff;box-shadow:inset 0 0 0 2px ${ring}">
                  ${avatar}
                  <div style="line-height:1.15;text-align:left">
                    <div style="font-size:13px;font-weight:600;white-space:nowrap">${first}</div>
                    <div style="font-size:11px;opacity:0.85;white-space:nowrap">${asleep ? '😴 ' : working ? '💼 ' : ''}${status}${batteryHtml}</div>
                  </div>
                </div>`;
      ]]]
  styles:
    card:
      - cursor: pointer
      - background: none
      - border: none
      - box-shadow: none
      - backdrop-filter: none
      - padding: 0
      - overflow: visible
    grid:
      - grid-template-areas: '"pill"'
# Verwachting per uur als strook die je horizontaal doorschuift: tijd, icoon, temperatuurlijn, regen (mm en kans).
# Bron: sensor.weer_verwachting_per_uur (template-sensor met het attribuut forecast, zie README).
forecast_strip:
  template: glass
  entity: sensor.weer_verwachting_per_uur
  show_icon: false
  show_name: false
  # Tik schuift de strook 6 uur verder (aan het eind terug naar het begin), dubbeltik schuift terug.
  # Dit loopt via button-card zelf; slepen en het muiswiel werken binnen button-card niet betrouwbaar.
  tap_action:
    action: javascript
    javascript: |
      [[[
        const strip = this.shadowRoot?.querySelector('.strip');
        if (!strip) return;
        const atEnd = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 4;
        strip.scrollTo({ left: atEnd ? 0 : strip.scrollLeft + 348, behavior: 'smooth' });
      ]]]
  double_tap_action:
    action: javascript
    javascript: |
      [[[
        const strip = this.shadowRoot?.querySelector('.strip');
        if (strip) strip.scrollTo({ left: Math.max(0, strip.scrollLeft - 348), behavior: 'smooth' });
      ]]]
  custom_fields:
    strip: |
      [[[
        const forecast = (entity?.attributes.forecast ?? []).slice(0, 48);
        if (!forecast.length) return '<div style="opacity:.6;padding:8px">Nog geen verwachting. Voeg de template-sensor toe (zie README).</div>';
        const icons = {
          sunny: ['mdi:weather-sunny', '#ffd166'], 'clear-night': ['mdi:weather-night', '#c7d2fe'],
          partlycloudy: ['mdi:weather-partly-cloudy', '#ffe08a'], cloudy: ['mdi:weather-cloudy', '#cbd5e1'],
          rainy: ['mdi:weather-rainy', '#7aa2ff'], pouring: ['mdi:weather-pouring', '#5b8cff'],
          lightning: ['mdi:weather-lightning', '#facc15'], 'lightning-rainy': ['mdi:weather-lightning-rainy', '#facc15'],
          snowy: ['mdi:weather-snowy', '#e2e8f0'], 'snowy-rainy': ['mdi:weather-snowy-rainy', '#bfdbfe'],
          fog: ['mdi:weather-fog', '#cbd5e1'], hail: ['mdi:weather-hail', '#bfdbfe'],
          windy: ['mdi:weather-windy', '#cbd5e1'], 'windy-variant': ['mdi:weather-windy-variant', '#cbd5e1']
        };
        const days = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
        const col = 58;
        const temps = forecast.map(f => parseFloat(f.temperature));
        const min = Math.min(...temps), max = Math.max(...temps);
        const y = t => 14 + (1 - (t - min) / Math.max(1, max - min)) * 46;
        const points = temps.map((t, i) => `${i * col + col / 2},${y(t).toFixed(1)}`).join(' ');
        const area = `0,74 ${points} ${forecast.length * col},74`;

        const columns = forecast.map((f, i) => {
          const d = new Date(f.datetime);
          const hour = d.getHours();
          const night = hour < 7 || hour >= 20;
          let [icon, color] = icons[f.condition] ?? ['mdi:weather-cloudy', '#cbd5e1'];
          if (f.condition === 'partlycloudy' && night) icon = 'mdi:weather-night-partly-cloudy';
          const mm = parseFloat(f.precipitation) || 0;
          const chance = f.precipitation_probability;
          const bar = Math.min(28, mm * 7);
          const label = i === 0 ? 'Nu' : hour === 0 ? days[d.getDay()] : `${String(hour).padStart(2, '0')}:00`;
          return `<div style="flex:0 0 ${col}px;display:flex;flex-direction:column;align-items:center;scroll-snap-align:start;
                    ${hour === 0 && i > 0 ? 'border-left:1px solid rgba(255,255,255,0.15);' : ''}">
                    <span style="font-size:12px;${hour === 0 || i === 0 ? 'font-weight:700;color:var(--accent-color)' : 'opacity:.7'}">${label}</span>
                    <ha-icon icon="${icon}" style="--mdc-icon-size:26px;color:${color};margin:6px 0 2px"></ha-icon>
                    <div style="height:78px"></div>
                    <div style="height:30px;display:flex;align-items:flex-end">
                      <div style="width:18px;height:${bar}px;border-radius:4px 4px 0 0;background:linear-gradient(#7aa2ff,#3b6fe0)"></div>
                    </div>
                    <span style="font-size:11px;color:#9db8ff;height:14px">${mm > 0 ? mm.toFixed(1).replace('.', ',') : ''}</span>
                    <span style="font-size:10px;opacity:.55;height:13px">${chance != null && chance > 0 ? chance + '%' : ''}</span>
                  </div>`;
        }).join('');

        const labels = temps.map((t, i) =>
          `<text x="${i * col + col / 2}" y="${(y(t) - 7).toFixed(1)}" text-anchor="middle" fill="#f2f4f8" font-size="12" font-weight="600">${Math.round(t)}°</text>
           <circle cx="${i * col + col / 2}" cy="${y(t).toFixed(1)}" r="3" fill="#ffb060"/>`).join('');
        // Pijltjes als hint: tik op de kaart schuift verder, dubbeltik terug
        const arrow = (dir, icon) => `<div style="position:absolute;top:58px;${dir < 0 ? 'left:-4px' : 'right:-4px'};z-index:2;width:30px;height:30px;
            border-radius:50%;pointer-events:none;display:flex;align-items:center;justify-content:center;
            background:rgba(18,24,40,0.85);border:1px solid rgba(255,255,255,0.15)">
            <ha-icon icon="${icon}" style="--mdc-icon-size:20px"></ha-icon></div>`;
        return `<div style="font-size:11px;opacity:.5;text-align:right;margin:-4px 4px 6px">veeg of tik voor later · dubbeltik terug</div>
                <div style="position:relative">${arrow(-1, 'mdi:chevron-left')}${arrow(1, 'mdi:chevron-right')}
                <div class="strip" style="overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;
                  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.2) transparent;padding-bottom:6px">
                  <div style="position:relative;width:${forecast.length * col}px">
                    <div style="display:flex">${columns}</div>
                    <svg width="${forecast.length * col}" height="78" style="position:absolute;left:0;top:50px;overflow:visible">
                      <defs><linearGradient id="tempFill" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0" stop-color="rgba(255,176,96,0.35)"/><stop offset="1" stop-color="rgba(255,176,96,0)"/>
                      </linearGradient></defs>
                      <polygon points="${area}" fill="url(#tempFill)"/>
                      <polyline points="${points}" fill="none" stroke="#ffb060" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
                      ${labels}
                    </svg>
                  </div>
                </div></div>`;
      ]]]
  styles:
    card:
      - padding: 14px 10px 8px
    grid:
      - grid-template-areas: '"strip"'
    custom_fields:
      strip:
        - display: block
        - width: 100%
        - overflow: hidden

# Samenvatting bovenaan een pagina: icoon in een cirkel, een kop (aandachtspunten of "alles in orde") en korte info.
# Per kaart: icon, name (kop), label (korte info) en variables.level ("ok", "warn" of "bad") voor de kleur.
summary:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    level: ok
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: auto 1fr
      - column-gap: 16px
    card:
      - min-height: 96px
      - padding: 18px
    img_cell:
      - width: 60px
      - height: 60px
      - border-radius: 50%
      - background: |
          [[[ return { bad: 'rgba(255, 107, 107, 0.2)', warn: 'rgba(255, 176, 96, 0.2)' }[variables.level] ?? 'rgba(74, 222, 128, 0.2)'; ]]]
    icon:
      - width: 34px
      - color: '[[[ return { bad: "#ff6b6b", warn: "#ffb060" }[variables.level] ?? "#4ade80"; ]]]'
    name:
      - font-size: 18px
      - white-space: normal
      - text-align: left
    label:
      - font-size: 13px
      - white-space: normal
      - text-align: left

# Wasadvies voor de hele dag: wanneer de wasmachine starten, met de stroomprijs én de kans om buiten te drogen.
# - Starten kan vanaf 08:00, het programma duurt 3 uur.
# - Buiten drogen kan als de 3 uur na het einde droog zijn en vóór zonsondergang vallen;
#   zonnig telt het zwaarst, dan half bewolkt/winderig, dan bewolkt.
# - Een moment met buiten drogen mag tot ~€ 0,10/kWh duurder zijn dan een moment zonder.
# - Na 20:00 het advies voor morgen (als die prijzen er zijn).
# Bronnen: hourly_prices van de ANWB-sensor en sensor.weer_verwachting_per_uur (template-sensor, zie README).
wash_advice:
  template: glass
  triggers_update:
    - sensor.anwb_electricity_all_in_price_current
    - sensor.weer_verwachting_per_uur
    - sun.sun
  show_icon: false
  show_name: false
  tap_action:
    action: none
  custom_fields:
    advice: |
      [[[
        const WASH_HOURS = 3, DRY_HOURS = 3, EARLIEST = 8, DRY_BONUS = 0.10;
        const time = h => `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
        const euro = v => `€ ${v.toFixed(2).replace('.', ',')}`;

        // Welke dag: vandaag, of morgen na 20:00 als die prijzen er al zijn
        const prices = Object.entries(states['sensor.anwb_electricity_all_in_price_current']?.attributes.hourly_prices ?? {})
          .map(([t, p]) => [new Date(t), parseFloat(p.all_in_price)])
          .filter(([t, v]) => !isNaN(t) && !isNaN(v));
        const now = new Date();
        const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
        const hasTomorrow = prices.some(([t]) => t.toDateString() === tomorrow.toDateString());
        const day = now.getHours() >= 20 && hasTomorrow ? tomorrow : now;
        const dayName = day === now ? 'Vandaag' : 'Morgen';
        const priceAt = {};
        prices.filter(([t]) => t.toDateString() === day.toDateString()).forEach(([t, v]) => { priceAt[t.getHours()] = v; });

        // Zonsondergang van die dag (sun.sun geeft de eerstvolgende; zo nodig een dag terug of verder rekenen)
        const nextSetting = new Date(states['sun.sun']?.attributes.next_setting ?? NaN);
        let sunset = 18;
        if (!isNaN(nextSetting)) {
          const s = new Date(nextSetting);
          while (s.toDateString() !== day.toDateString() && s > day) s.setDate(s.getDate() - 1);
          while (s.toDateString() !== day.toDateString() && s < day) s.setDate(s.getDate() + 1);
          sunset = s.getHours() + s.getMinutes() / 60;
        }

        // Droogweer per uur uit de verwachting
        const quality = { sunny: 1, partlycloudy: 0.75, windy: 0.7, 'windy-variant': 0.6, cloudy: 0.4, fog: 0.15 };
        const forecast = {};
        (states['sensor.weer_verwachting_per_uur']?.attributes.forecast ?? []).forEach(f => {
          const t = new Date(f.datetime);
          if (t.toDateString() !== day.toDateString()) return;
          const dry = !(parseFloat(f.precipitation) > 0) && !(f.precipitation_probability >= 40) && quality[f.condition] !== undefined;
          forecast[t.getHours()] = { dry, quality: quality[f.condition] ?? 0, condition: f.condition };
        });
        const haveForecast = Object.keys(forecast).length > 0;

        // Alle starttijden vanaf 08:00 langs
        let best = null;
        for (let start = EARLIEST; start + WASH_HOURS <= 24; start++) {
          const wash = [...Array(WASH_HOURS).keys()].map(i => priceAt[start + i]);
          if (wash.some(v => v === undefined)) continue;
          const avg = wash.reduce((a, b) => a + b, 0) / WASH_HOURS;
          const end = start + WASH_HOURS;
          const dryHours = [...Array(DRY_HOURS).keys()].map(i => forecast[end + i]);
          const canDry = haveForecast && end + DRY_HOURS <= sunset && dryHours.every(h => h?.dry);
          const dryQuality = canDry ? dryHours.reduce((a, h) => a + h.quality, 0) / DRY_HOURS : 0;
          const score = avg - (canDry ? DRY_BONUS * dryQuality : 0);
          if (!best || score < best.score) best = { start, end, avg, canDry, dryQuality, score };
        }
        if (!best) return '<div style="opacity:.6">Nog geen prijzen voor vandaag.</div>';
        window.huisWasAdvies = { start: best.start, end: best.end, day: day.toDateString() };

        const sunny = best.dryQuality >= 0.85 ? '☀️' : best.dryQuality >= 0.6 ? '🌤️' : '☁️';
        const dryLine = best.canDry
          ? `${sunny} Buiten drogen ${time(best.end)}–${time(best.end + DRY_HOURS)}`
          : haveForecast ? `🌧️ ${dayName.toLowerCase()} niet buiten drogen` : 'Geen weersverwachting, alleen op prijs';
        const passed = day === now && best.start < now.getHours() ? ' (al voorbij)' : '';
        return `<div style="display:flex;align-items:center;gap:14px;text-align:left">
                  <div style="width:48px;height:48px;border-radius:50%;flex:0 0 48px;display:flex;align-items:center;justify-content:center;
                    background:${best.canDry ? 'rgba(255,209,102,0.2)' : 'rgba(122,162,255,0.2)'}">
                    <ha-icon icon="mdi:washing-machine" style="--mdc-icon-size:26px;color:${best.canDry ? '#ffd166' : '#7aa2ff'}"></ha-icon>
                  </div>
                  <div style="line-height:1.35">
                    <div style="font-size:12px;opacity:.65">Wasadvies ${dayName.toLowerCase()}</div>
                    <div style="font-size:18px;font-weight:700">Start ${time(best.start)} · klaar ${time(best.end)}${passed}</div>
                    <div style="font-size:13px;opacity:.85">${dryLine} · gem. ${euro(best.avg)}/kWh</div>
                  </div>
                </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"advice"'
    card:
      - padding: 14px 16px
    custom_fields:
      advice:
        - display: block
        - width: 100%

# Prijs per uur vandaag als eigen staafgrafiek: 24 even brede staven, kleur per staaf ten opzichte van het
# daggemiddelde (groen goedkoop, oranje normaal, rood duur), het huidige uur gemarkeerd. Bron: hourly_prices.
price_bars:
  template: glass
  entity: sensor.anwb_electricity_all_in_price_current
  show_icon: false
  show_name: false
  tap_action:
    action: none
  custom_fields:
    bars: |
      [[[
        const now = new Date();
        const prices = Object.entries(entity?.attributes.hourly_prices ?? {})
          .map(([t, p]) => [new Date(t), parseFloat(p.all_in_price)])
          .filter(([t, v]) => !isNaN(t) && !isNaN(v) && t.toDateString() === now.toDateString())
          .sort((a, b) => a[0] - b[0]);
        if (!prices.length) return '<div style="opacity:.6;padding:8px">Nog geen prijzen voor vandaag.</div>';
        const values = prices.map(([, v]) => v);
        const avg = values.reduce((a, b) => a + b, 0) / values.length;
        const max = Math.max(...values), min = Math.min(...values);
        const color = v => v < avg * 0.95 ? '#4ade80' : v > avg * 1.05 ? '#ff6b6b' : '#ffb060';
        const euro = v => v.toFixed(2).replace('.', ',');
        const bars = prices.map(([t, v]) => {
          const hour = t.getHours();
          const current = hour === now.getHours();
          const height = Math.max(6, v / max * 150);
          const extreme = v === max || v === min;
          return `<div title="${String(hour).padStart(2, '0')}:00 · € ${euro(v)}" style="flex:1;display:flex;flex-direction:column;
                    align-items:center;justify-content:flex-end;height:190px;min-width:0">
                    <span style="font-size:10px;margin-bottom:3px;white-space:nowrap;${current || extreme ? 'font-weight:700' : 'opacity:0'}">
                      ${current || extreme ? euro(v) : ''}</span>
                    <div style="width:70%;height:${height}px;border-radius:4px 4px 2px 2px;background:${color(v)};
                      ${current ? 'box-shadow:0 0 0 2px #fff, 0 0 14px rgba(255,255,255,0.4);' : 'opacity:0.85;'}"></div>
                    <span style="font-size:10px;margin-top:6px;height:12px;${current ? 'font-weight:700;color:var(--accent-color)' : 'opacity:.55'}">
                      ${current ? 'nu' : hour % 3 === 0 ? String(hour).padStart(2, '0') : ''}</span>
                  </div>`;
        }).join('');
        const legend = [['#4ade80', 'Goedkoop'], ['#ffb060', 'Normaal'], ['#ff6b6b', 'Duur']].map(([c, n]) =>
          `<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:${c}"></span>${n}</span>`).join('');
        return `<div style="text-align:left">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
                    <span style="font-size:15px;font-weight:600">Prijs per uur vandaag</span>
                    <span style="font-size:12px;opacity:.7">gemiddeld € ${euro(avg)} · laagste € ${euro(min)} · hoogste € ${euro(max)}</span>
                  </div>
                  <div style="position:relative">
                    <div style="position:absolute;left:0;right:0;bottom:${18 + avg / max * 150}px;border-top:1px dashed rgba(255,255,255,0.25)"></div>
                    <div style="display:flex;gap:2px;align-items:flex-end">${bars}</div>
                  </div>
                  <div style="display:flex;gap:16px;justify-content:center;font-size:12px;opacity:.8;margin-top:8px">${legend}</div>
                </div>`;
      ]]]
  styles:
    card:
      - padding: 16px
    grid:
      - grid-template-areas: '"bars"'
    custom_fields:
      bars:
        - display: block
        - width: 100%

# Tijdsduur in milliseconden (ping, latency, jitter). Sommige sensoren meten in seconden (0,006 = 6 ms).
ms:
  template: stat
  state_display: |
    [[[
      const v = parseFloat(entity.state);
      if (isNaN(v)) return 'Onbekend';
      const unit = entity.attributes.unit_of_measurement;
      const ms = unit === 's' || (unit !== 'ms' && v < 1) ? v * 1000 : v;
      return `${ms < 10 ? ms.toFixed(1).replace('.', ',') : Math.round(ms)} ms`;
    ]]]

# Watchman-lijst: per ontbrekende entiteit of actie waar hij gebruikt wordt (bestand:regel) en een gok voor de vervanger
# (een bestaande entiteit van hetzelfde domein met de meeste overeenkomende woorden in de naam).
# Tik op de kaart om de lijst te kopiëren (om te plakken, bijvoorbeeld in een chat om hem te laten oplossen).
watchman_list:
  template: glass
  triggers_update:
    - sensor.watchman_missing_entities
    - sensor.watchman_missing_actions
  show_icon: false
  show_name: false
  tap_action:
    action: javascript
    javascript: |
      [[[
        const items = (key, attr) => (states[key]?.attributes[attr] ?? []).map(i => `${i.id ?? i.entity_id ?? i}  ->  ${i.occurrences ?? ''}`);
        const text = [...items('sensor.watchman_missing_entities', 'entities'),
                      ...items('sensor.watchman_missing_actions', 'actions'), ...items('sensor.watchman_missing_actions', 'services')].join('\n');
        const copy = t => navigator.clipboard?.writeText(t).catch(() => {}) ?? Promise.resolve();
        copy(text).then(() => hass.callService('persistent_notification', 'create', {
          title: 'Watchman', message: 'De lijst met ontbrekende entiteiten en acties is gekopieerd.', notification_id: 'watchman_kopie' }));
      ]]]
  custom_fields:
    list: |
      [[[
        const tokens = id => id.split(/[._]/).filter(t => t.length > 1);
        const guess = (id) => {
          const [domain] = id.split('.');
          const want = tokens(id).slice(1);
          let best = null;
          for (const other of Object.keys(states)) {
            if (!other.startsWith(domain + '.')) continue;
            const have = tokens(other).slice(1);
            // Gelijk woord telt 1, een woord dat in een ander woord zit (machine / machinestatus) telt 0,5
            const shared = want.reduce((sum, t) => sum + (have.includes(t) ? 1
              : have.some(h => t.length >= 4 && h.length >= 4 && (h.includes(t) || t.includes(h))) ? 0.5 : 0), 0);
            const score = shared / Math.max(want.length, have.length);
            if (shared && (!best || score > best.score)) best = { id: other, score };
          }
          return best && best.score >= 0.34 ? best.id : null;
        };
        const occurrences = text => String(text ?? '').split(/,\s*/).filter(Boolean)
          .map(o => `<code style="font-size:11px;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:6px">${o}</code>`).join(' ');
        const row = (item, kind) => {
          const id = item.id ?? item.entity_id ?? item;
          const suggestion = kind === 'entiteit' ? guess(id) : null;
          return `<div style="padding:10px 0;border-top:1px solid rgba(255,255,255,0.06);text-align:left">
                    <div style="font-size:13px;font-weight:600;word-break:break-all">${id}
                      <span style="font-size:11px;font-weight:400;opacity:.6">· ${kind}</span></div>
                    <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${occurrences(item.occurrences)}</div>
                    ${suggestion ? `<div style="font-size:12px;margin-top:5px;color:#4ade80">Misschien: ${suggestion}</div>` : ''}
                  </div>`;
        };
        const ents = states['sensor.watchman_missing_entities']?.attributes.entities ?? [];
        const acts = states['sensor.watchman_missing_actions']?.attributes.actions ?? states['sensor.watchman_missing_actions']?.attributes.services ?? [];
        if (!ents.length && !acts.length) return '<div style="padding:8px;opacity:.7">Niets ontbreekt. 🎉</div>';
        return `<div>
                  <div style="font-size:12px;opacity:.6;text-align:left;margin-bottom:4px">Tik op deze lijst om hem te kopiëren</div>
                  ${ents.map(e => row(e, 'entiteit')).join('')}${acts.map(a => row(a, 'actie')).join('')}
                </div>`;
      ]]]
  styles:
    card:
      - padding: 14px 16px
    grid:
      - grid-template-areas: '"list"'
    custom_fields:
      list:
        - display: block
        - width: 100%

# Regel in "Grootste verbruikers nu": naam, vermogen en een balkje met het aandeel in het huisverbruik (P1-meter);
# bij teruglevering is dat totaal onbekend en valt het percentage weg.
# Tik opent de details (en geschiedenis) van het apparaat.
power_row:
  template: glass
  # Het percentage hangt van alle apparaten af, dus bij elke wijziging opnieuw tekenen
  triggers_update: all
  variables:
    # Dezelfde apparaten als de lijst in Energie en Verbruik; hun som is het totaal tijdens teruglevering
    sources: !include ../cards/power_sources.yaml
  show_icon: false
  show_name: false
  tap_action:
    action: more-info
  custom_fields:
    row: |
      [[[
        const w = parseFloat(entity?.state) || 0;
        // Aandeel in het huisverbruik volgens de P1-meter. Bij teruglevering (zonnepanelen) is die netto te laag of negatief
        // en is het echte huisverbruik onbekend; dan is het aandeel in wat alle gemeten apparaten samen gebruiken.
        const grid = parseFloat(states['sensor.p1_meter_3c39e72a64e8_active_power']?.state) || 0;
        const measured = (variables.sources ?? [])
          .reduce((sum, source) => sum + Math.max(0, parseFloat(states[source.entity_id]?.state) || 0), 0);
        const total = grid > w ? grid : Math.max(measured, w, 1);
        const name = variables.name ?? (entity?.attributes.friendly_name ?? '').replace(/ (power|vermogen|power meter)$/i, '');
        return `<div style="display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;text-align:left">
                  <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</span>
                  <span style="font-size:13px;font-weight:600">${w >= 100 ? Math.round(w) : w.toFixed(1).replace('.', ',')} W
                    <span style="font-weight:400;opacity:.55;font-size:11px">${Math.round(w / total * 100)}%</span></span>
                  <div style="grid-column:1 / 3;height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden">
                    <div style="width:${Math.min(100, w / total * 100)}%;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffb060,#ff6b6b)"></div>
                  </div>
                </div>`;
      ]]]
  styles:
    card:
      - padding: 10px 14px
      - cursor: pointer
    grid:
      - grid-template-areas: '"row"'
    custom_fields:
      row:
        - display: block
        - width: 100%

# Vervoerder (Pakket-integratie): inkomende pakketten, volgende bezorging, klaar om af te halen en wat er onderweg is.
# variables.key (postnl, dhl, dpd, gls), variables.color (r, g, b), variables.pickup (sensor voor "onderweg naar afhaalpunt").
# Tik toont de inkomende pakketten, lang drukken ververst de gegevens bij de vervoerder.
carrier:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    key: postnl
    color: 255, 98, 0
    pickup: onderweg_naar_postnl_punt
  icon: mdi:package-variant-closed
  tap_action:
    action: more-info
  hold_action:
    action: javascript
    haptic: medium
    javascript: "[[[ hass.callService('button', 'press', { entity_id: `button.buiten_${variables.key}_verversen` }); ]]]"
  custom_fields:
    count: |
      [[[
        const n = parseInt(states[`sensor.buiten_${variables.key}_inkomende_pakketten`]?.state) || 0;
        return n ? `${n} ${n === 1 ? 'pakket' : 'pakketten'}` : 'Niets onderweg';
      ]]]
  label: |
    [[[
      const parts = [];
      const next = new Date(states[`sensor.buiten_${variables.key}_volgende_bezorging`]?.state);
      if (!isNaN(next)) {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const day = new Date(next); day.setHours(0, 0, 0, 0);
        const diff = Math.round((day - today) / 86400000);
        const time = next.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        const when = diff === 0 ? `vandaag ${time}` : diff === 1 ? `morgen ${time}`
          : next.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
        parts.push(`Volgende: ${when}`);
      }
      const ready = parseInt(states[`sensor.buiten_${variables.key}_klaar_voor_afhalen`]?.state) || 0;
      if (ready) parts.push(`${ready} klaar om af te halen`);
      const pickup = parseInt(states[`sensor.buiten_${variables.key}_${variables.pickup}`]?.state) || 0;
      if (pickup) parts.push(`${pickup} naar afhaalpunt`);
      const out = parseInt(states[`sensor.buiten_${variables.key}_uitgaande_pakketten`]?.state) || 0;
      if (out) parts.push(`${out} verstuurd`);
      return parts.join(' · ') || 'Lang drukken om te verversen';
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i count" "l l"'
      - grid-template-columns: auto 1fr
      - grid-template-rows: auto auto 1fr
      - column-gap: 12px
    card:
      - min-height: 104px
      - background: |
          [[[
            const n = parseInt(states[`sensor.buiten_${variables.key}_inkomende_pakketten`]?.state) || 0;
            return n ? `linear-gradient(135deg, rgba(${variables.color}, 0.30), rgba(255, 255, 255, 0.04))` : 'rgba(255, 255, 255, 0.05)';
          ]]]
    img_cell:
      - width: 42px
      - height: 42px
      - border-radius: 12px
      - background: '[[[ return `rgba(${variables.color}, 0.25)`; ]]]'
    icon:
      - width: 24px
      - color: '[[[ return `rgb(${variables.color})`; ]]]'
    name:
      - font-size: 13px
      - opacity: 0.8
    label:
      - white-space: normal
      - text-align: left
      - font-size: 12px
      - padding-top: 6px
    custom_fields:
      count:
        - justify-self: start
        - font-size: 18px
        - font-weight: 700

# Pixel gekotst: tik telt er een bij, lang drukken maakt de laatste ongedaan (na bevestiging).
# Het label toont hoe vaak het in twee weken gebeurde en wanneer het laatst (uit sensor.pixel_gekotst_momenten van NetDaemon).
vomit_button:
  template: glass
  entity: counter.pixel_gekotst
  triggers_update:
    - counter.pixel_gekotst
    - sensor.pixel_gekotst_momenten
  name: Pixel gekotst
  icon: mdi:emoticon-sick-outline
  show_label: true
  tap_action:
    action: perform-action
    perform_action: counter.increment
    target:
      entity_id: counter.pixel_gekotst
    haptic: success
  hold_action:
    action: perform-action
    perform_action: counter.decrement
    target:
      entity_id: counter.pixel_gekotst
    confirmation:
      text: De laatste keer gekotst weghalen?
  label: |
    [[[
      const moments = (states['sensor.pixel_gekotst_momenten']?.attributes?.momenten ?? [])
        .map(x => new Date(x)).filter(d => !isNaN(d));
      if (!moments.length) return 'Nog nooit gekotst';
      // Alles wordt bewaard; de kaart telt de laatste twee weken
      const recent = moments.filter(d => d > Date.now() - 14 * 86400000).length;
      const last = moments[moments.length - 1];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const day = new Date(last); day.setHours(0, 0, 0, 0);
      const diff = Math.round((today - day) / 86400000);
      const time = last.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      const when = diff === 0 ? `vandaag ${time}` : diff === 1 ? `gisteren ${time}`
        : `${last.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} ${time}`;
      return recent ? `${recent}× in 2 weken · laatst ${when}` : `Niet gekotst in de afgelopen 2 weken · laatst ${when}`;
    ]]]
  custom_fields:
    plus: '+1'
  styles:
    grid:
      - grid-template-areas: '"i n plus" "i l plus"'
      - grid-template-columns: auto 1fr auto
      - grid-template-rows: 1fr 1fr
      - column-gap: 12px
    card:
      - height: 72px
      - padding: 10px 14px
    img_cell:
      - width: 42px
      - height: 42px
      - border-radius: 12px
      - background: rgba(255, 140, 80, 0.20)
    icon:
      - width: 24px
      - color: '#ff9f5a'
    name:
      - justify-self: start
      - align-self: end
      - font-size: 14px
      - font-weight: 600
    label:
      - justify-self: start
      - align-self: start
      - font-size: 12px
      - opacity: 0.75
    custom_fields:
      plus:
        - padding: 6px 12px
        - border-radius: 12px
        - background: rgba(255, 140, 80, 0.25)
        - color: '#ffb27a'
        - font-weight: 700

# Tijdlijn van twee weken: elke dag is een kolom, een stip per keer gekotst op het tijdstip van die dag.
# Dagen met meldingen worden breder (meer meldingen = breder), zodat de tijden op die dag uit elkaar staan.
vomit_chart:
  template:
    - glass
    - timeline_overlay
  triggers_update:
    - sensor.pixel_gekotst_momenten
  show_icon: false
  show_name: false
  # Tik = schermvullend en liggend, met inzoomen (stuk selecteren, knijpen, scrollen) en schuiven door alle geschiedenis
  tap_action:
    action: javascript
    javascript: |
      [[[
        (variables.open_timeline ?? window.huisOpenTimeline)({ title: '🤮 Pixel gekotst', defaultDays: 14,
          lanes: [{ name: 'Gekotst', color: '#ff9f5a', points: (window.huisVomitMoments ?? []).map(t => ({ t })) }] });
      ]]]
  custom_fields:
    chart: |
      [[[
        // big = schermvullend: alles groter, en de grafiek vult de hoogte
        const render = big => {
        const z = big ? 1.7 : 1;
        const moments = (states['sensor.pixel_gekotst_momenten']?.attributes?.momenten ?? [])
          .map(x => new Date(x)).filter(d => !isNaN(d));
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        const byDay = {};
        for (const m of moments) (byDay[key(m)] ??= []).push(m);

        let cols = '', dotIndex = 0;
        for (let i = 13; i >= 0; i--) {
          const d = new Date(today); d.setDate(d.getDate() - i);
          const list = (byDay[key(d)] ?? []).sort((a, b) => a - b);
          const n = list.length;
          const weekend = d.getDay() === 0 || d.getDay() === 6;
          const isToday = i === 0;

          // Hulplijnen om 6, 12 en 18 uur op dagen met meldingen (met cijfers als de dag breed genoeg is)
          let ticks = '';
          if (n) for (const h of [6, 12, 18]) {
            ticks += `<div style="position:absolute;left:${h / 24 * 100}%;top:${18 * z}px;bottom:${22 * z}px;border-left:1px dotted rgba(255,255,255,0.18)"></div>
              ${n > 1 || big ? `<div style="position:absolute;left:${h / 24 * 100}%;bottom:${22 * z}px;transform:translateX(-50%);font-size:${8 * z}px;opacity:0.45">${h}</div>` : ''}`;
          }

          // Een stip per keer, de tijd er afwisselend boven en onder zodat ze niet over elkaar vallen
          let dots = '';
          list.forEach(m => {
            const pos = (m.getHours() * 60 + m.getMinutes()) / 1440 * 100;
            const time = m.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            const above = dotIndex++ % 2 === 0;
            // Aan de rand van de dag naar binnen uitlijnen, zodat de tijd niet over de buurdag valt
            const shift = pos < 18 ? '-6px' : pos > 82 ? 'calc(-100% + 6px)' : '-50%';
            dots += `<div title="${d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' })} ${time}"
                style="position:absolute;left:${pos}%;top:50%;width:${12 * z}px;height:${12 * z}px;margin:${-6 * z}px 0 0 ${-6 * z}px;border-radius:50%;
                background:#ff9f5a;box-shadow:0 0 10px rgba(255,140,80,0.8)"></div>
              <div style="position:absolute;left:${pos}%;top:${above ? `calc(50% - ${22 * z}px)` : `calc(50% + ${10 * z}px)`};transform:translateX(${shift});
                font-size:${10 * z}px;font-weight:600;color:#ffcfa8;white-space:nowrap">${time}</div>`;
          });

          // Lege dagen zijn smal: alleen maandag krijgt een label, zodat je de weken ziet
          const label = n || isToday || (d.getDay() === 1 && i > 1)
            ? `${d.toLocaleDateString('nl-NL', { weekday: 'short' })} ${d.getDate()}`
            : '';
          cols += `<div style="flex:${n ? 4 + (n - 1) * 3 : 1} 1 0;min-width:0;position:relative;
              border-left:1px solid rgba(255,255,255,0.07);
              background:${n ? 'rgba(255,140,80,0.10)' : weekend ? 'rgba(255,255,255,0.03)' : 'transparent'}">
              ${ticks}${dots}
              <div style="position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:${(n ? 11 : 9) * z}px;
                white-space:nowrap;overflow:${n ? 'hidden' : 'visible'};${isToday ? 'font-weight:700;color:var(--accent-color)' : `opacity:${n ? 0.9 : 0.5}`}">${isToday && !n ? 'nu' : label}</div>
            </div>`;
        }

        const total = moments.length;
        const header = `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
            <span style="font-size:${13 * z}px;opacity:0.8">Laatste 2 weken${big ? ' · Pixel gekotst' : ''}</span>
            <span style="font-size:${13 * z}px;font-weight:600;${big ? 'margin-right:130px' : ''}">${total ? `${total}× gekotst` : 'Niet gekotst 🎉'}</span></div>`;
        return `${header}<div style="display:flex;height:${big ? 'calc(100% - 44px)' : '120px'};border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.15)">${cols}</div>`;
        };
        // Alle momenten voor de schermvullende weergave (tap_action), ook ouder dan twee weken
        window.huisVomitMoments = (states['sensor.pixel_gekotst_momenten']?.attributes?.momenten ?? [])
          .map(x => new Date(x).getTime()).filter(t => !isNaN(t));
        return render(false);
      ]]]
  styles:
    grid:
      - grid-template-areas: '"chart"'
    card:
      - padding: 12px 14px
      - cursor: pointer
    custom_fields:
      chart:
        - width: 100%
        - text-align: left

# Opvallende melding op Home: gekleurde rand met gloed, groot icoon, titel en uitleg.
# variables.color (r, g, b) en variables.pulse (true = het icoon pulseert, voor wat nu echt aandacht vraagt).
alert:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    color: 56, 189, 248
    pulse: false
  styles:
    grid:
      - grid-template-areas: '"i n side" "i l side"'
      - grid-template-columns: auto 1fr auto
      - grid-template-rows: 1fr 1fr
      - column-gap: 14px
    card:
      - --alert-rgb: '[[[ return variables.color; ]]]'
      - min-height: 84px
      - padding: 12px 16px
      - background: '[[[ return `linear-gradient(135deg, rgba(${variables.color}, 0.28), rgba(${variables.color}, 0.08))`; ]]]'
      - border: '[[[ return `1px solid rgba(${variables.color}, 0.55)`; ]]]'
      - box-shadow: '[[[ return `0 0 24px rgba(${variables.color}, 0.25)`; ]]]'
    img_cell:
      - width: 52px
      - height: 52px
      - border-radius: 50%
      - background: '[[[ return `rgba(${variables.color}, 0.30)`; ]]]'
      - animation: '[[[ return variables.pulse ? "alert-pulse 1.6s ease-in-out infinite" : "none"; ]]]'
    icon:
      - width: 28px
      - color: '[[[ return `rgb(${variables.color})`; ]]]'
    name:
      - justify-self: start
      - align-self: end
      - font-size: 16px
      - font-weight: 700
      - white-space: normal
      - text-align: left
    label:
      - justify-self: start
      - align-self: start
      - font-size: 13px
      - opacity: 0.85
      - white-space: normal
      - text-align: left
    custom_fields:
      side:
        - align-self: center
        - text-align: right
  # De kleur gaat als CSS-variabele naar de gloed: in extra_styles zijn de variables van button-card niet beschikbaar
  extra_styles: |
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(var(--alert-rgb), 0.6); }
      50% { box-shadow: 0 0 0 10px rgba(var(--alert-rgb), 0); }
    }

# Wasmachine bezig: fase (Wassen, Spoelen, Centrifugeren...), programma, voortgangsring en hoe lang nog.
# Tik opent de wasmachine-pop-up op Huishouden.
washer_live:
  template: alert
  entity: sensor.badkamer_wasmachine_machinestatus
  variables:
    color: |
      [[[ return entity?.state === 'pause' ? '255, 176, 96' : '56, 189, 248'; ]]]
  show_icon: false
  tap_action:
    action: navigate
    navigation_path: /dashboard-huis/huishouden#wasmachine
  name: |
    [[[
      if (entity?.state === 'pause') return 'Wasmachine gepauzeerd';
      const phase = states['sensor.badkamer_wasmachine_voortgang'];
      const text = phase && !['unknown', 'unavailable', 'idle'].includes(phase.state) ? hass.formatEntityState(phase) : '';
      return text ? `Wasmachine · ${text}` : 'Wasmachine draait';
    ]]]
  label: |
    [[[
      const parts = [];
      const program = states['select.badkamer_wasmachine_programma'];
      if (program && !['unknown', 'unavailable'].includes(program.state)) parts.push(hass.formatEntityState(program));
      const temp = states['select.badkamer_wasmachine_wastemperatuur']?.state;
      if (/^\d+$/.test(temp ?? '')) parts.push(`${temp}°`);
      const spin = states['select.badkamer_wasmachine_centrifugesnelheid']?.state;
      if (/^\d+$/.test(spin ?? '')) parts.push(`${spin} toeren`);
      const end = new Date(states['sensor.badkamer_wasmachine_geschatte_eindtijd']?.state);
      if (!isNaN(end)) parts.push(`klaar om ${end.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`);
      return parts.join(' · ');
    ]]]
  custom_fields:
    i: |
      [[[
        const pct = Math.min(100, parseFloat(states['sensor.badkamer_wasmachine_voortgangspercentage']?.state) || 0);
        const rgb = entity?.state === 'pause' ? '255, 176, 96' : '56, 189, 248';
        return `<div style="width:56px;height:56px;border-radius:50%;background:conic-gradient(rgb(${rgb}) ${pct * 3.6}deg, rgba(255,255,255,0.10) 0);
            display:flex;align-items:center;justify-content:center">
            <div style="width:44px;height:44px;border-radius:50%;background:#121828;display:flex;align-items:center;justify-content:center;
              font-size:14px;font-weight:700">${Math.round(pct)}%</div></div>`;
      ]]]
    side: |
      [[[
        const left = parseFloat(states['sensor.badkamer_wasmachine_resterende_tijd']?.state);
        if (isNaN(left)) return '';
        const h = Math.floor(left / 60), m = Math.round(left % 60);
        const text = h ? `${h}:${String(m).padStart(2, '0')}` : `${m} min`;
        return `<div style="font-size:11px;opacity:0.75">nog</div><div style="font-size:24px;font-weight:700;line-height:1.1">${text}</div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n side" "i l side"'
    custom_fields:
      i:
        - align-self: center

# De was hangt buiten: hoe lang al, en rood met pulserend icoon als er regen verwacht wordt.
# Tik = binnengehaald (na bevestiging).
laundry_outside:
  template: alert
  entity: input_boolean.laundryhangingoutside
  icon: mdi:tshirt-crew-outline
  variables:
    color: |
      [[[ return states['binary_sensor.weer_thuis_neerslag_verwacht']?.state === 'on' ? '255, 107, 107' : '74, 222, 128'; ]]]
    pulse: |
      [[[ return states['binary_sensor.weer_thuis_neerslag_verwacht']?.state === 'on'; ]]]
  tap_action:
    action: perform-action
    perform_action: input_boolean.turn_off
    target:
      entity_id: input_boolean.laundryhangingoutside
    confirmation:
      text: Is de was binnengehaald?
  name: |
    [[[
      return states['binary_sensor.weer_thuis_neerslag_verwacht']?.state === 'on'
        ? 'Regen verwacht, haal de was binnen!' : 'De was hangt buiten';
    ]]]
  label: |
    [[[
      const since = new Date(entity?.last_changed);
      const minutes = Math.max(0, Math.round((Date.now() - since) / 60000));
      const time = since.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      const duration = minutes < 60 ? `${minutes} min` : `${Math.floor(minutes / 60)} uur${minutes % 60 ? ` ${minutes % 60} min` : ''}`;
      return `Sinds ${time} (${duration}) · tik als hij binnen is`;
    ]]]

# Batterij onder 10%: per apparaat een rode melding (via auto-entities, alleen als er een is).
battery_alert:
  template: alert
  variables:
    color: 255, 107, 107
    pulse: true
  icon: mdi:battery-alert-variant-outline
  tap_action:
    action: more-info
  name: |
    [[[
      const name = (entity?.attributes?.friendly_name ?? entity?.entity_id ?? '')
        .replace(/\s*(battery( level)?|batterij\+?|accu)\s*$/i, '');
      return `${name}: batterij bijna leeg`;
    ]]]
  label: |
    [[[
      const type = entity?.attributes?.battery_type;
      return `Nog ${Math.round(parseFloat(entity?.state))}% · ${type ? `vervang de ${type}` : 'opladen of vervangen'}`;
    ]]]

# Problemen met de spullen van Pixel (voerbak, fontein) in één melding. Tik gaat naar de Pixel-pagina.
pixel_alert:
  template: alert
  icon: mdi:cat
  variables:
    color: |
      [[[
        const food = states['sensor.zedar_food_storage_status']?.state;
        const urgent = (food && !['full', 'unknown', 'unavailable'].includes(food)) || states['sensor.zedar_feed_block_status']?.state === 'True';
        return urgent ? '255, 107, 107' : '255, 176, 96';
      ]]]
    pulse: |
      [[[
        const food = states['sensor.zedar_food_storage_status']?.state;
        return (food && !['full', 'unknown', 'unavailable'].includes(food)) || states['sensor.zedar_feed_block_status']?.state === 'True';
      ]]]
  tap_action:
    action: navigate
    navigation_path: /dashboard-huis/pixel
  name: |
    [[[
      const issues = [];
      const food = states['sensor.zedar_food_storage_status']?.state;
      if (food && !['full', 'unknown', 'unavailable'].includes(food)) issues.push('Voer bijna op');
      if (states['sensor.zedar_feed_block_status']?.state === 'True') issues.push('Voer zit vast');
      if (states['switch.petsnowy_fountain_ison']?.state === 'off') issues.push('Fontein staat uit');
      if (parseFloat(states['sensor.petsnowy_fountain_cleaning_days_remaining']?.state) <= 0) issues.push('Waterbak schoonmaken');
      if (parseFloat(states['sensor.petsnowy_fountain_filter_days_remaining']?.state) <= 0) issues.push('Filter vervangen');
      return issues.length ? `Pixel: ${issues.join(', ').toLowerCase().replace(/^./, c => c.toUpperCase())}` : 'Pixel heeft alles';
    ]]]
  label: |
    [[[
      const food = states['sensor.zedar_food_storage_status']?.state;
      if ((food && !['full', 'unknown', 'unavailable'].includes(food)) || states['sensor.zedar_feed_block_status']?.state === 'True')
        return 'Kijk bij de voerbak · tik voor details';
      return 'Tik om het af te vinken bij Pixel';
    ]]]

# Stroom extreem duur of negatief, met dezelfde grenzen als de melding van NetDaemon (Alarm.cs): boven € 0,55 of onder € 0.
# Toont de prijs nu en tot hoe laat het zo blijft (uit hourly_prices). Tik gaat naar de prijzen.
price_alert:
  template: alert
  entity: sensor.anwb_electricity_all_in_price_current
  variables:
    color: |
      [[[ return parseFloat(entity?.state) < 0 ? '56, 189, 248' : '255, 107, 107'; ]]]
    pulse: true
  icon: |
    [[[ return parseFloat(entity?.state) < 0 ? 'mdi:cash-minus' : 'mdi:flash-alert'; ]]]
  tap_action:
    action: navigate
    navigation_path: /dashboard-huis/energie_prijs
  name: |
    [[[
      const price = parseFloat(entity?.state);
      const euro = `€ ${price.toFixed(2).replace('.', ',')}`;
      return price < 0 ? `Stroom is negatief: ${euro}` : `Stroom is extreem duur: ${euro}`;
    ]]]
  label: |
    [[[
      const price = parseFloat(entity?.state);
      const negative = price < 0;
      const extreme = v => negative ? v < 0 : v > 0.55;
      // Tot wanneer: de uren vanaf nu waarin de prijs over de grens blijft
      const hours = Object.entries(entity?.attributes?.hourly_prices ?? {})
        .map(([t, p]) => [new Date(t), parseFloat(p.all_in_price)])
        .filter(([t, v]) => !isNaN(t) && !isNaN(v))
        .sort((a, b) => a[0] - b[0]);
      const now = new Date();
      let until = null;
      for (const [t, v] of hours) {
        if (t.getTime() + 3600000 <= now.getTime()) continue;
        if (!extreme(v)) break;
        until = new Date(t.getTime() + 3600000);
      }
      const advice = negative ? 'Verbruik nu, terugleveren kost geld' : 'Stel grote verbruikers uit';
      return until ? `${advice} · tot ${until.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}` : advice;
    ]]]

# Thuiswerken: stroom en kosten van vandaag en deze maand (NetDaemon HomeWorkEnergyTracker). Tik opent #thuiswerken.
homework_tile:
  template: glass
  entity: sensor.thuiswerken_energie
  triggers_update:
    - sensor.thuiswerken_energie
  icon: mdi:laptop-account
  name: Thuiswerken
  show_label: true
  tap_action:
    action: navigate
    navigation_path: "#thuiswerken"
  label: |
    [[[
      const a = entity?.attributes ?? {};
      const euro = v => `€ ${(Number(v) || 0).toFixed(2).replace('.', ',')}`;
      const kwh = v => `${(Number(v) || 0).toFixed(1).replace('.', ',')} kWh`;
      const today = a.dagen?.find(d => d.datum === new Date().toLocaleDateString('sv-SE'));
      const parts = [];
      if (today) parts.push(`Vandaag ${euro(today.kosten)} · ${kwh(today.verbruik_kwh)}${a.actief ? ' · meet nu' : ''}`);
      else parts.push(a.actief ? 'Meet nu' : 'Vandaag niet thuisgewerkt');
      parts.push(`Deze maand ${euro(a.maand_kosten)} over ${a.maand_dagen ?? 0} ${a.maand_dagen === 1 ? 'dag' : 'dagen'}`);
      return parts.join('<br>');
    ]]]
  custom_fields:
    arrow: '<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:22px;opacity:0.5"></ha-icon>'
  styles:
    grid:
      - grid-template-areas: '"i n arrow" "i l arrow"'
      - grid-template-columns: auto 1fr auto
      - column-gap: 14px
    card:
      - min-height: 76px
    img_cell:
      - width: 44px
      - height: 44px
      - border-radius: 12px
      - background: '[[[ return entity?.attributes?.actief ? "rgba(74, 222, 128, 0.25)" : "rgba(255, 255, 255, 0.08)"; ]]]'
    icon:
      - width: 24px
      - color: '[[[ return entity?.attributes?.actief ? "#4ade80" : "var(--primary-text-color)"; ]]]'
    label:
      - white-space: normal
      - text-align: left
      - line-height: 1.4

# Thuiswerken per dag: werktijd, netto kWh (afname, teruglevering, wasmachine apart) en kosten, met een balk per dag.
# Bovenaan het totaal van deze maand.
homework_days:
  template: glass
  entity: sensor.thuiswerken_energie
  triggers_update:
    - sensor.thuiswerken_energie
  show_icon: false
  show_name: false
  tap_action:
    action: none
  custom_fields:
    list: |
      [[[
        const a = entity?.attributes ?? {};
        const days = (a.dagen ?? []).filter(d => d.minuten > 0);
        const euro = v => `€ ${(Number(v) || 0).toFixed(2).replace('.', ',')}`;
        const num = (v, d = 1) => (Number(v) || 0).toFixed(d).replace('.', ',');
        const hours = m => `${Math.floor(m / 60)}u${String(Math.round(m % 60)).padStart(2, '0')}`;
        const stat = (label, value) => `<div style="flex:1;min-width:0;padding:10px;border-radius:14px;background:rgba(255,255,255,0.06)">
            <div style="font-size:11px;opacity:0.65">${label}</div><div style="font-size:18px;font-weight:700">${value}</div></div>`;
        const month = new Date().toLocaleDateString('nl-NL', { month: 'long' });
        const average = a.maand_dagen ? a.maand_kosten / a.maand_dagen : 0;
        let out = `<div style="display:flex;gap:8px;margin-bottom:12px">
            ${stat(`Kosten ${month}`, euro(a.maand_kosten))}${stat('Stroom', `${num(a.maand_kwh)} kWh`)}
            ${stat('Dagen', a.maand_dagen ?? 0)}${stat('Per dag', euro(average))}</div>`;
        if (!days.length) return out + '<div style="opacity:0.6;padding:8px">Nog geen thuiswerkdagen gemeten.</div>';

        const max = Math.max(...days.map(d => Math.abs(d.kosten)), 0.01);
        for (const d of days) {
          const date = new Date(`${d.datum}T12:00:00`);
          const earned = d.kosten < 0;
          const details = [`↓ ${num(d.afname_kwh)}`];
          if (d.teruglevering_kwh > 0) details.push(`↑ ${num(d.teruglevering_kwh)}`);
          if (d.wasmachine_kwh > 0) details.push(`wasmachine −${num(d.wasmachine_kwh)}`);
          out += `<div style="display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 2px;border-top:1px solid rgba(255,255,255,0.06);text-align:left">
              <span style="font-size:13px;font-weight:600">${date.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })}
                <span style="font-weight:400;opacity:0.6"> · ${hours(d.minuten)}</span></span>
              <span style="font-size:14px;font-weight:700;color:${earned ? '#4ade80' : 'inherit'}">${euro(d.kosten)}</span>
              <span style="font-size:11px;opacity:0.65">${num(d.verbruik_kwh)} kWh (${details.join(' · ')})</span>
              <span></span>
              <div style="grid-column:1 / 3;height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden">
                <div style="width:${Math.abs(d.kosten) / max * 100}%;height:100%;border-radius:3px;
                  background:${earned ? '#4ade80' : 'linear-gradient(90deg,#ffb060,#ff6b6b)'}"></div></div>
            </div>`;
        }
        return out + `<div style="font-size:11px;opacity:0.5;padding-top:8px;text-align:left">
            Op thuiswerkdagen terwijl 'werken' aan staat en je thuis bent. Afname tegen de all-in prijs, teruglevering tegen de
            beursprijs, de wasmachine telt niet mee.</div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"list"'
    custom_fields:
      list:
        - width: 100%

# Peuken: hoeveel pakjes er nog zijn, groot getal met een rij pakjes. Tik = er is er één op (-1), lang drukken = precies invoeren.
# Groen vanaf 10, oranje onder 10, rood onder 5.
peuken:
  template: glass
  entity: input_number.peuken_pakjes
  triggers_update:
    - input_number.peuken_pakjes
  show_icon: false
  show_name: false
  tap_action:
    action: perform-action
    perform_action: input_number.decrement
    target:
      entity_id: input_number.peuken_pakjes
    haptic: success
  hold_action:
    action: more-info
  custom_fields:
    body: |
      [[[
        const packs = Math.max(0, Math.round(parseFloat(entity?.state) || 0));
        const rgb = packs < 5 ? '255, 107, 107' : packs < 10 ? '255, 176, 96' : '74, 222, 128';
        const status = packs === 0 ? 'Op! Tijd om te kopen' : packs < 5 ? 'Bijna op, koop een slof' : packs < 10 ? 'Raakt op' : 'Voorraad prima';
        // Een rij pakjes: maximaal 20 getekend, de rest als +n
        const shown = Math.min(packs, 20);
        const pack = `<svg viewBox="0 0 14 20" style="width:14px;height:20px">
            <rect x="0.5" y="3" width="13" height="16.5" rx="1.5" fill="rgba(${rgb},0.85)"/>
            <rect x="0.5" y="3" width="13" height="4" rx="1" fill="rgba(255,255,255,0.85)"/>
            <rect x="3" y="0.5" width="2" height="3.5" rx="0.5" fill="#f5e6c8"/><rect x="6" y="0" width="2" height="4" rx="0.5" fill="#f5e6c8"/>
            <rect x="9" y="1" width="2" height="3" rx="0.5" fill="#f5e6c8"/></svg>`;
        const row = Array.from({ length: shown }, () => pack).join('')
          + (packs > 20 ? `<span style="font-size:12px;opacity:0.7;align-self:center">+${packs - 20}</span>` : '');
        return `<div style="display:flex;align-items:center;gap:16px;text-align:left">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;opacity:0.75">Pakjes peuken</div>
              <div style="display:flex;align-items:baseline;gap:8px">
                <span style="font-size:56px;font-weight:200;line-height:1;color:rgb(${rgb})">${packs}</span>
                <span style="font-size:13px;font-weight:600">${status}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;min-height:20px">${row || '<span style="opacity:0.5;font-size:12px">Geen pakjes meer</span>'}</div>
            </div>
            <div style="width:72px;height:72px;border-radius:50%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
              background:rgba(${rgb},0.22);box-shadow:inset 0 0 0 2px rgba(${rgb},0.6)">
              <span style="font-size:24px;font-weight:700;line-height:1">−1</span>
              <span style="font-size:10px;opacity:0.8">tik</span>
            </div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"body"'
    card:
      - padding: 16px 18px
      - cursor: pointer
      - background: |
          [[[
            const packs = parseFloat(entity?.state) || 0;
            const rgb = packs < 5 ? '255, 107, 107' : packs < 10 ? '255, 176, 96' : '74, 222, 128';
            return `linear-gradient(135deg, rgba(${rgb}, 0.16), rgba(255, 255, 255, 0.04))`;
          ]]]
    custom_fields:
      body:
        - width: 100%

# Werkdag in het rooster van iemand: tik wisselt Vrij -> Thuis -> Kantoor (input_select.werkdag_{persoon}_{dag}).
# variables.day: de korte naam (ma, di, ...). Vandaag krijgt een rand.
workday_button:
  template: glass
  show_icon: true
  show_name: true
  show_label: true
  variables:
    day: ma
    weekday: 1
  tap_action:
    action: javascript
    haptic: light
    javascript: "[[[ hass.callService('input_select', 'select_next', { entity_id: entity.entity_id, cycle: true }); ]]]"
  hold_action:
    action: more-info
  name: '[[[ return variables.day; ]]]'
  label: '[[[ return entity?.state ?? "?"; ]]]'
  icon: |
    [[[ return { Vrij: 'mdi:beach', Thuis: 'mdi:home-account', Kantoor: 'mdi:office-building-outline' }[entity?.state] ?? 'mdi:help-circle-outline'; ]]]
  styles:
    grid:
      - grid-template-areas: '"n" "i" "l"'
      - row-gap: 4px
    card:
      - padding: 8px 2px
      - height: 84px
      - background: |
          [[[
            const rgb = { Vrij: '255, 255, 255', Thuis: '74, 222, 128', Kantoor: '96, 165, 250' }[entity?.state] ?? '255, 255, 255';
            return `rgba(${rgb}, ${entity?.state === 'Vrij' ? 0.05 : 0.16})`;
          ]]]
      - border: |
          [[[
            return new Date().getDay() === variables.weekday ? '2px solid var(--accent-color)' : '1px solid rgba(255, 255, 255, 0.08)';
          ]]]
    name:
      - justify-self: center
      - font-size: 13px
      - text-transform: capitalize
    icon:
      - width: 24px
      - color: |
          [[[ return { Thuis: '#4ade80', Kantoor: '#60a5fa' }[entity?.state] ?? 'rgba(255, 255, 255, 0.5)'; ]]]
    label:
      - justify-self: center
      - font-size: 10px
      - opacity: 0.85
      - max-width: 100%
      - overflow: hidden
      - text-overflow: ellipsis

# Pixel moet zijn prednison (oranje, vanaf de herinneringstijd) of is hem vergeten (rood, pulserend, de dag erna).
# De melding is meteen de knop: tik, bevestig, en er gaat een kwart pil van de voorraad af (NetDaemon PixelMedication).
pixel_med_alert:
  template: alert
  entity: sensor.pixel_medicijnen
  icon: mdi:pill
  variables:
    color: |
      [[[ return entity?.state === 'vergeten' ? '255, 77, 77' : '255, 176, 96'; ]]]
    pulse: |
      [[[ return entity?.state === 'vergeten'; ]]]
  tap_action:
    action: perform-action
    perform_action: input_button.press
    target:
      entity_id: input_button.pixel_prednison_gegeven
    confirmation:
      text: Heeft Pixel zijn kwart prednison gehad?
  name: |
    [[[ return entity?.state === 'vergeten' ? 'Prednison vergeten!' : 'Pixel moet zijn prednison'; ]]]
  label: |
    [[[
      const last = entity?.attributes?.laatste_prednison ? new Date(entity.attributes.laatste_prednison) : null;
      const when = last ? last.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'short' }) + ' ' +
        last.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : 'nog nooit';
      return entity?.state === 'vergeten'
        ? `Laatst gegeven: ${when} · tik als hij hem nu krijgt`
        : '¼ pil · tik als hij hem gehad heeft';
    ]]]
  styles:
    card:
      - min-height: '[[[ return entity?.state === "vergeten" ? "104px" : "84px"; ]]]'
    name:
      - font-size: '[[[ return entity?.state === "vergeten" ? "20px" : "16px"; ]]]'

# Medicijnen van Pixel bijna op: prednison onder 2 pillen of antibraak nog maar 1 (of minder). Tik opent de pagina Medicijnen.
pixel_med_low:
  template: alert
  icon: mdi:pill-off
  variables:
    color: 255, 176, 96
    pulse: false
  tap_action:
    action: navigate
    navigation_path: /dashboard-huis/pixel_medicijnen
  name: Medicijnen van Pixel bijna op
  label: |
    [[[
      const fmt = v => { const w = Math.floor(v), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round((v - w) * 4) / 4]; return f ? `${w || ''}${f}` : `${w}`; };
      const p = parseFloat(states['input_number.pixel_prednison_voorraad']?.state) || 0;
      const a = parseFloat(states['input_number.pixel_antibraak_voorraad']?.state) || 0;
      const parts = [];
      if (p < 2) parts.push(`prednison nog ${fmt(p)} (${Math.floor(p / 0.25)} ${Math.floor(p / 0.25) === 1 ? 'dag' : 'dagen'})`);
      if (a < 1.5) parts.push(`antibraak nog ${fmt(a)}`);
      return `${parts.join(' · ')} · tijd om nieuwe te halen`;
    ]]]

# Voorraad van een medicijn, groot, met hoeveel dagen het nog genoeg is (prednison: een kwart per dag) en een knop "geven".
# variables.medicine: prednison of antibraak, variables.dose: de dosis in pillen, variables.low: grens voor bijna op.
med_stock:
  template: glass
  triggers_update: all
  variables:
    medicine: prednison
    dose: 0.25
    low: 2
  show_icon: false
  show_name: false
  # Templates in target en bevestiging vult button-card niet in, dus via JavaScript met een bevestigingsvraag
  tap_action:
    action: javascript
    javascript: |
      [[[
        const what = `${{ 0.25: 'een kwart', 0.5: 'een halve' }[variables.dose] ?? 'een'} ${variables.medicine}`;
        if (window.confirm(`Heeft Pixel ${what} gekregen?`))
          hass.callService('input_button', 'press', { entity_id: `input_button.pixel_${variables.medicine}_gegeven` });
      ]]]
  hold_action:
    action: more-info
  custom_fields:
    body: |
      [[[
        const fmt = v => { const w = Math.floor(v), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round((v - w) * 4) / 4]; return f ? `${w || ''}${f}` : `${w}`; };
        const stock = parseFloat(entity?.state) || 0;
        const rgb = stock < variables.low ? '255, 107, 107' : stock < variables.low * 2 ? '255, 176, 96' : '74, 222, 128';
        const name = variables.medicine === 'prednison' ? 'Prednison' : 'Antibraak';
        const times = Math.floor(stock / variables.dose);
        const days = variables.medicine === 'prednison' ? `genoeg voor ${times} dagen` : `genoeg voor ${times} keer`;
        const last = states['sensor.pixel_medicijnen']?.attributes?.[`laatste_${variables.medicine}`];
        const lastText = last ? `laatst ${new Date(last).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} ${new Date(last).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}` : 'nog niet gegeven';
        // Prijs: per pil uit het doosje, en wat het tot nu toe kostte (NetDaemon telt de voorraadregels op)
        const eur = v => (v ?? 0).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' });
        const boxPrice = parseFloat(states[`input_number.pixel_${variables.medicine}_doosprijs`]?.state);
        const boxSize = parseFloat(states[`input_number.pixel_${variables.medicine}_doosgrootte`]?.state);
        const perPill = boxSize > 0 ? boxPrice / boxSize : 0;
        const spent = states['sensor.pixel_medicijnen']?.attributes?.[`${variables.medicine}_kosten`];
        const priceText = perPill > 0
          ? `${eur(perPill)} per pil · ${eur(perPill * variables.dose)} per ${variables.medicine === 'prednison' ? 'dag' : 'keer'}<br>doosje van ${boxSize} ${eur(boxPrice)} · tot nu toe ${eur(spent)}`
          : 'Vul de prijs van een doosje in';
        // De pil in de cirkel, verdeeld in stukjes van een gift: wat er nog van de aangebroken pil over is, licht op;
        // het stukje dat je nu geeft knippert zacht, de stukjes die al op zijn staan gestippeld
        const parts = Math.round(1 / variables.dose);
        const rest = stock - Math.floor(stock);
        const left = stock <= 0 ? 0 : rest < 0.001 ? parts : Math.round(rest / variables.dose);
        const R = 33, at = a => `${(R * Math.cos(a)).toFixed(2)},${(R * Math.sin(a)).toFixed(2)}`;
        let pill = '';
        for (let i = 0; i < parts; i++) {
          const a0 = -Math.PI / 2 + i * 2 * Math.PI / parts, a1 = a0 + 2 * Math.PI / parts;
          const path = `M0,0 L${at(a0)} A${R},${R} 0 0 1 ${at(a1)} Z`;
          pill += i < left
            ? `<path d="${path}" fill="rgba(${rgb},0.8)">${i === left - 1 ? '<animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>' : ''}</path>`
            : `<path d="${path}" fill="rgba(255,255,255,0.03)" stroke="rgba(${rgb},0.45)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        }
        // Breukgleuven, en een glans zodat het een pil lijkt
        for (let i = 0; i < parts; i++) {
          const a = -Math.PI / 2 + i * 2 * Math.PI / parts;
          pill += `<line x1="0" y1="0" x2="${(R * Math.cos(a)).toFixed(2)}" y2="${(R * Math.sin(a)).toFixed(2)}" stroke="#151a26" stroke-width="2.5"/>`;
        }
        pill += `<circle r="${R}" fill="none" stroke="rgba(${rgb},0.7)" stroke-width="2"/>
          <ellipse cx="-11" cy="-15" rx="10" ry="5" fill="rgba(255,255,255,0.18)" transform="rotate(-30 -11 -15)"/>`;
        return `<div style="display:flex;align-items:center;gap:16px;text-align:left">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;opacity:0.75">${name} · ${fmt(variables.dose)} pil per keer</div>
              <div style="display:flex;align-items:baseline;gap:8px">
                <span style="font-size:52px;font-weight:200;line-height:1.05;color:rgb(${rgb})">${fmt(stock)}</span>
                <span style="font-size:13px;font-weight:600">${stock === 1 ? 'pil' : 'pillen'} · ${days}</span>
              </div>
              <div style="font-size:12px;opacity:0.65;margin-top:4px">${lastText}</div>
              <div style="font-size:12px;opacity:0.65;margin-top:2px">${priceText}</div>
            </div>
            <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:4px">
              <svg viewBox="-36 -36 72 72" width="74" height="74">${pill}</svg>
              <span style="font-size:11px;font-weight:600;opacity:0.85">−${fmt(variables.dose)} geven</span>
            </div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"body"'
    card:
      - padding: 16px 18px
      - cursor: pointer
    custom_fields:
      body:
        - width: 100%

# Geschiedenis van de medicijnen, per dag: wat Pixel kreeg en wanneer, en elke aanpassing van de voorraad.
med_history:
  template: glass
  entity: sensor.pixel_medicijnen
  triggers_update:
    - sensor.pixel_medicijnen
  show_icon: false
  show_name: false
  # Tik = alles bekijken: kies een periode, en bij het scrollen komen er steeds 7 dagen bij
  tap_action:
    action: javascript
    javascript: |
      [[[
        if (document.getElementById('huis-medlog')) return;
        const all = window.huisMedHistory ?? [], renderDay = window.huisMedHistoryDay;
        if (!renderDay) return;
        const iso = d => d.toLocaleDateString('sv-SE');
        const overlay = document.createElement('div');
        overlay.id = 'huis-medlog';
        overlay.innerHTML = `<style>
            #huis-medlog { position: fixed; inset: 0; z-index: 100000; background: #0b0f19; color: #f2f4f8; display: flex; flex-direction: column;
              font-family: var(--paper-font-body1_-_font-family, Roboto, sans-serif); }
            #huis-medlog .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
            #huis-medlog .title { font-size: 17px; font-weight: 600; flex: 1; min-width: 140px; }
            #huis-medlog input { background: rgba(255,255,255,0.08); color: inherit; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
              height: 34px; padding: 0 8px; color-scheme: dark; }
            #huis-medlog button { background: rgba(255,255,255,0.08); color: inherit; border: 1px solid rgba(255,255,255,0.12);
              border-radius: 10px; min-width: 38px; height: 34px; padding: 0 10px; font-size: 14px; }
            #huis-medlog .list { flex: 1; overflow-y: auto; padding: 8px 16px 40px; max-width: 760px; width: 100%; box-sizing: border-box; margin: 0 auto; }
            #huis-medlog .end { text-align: center; opacity: 0.5; font-size: 12px; padding: 16px; }
          </style>
          <div class="bar"><span class="title">💊 Geschiedenis medicijnen</span>
            <label>van <input type="date" class="from"></label><label>tot <input type="date" class="to"></label>
            <button data-a="all">Alles</button><button data-a="close">✕</button></div>
          <div class="list"><div class="items"></div><div class="end"></div></div>`;
        const from = overlay.querySelector('.from'), to = overlay.querySelector('.to');
        const items = overlay.querySelector('.items'), end = overlay.querySelector('.end'), list = overlay.querySelector('.list');
        const firstDay = all.length ? new Date(all[all.length - 1].tijd) : new Date();
        to.value = iso(new Date()); from.value = iso(firstDay);
        // Dagen nieuwste eerst, binnen de gekozen periode; per keer zeven dagen erbij
        let days = [], shown = 0;
        const reset = () => {
          const lo = new Date(`${from.value}T00:00:00`), hi = new Date(`${to.value}T23:59:59`);
          const byDay = new Map();
          for (const e of all) { const t = new Date(e.tijd); if (t < lo || t > hi) continue; const k = iso(t); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); }
          days = [...byDay.entries()]; shown = 0; items.innerHTML = ''; more();
        };
        const more = () => {
          const next = days.slice(shown, shown + 7);
          items.insertAdjacentHTML('beforeend', next.map(([, events]) => renderDay(events)).join(''));
          shown += next.length;
          end.textContent = !days.length ? 'Niets in deze periode.' : shown < days.length ? 'Meer laden…' : 'Dat was alles.';
        };
        new IntersectionObserver(entries => { if (entries[0].isIntersecting && shown < days.length) more(); }, { root: list }).observe(end);
        from.addEventListener('change', reset); to.addEventListener('change', reset);
        overlay.querySelector('.bar').addEventListener('click', e => {
          const a = e.target.closest('button')?.dataset.a;
          if (a === 'close') overlay.remove();
          if (a === 'all') { from.value = iso(firstDay); to.value = iso(new Date()); reset(); }
        });
        document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', esc); overlay.remove(); } });
        document.body.appendChild(overlay);
        reset();
      ]]]
  custom_fields:
    list: |
      [[[
        const fmt = v => { const a = Math.abs(v), w = Math.floor(a), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round((a - w) * 4) / 4]; return f ? `${w || ''}${f}` : `${w}`; };
        const events = entity?.attributes?.geschiedenis ?? [];
        window.huisMedHistory = events;
        if (!events.length) return '<div style="opacity:0.6;padding:6px">Nog niets gegeven of aangepast.</div>';
        // Eén dag (de regels van die dag, nieuwste eerst) als HTML
        const renderDay = dayEvents => {
        const t0 = new Date(dayEvents[0].tijd);
        const dayName = t0.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: t0.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
        let out = `<div style="font-size:12px;font-weight:700;opacity:0.7;margin:12px 0 4px">${dayName.charAt(0).toUpperCase() + dayName.slice(1)}</div>`;
        for (const e of dayEvents) {
          const t = new Date(e.tijd);
          const isPred = e.medicijn === 'prednison';
          const name = isPred ? 'prednison' : 'antibraak';
          const given = e.soort === 'gegeven', correction = e.soort === 'correctie';
          // Een ongedaan gemaakte gift blijft staan, doorgestreept; de correctie is een eigen regel
          const color = correction || e.gecorrigeerd ? '#9ca3af' : given ? (isPred ? '#ffb060' : '#60a5fa') : '#4ade80';
          const icon = correction ? 'mdi:undo' : given ? (isPred ? 'mdi:pill' : 'mdi:pill-multiple') : 'mdi:package-variant-plus';
          const text = correction
            ? `Gift ongedaan gemaakt · ${fmt(e.hoeveelheid)} ${name} terug`
            : given
              ? `<span style="${e.gecorrigeerd ? 'text-decoration:line-through;opacity:0.6' : ''}">${fmt(e.hoeveelheid)} ${name} gegeven</span>${e.gecorrigeerd ? ' <span style="font-weight:400;opacity:0.6">(ongedaan gemaakt)</span>' : ''}`
              : `Voorraad ${name} ${e.hoeveelheid > 0 ? '+' : '−'}${fmt(e.hoeveelheid)}`;
          out += `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 2px;border-top:1px solid rgba(255,255,255,0.05)">
              <div style="width:30px;height:30px;border-radius:50%;background:${color}33;display:flex;align-items:center;justify-content:center">
                <ha-icon icon="${icon}" style="--mdc-icon-size:17px;color:${color}"></ha-icon></div>
              <div style="text-align:left"><div style="font-size:13px;font-weight:600">${text}</div>
                <div style="font-size:11px;opacity:0.6">nog ${fmt(e.voorraad)} ${e.voorraad === 1 ? 'pil' : 'pillen'}${e.kosten ? ` · ${e.kosten.toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' })}` : ''}</div></div>
              <div style="font-size:13px;font-weight:600;opacity:0.85">${t.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}</div>
            </div>`;
        }
        return out;
        };
        window.huisMedHistoryDay = renderDay;

        // De kaart: de laatste 7 dagen, gegroepeerd per dag
        const weekAgo = Date.now() - 7 * 86400000;
        const groups = [];
        for (const e of events) {
          if (new Date(e.tijd) < weekAgo) break;
          const k = new Date(e.tijd).toLocaleDateString('sv-SE');
          if (groups.length && groups[groups.length - 1].k === k) groups[groups.length - 1].list.push(e); else groups.push({ k, list: [e] });
        }
        const older = events.length - groups.reduce((n, g) => n + g.list.length, 0);
        return (groups.length ? groups.map(g => renderDay(g.list)).join('') : '<div style="opacity:0.6;padding:6px">Afgelopen week niets gegeven of aangepast.</div>')
          + `<div style="margin-top:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,0.06);text-align:center;font-size:13px">
              Tik om alles te bekijken of een periode te kiezen${older ? ` · nog ${older} oudere ${older === 1 ? 'regel' : 'regels'}` : ''}</div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"list"'
    card:
      - cursor: pointer
    custom_fields:
      list:
        - width: 100%

# Gedeelde schermvullende tijdlijn (liggend, met inzoomen en schuiven) voor de braakgrafiek en de medicijnen.
# Gebruik: template [glass, timeline_overlay] en in de tap_action: variables.open_timeline({ title, defaultDays, lanes }).
timeline_overlay:
  variables:
    open_timeline: |
      [[[
          // Schermvullende tijdlijn, liggend: inzoomen door een stuk te selecteren, knijpen of scrollen; schuiven met twee
          // vingers of de pijlen. Draaien kan de telefoon niet altijd: dan draait de grafiek zelf 90 graden.
          // opts: { title, defaultDays, lanes: [{ name, color, points: [{ t, label? }], steps?: [{ t, v }], unit? }] }
          const open = opts => {
            if (document.getElementById('huis-timeline')) return;
            const H = 3600000, D = 24 * H, days = opts.defaultDays ?? 14;
            const lanes = opts.lanes.map(l => ({ ...l, points: (l.points ?? []).slice().sort((a, b) => a.t - b.t),
              steps: (l.steps ?? []).slice().sort((a, b) => a.t - b.t) }));
            const endOfToday = (() => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); })();
            const allTimes = lanes.flatMap(l => [...l.points.map(p => p.t), ...l.steps.map(p => p.t)]);
            const first = allTimes.length ? Math.min(...allTimes) : endOfToday - days * D;
            const minStart = Math.min(first - D, endOfToday - days * D);
            let view = { start: endOfToday - days * D, end: endOfToday };
            const frac = v => { const w = Math.floor(v), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round((v - w) * 4) / 4]; return f ? `${w || ''}${f}` : `${w}`; };

            const overlay = document.createElement('div');
            overlay.id = 'huis-timeline';
            overlay.innerHTML = `<style>
                #huis-timeline { position: fixed; inset: 0; z-index: 100000; background: #0b0f19; color: #f2f4f8;
                  font-family: var(--paper-font-body1_-_font-family, Roboto, sans-serif); user-select: none; -webkit-user-select: none; }
                #huis-timeline .stage { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; padding: 12px 18px 10px;
                  box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
                @media (orientation: portrait) {
                  #huis-timeline .stage { width: 100vh; height: 100vw; transform-origin: top left; transform: translateX(100vw) rotate(90deg); }
                }
                #huis-timeline .bar { display: flex; align-items: center; gap: 12px; }
                #huis-timeline .title { font-size: 17px; font-weight: 600; white-space: nowrap; }
                #huis-timeline .range { font-size: 13px; opacity: 0.7; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                #huis-timeline button { background: rgba(255,255,255,0.08); color: inherit; border: 1px solid rgba(255,255,255,0.12);
                  border-radius: 10px; min-width: 38px; height: 34px; font-size: 15px; padding: 0 10px; cursor: pointer; }
                #huis-timeline .chart { position: relative; flex: 1; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.2);
                  touch-action: none; cursor: crosshair; }
                #huis-timeline .brush { position: absolute; top: 0; bottom: 0; background: rgba(255,176,96,0.18);
                  border-left: 1px solid #ffb060; border-right: 1px solid #ffb060; display: none; pointer-events: none; }
                #huis-timeline .help { font-size: 11px; opacity: 0.5; text-align: center; }
              </style>
              <div class="stage">
                <div class="bar"><span class="title">${opts.title}</span><span class="range"></span>
                  <button data-a="left">◀</button><button data-a="out">−</button><button data-a="in">+</button><button data-a="right">▶</button>
                  <button data-a="reset">${days === 7 ? '1 week' : `${days / 7} weken`}</button><button data-a="close">✕</button></div>
                <div class="chart"><div class="plot"></div><div class="brush"></div></div>
                <div class="help">Sleep over een stuk om in te zoomen · knijpen of scrollen zoomt · twee vingers of ◀ ▶ schuiven</div>
              </div>`;
            const chart = overlay.querySelector('.chart'), plot = overlay.querySelector('.plot'), brush = overlay.querySelector('.brush');
            const rangeText = overlay.querySelector('.range');

            const clamp = v => {
              const span = Math.max(30 * 60000, Math.min(v.end - v.start, endOfToday - minStart));
              const start = Math.max(minStart, Math.min(v.start, endOfToday - span));
              return { start, end: start + span };
            };
            const fmtDay = (t, long) => new Date(t).toLocaleDateString('nl-NL', long ? { weekday: 'short', day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric' });
            const fmtTime = t => new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });

            const draw = () => {
              const W = chart.clientWidth, Hh = chart.clientHeight, span = view.end - view.start;
              const x = t => (t - view.start) / span * W;
              const laneH = (Hh - 48) / lanes.length;
              let out = '';
              // Dagen: weekend, scheidingslijn om middernacht en het label onderaan (zo veel als past)
              const day0 = new Date(view.start); day0.setHours(0, 0, 0, 0);
              for (let d = day0.getTime(); d < view.end; d += D) {
                const dd = new Date(d); dd.setHours(0, 0, 0, 0); const s = dd.getTime(), e = s + D;
                const left = Math.max(0, x(s)), right = Math.min(W, x(e)), w = right - left;
                if (w <= 0) continue;
                const weekend = dd.getDay() === 0 || dd.getDay() === 6, isToday = e === endOfToday;
                out += `<div style="position:absolute;left:${left}px;width:${w}px;top:0;bottom:0;${weekend ? 'background:rgba(255,255,255,0.03);' : ''}
                    border-left:1px solid rgba(255,255,255,${x(s) >= 0 ? 0.12 : 0})"></div>`;
                const text = w > 110 ? fmtDay(s, true) : w >= 50 ? fmtDay(s, false) : w >= 20 ? String(dd.getDate()) : '';
                if (text) out += `<div style="position:absolute;left:${left}px;width:${w}px;bottom:4px;text-align:center;font-size:12px;white-space:nowrap;
                    overflow:hidden;${isToday ? 'color:#ffb060;font-weight:700' : `opacity:${dd.getDay() === 1 ? 0.9 : 0.65}`}">${text}</div>`;
              }
              // Uurlijnen: zo fijn als er ruimte is
              const step = [15, 30, 60, 180, 360, 720].map(m => m * 60000).find(st => st / span * W >= 46);
              if (step) for (let t = Math.ceil(view.start / step) * step; t < view.end; t += step) {
                const dt = new Date(t); if (dt.getHours() === 0 && dt.getMinutes() === 0) continue;
                out += `<div style="position:absolute;left:${x(t)}px;top:22px;bottom:24px;border-left:1px dotted rgba(255,255,255,0.14)"></div>
                  <div style="position:absolute;left:${x(t)}px;top:6px;transform:translateX(-50%);font-size:10px;opacity:0.5">${fmtTime(t)}</div>`;
              }
              // Per baan: de voorraad als lijn (met de waarde bij elke verandering) en een stip per moment
              const counts = [];
              lanes.forEach((lane, i) => {
                const top = 22 + i * laneH, h = laneH;
                if (lanes.length > 1) out += `<div style="position:absolute;left:8px;top:${top + 2}px;font-size:12px;font-weight:600;color:${lane.color}">${lane.name}</div>`;
                if (i > 0) out += `<div style="position:absolute;left:0;right:0;top:${top}px;border-top:1px solid rgba(255,255,255,0.08)"></div>`;
                if (lane.steps.length) {
                  const max = Math.max(...lane.steps.map(p => p.v), 1);
                  const y = v => top + h - 8 - v / max * (h * 0.55);
                  let d = '', lastLabel = -1e9;
                  const before = [...lane.steps].reverse().find(p => p.t <= view.start);
                  const pts = [...(before ? [{ t: view.start, v: before.v }] : []), ...lane.steps.filter(p => p.t > view.start && p.t <= view.end)];
                  pts.forEach((p, j) => {
                    d += j === 0 ? `M${x(p.t)},${y(p.v)}` : ` H${x(p.t)} V${y(p.v)}`;
                    if (x(p.t) - lastLabel > 34 && p.t > view.start) {
                      out += `<div style="position:absolute;left:${x(p.t) + 3}px;top:${y(p.v) - 15}px;font-size:10px;color:${lane.color};opacity:0.85">${frac(p.v)}</div>`;
                      lastLabel = x(p.t);
                    }
                  });
                  if (pts.length) {
                    const endX = Math.min(W, x(Math.min(Date.now(), view.end)));
                    d += ` H${endX}`;
                    out += `<svg style="position:absolute;left:0;top:0;width:${W}px;height:${Hh}px;overflow:visible;pointer-events:none">
                        <path d="${d}" fill="none" stroke="${lane.color}" stroke-width="2" stroke-opacity="0.75"/></svg>`;
                  }
                }
                const rows = [-1e9, -1e9];
                const shown = lane.points.filter(p => p.t >= view.start && p.t <= view.end);
                counts.push(`${lanes.length > 1 ? `${lane.name.toLowerCase()} ` : ''}${shown.length}×`);
                const cy = lane.steps.length ? top + 40 : top + h / 2;
                for (const p of shown) {
                  const px = x(p.t);
                  let row = rows.findIndex(last => px - last > 44); if (row < 0) row = 0;
                  rows[row] = px;
                  out += `<div style="position:absolute;left:${px}px;top:${cy}px;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
                      background:${lane.color};box-shadow:0 0 10px ${lane.color}"></div>
                    <div style="position:absolute;left:${px}px;top:${cy + (row ? 10 : -22)}px;transform:translateX(-50%);font-size:11px;font-weight:600;
                      color:${lane.color};white-space:nowrap">${fmtTime(p.t)}${p.label ? ` · ${p.label}` : ''}</div>`;
                }
              });
              plot.innerHTML = out;
              rangeText.textContent = `${fmtDay(view.start, true)} – ${fmtDay(view.end - 1, true)} · ${counts.join(' · ')}`;
            };

            // Waar op de tijdas (0..1); bij de gedraaide weergave loopt de tijdas van boven naar beneden
            const rotated = () => matchMedia('(orientation: portrait)').matches;
            const pos = e => { const r = chart.getBoundingClientRect(); return Math.max(0, Math.min(1, rotated() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width)); };
            const zoomAt = (f, factor) => { const span = view.end - view.start, t = view.start + f * span, ns = span * factor; view = clamp({ start: t - f * ns, end: t - f * ns + ns }); draw(); };

            const pointers = new Map();
            let brushFrom = null, pinch = null;
            chart.addEventListener('pointerdown', e => {
              chart.setPointerCapture?.(e.pointerId);
              pointers.set(e.pointerId, pos(e));
              if (pointers.size === 1) { brushFrom = pos(e); pinch = null; }
              if (pointers.size === 2) { brushFrom = null; brush.style.display = 'none'; const [a, b] = [...pointers.values()]; pinch = { a, b, view: { ...view } }; }
            });
            chart.addEventListener('pointermove', e => {
              if (!pointers.has(e.pointerId)) return;
              pointers.set(e.pointerId, pos(e));
              if (pinch && pointers.size >= 2) {
                const [a, b] = [...pointers.values()], span0 = pinch.view.end - pinch.view.start;
                const t = pinch.view.start + (pinch.a + pinch.b) / 2 * span0, mid1 = (a + b) / 2;
                const ns = span0 * Math.max(0.02, Math.abs(pinch.b - pinch.a)) / Math.max(0.02, Math.abs(b - a));
                view = clamp({ start: t - mid1 * ns, end: t - mid1 * ns + ns }); draw();
              } else if (brushFrom !== null) {
                const f = pos(e), lo = Math.min(brushFrom, f), hi = Math.max(brushFrom, f);
                Object.assign(brush.style, { display: 'block', left: `${lo * 100}%`, width: `${(hi - lo) * 100}%` });
              }
            });
            const up = e => {
              if (!pointers.has(e.pointerId)) return;
              const f = pos(e);
              pointers.delete(e.pointerId);
              if (brushFrom !== null && pointers.size === 0 && Math.abs(f - brushFrom) > 0.02) {
                const span = view.end - view.start, lo = Math.min(brushFrom, f), hi = Math.max(brushFrom, f);
                view = clamp({ start: view.start + lo * span, end: view.start + hi * span }); draw();
              }
              if (pointers.size === 0) { brushFrom = null; pinch = null; brush.style.display = 'none'; }
            };
            chart.addEventListener('pointerup', up);
            chart.addEventListener('pointercancel', up);
            chart.addEventListener('wheel', e => {
              e.preventDefault();
              if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const span = view.end - view.start; view = clamp({ start: view.start + e.deltaX / 600 * span, end: view.end + e.deltaX / 600 * span }); draw(); }
              else zoomAt(pos(e), e.deltaY > 0 ? 1.25 : 0.8);
            }, { passive: false });

            const close = () => {
              try { screen.orientation?.unlock?.(); } catch (err) {}
              if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
              window.removeEventListener('resize', draw);
              overlay.remove();
            };
            overlay.querySelector('.bar').addEventListener('click', e => {
              const a = e.target.closest('button')?.dataset.a; if (!a) return;
              const span = view.end - view.start;
              if (a === 'close') return close();
              if (a === 'left') view = clamp({ start: view.start - span / 2, end: view.end - span / 2 });
              if (a === 'right') view = clamp({ start: view.start + span / 2, end: view.end + span / 2 });
              if (a === 'in') return zoomAt(0.5, 0.5);
              if (a === 'out') return zoomAt(0.5, 2);
              if (a === 'reset') view = { start: endOfToday - days * D, end: endOfToday };
              draw();
            });
            document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(); } });
            document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && overlay.isConnected) close(); });
            window.addEventListener('resize', draw);
            document.body.appendChild(overlay);
            draw();
            requestAnimationFrame(draw);
            overlay.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
          };
          window.huisOpenTimeline = open;
          return open;
      ]]]

# Medicijnen van Pixel in een grafiek van twee weken: per medicijn de voorraad als lijn en een stip per gift.
# Tik = schermvullend, met inzoomen en terugkijken in alle geschiedenis.
med_chart:
  template:
    - glass
    - timeline_overlay
  entity: sensor.pixel_medicijnen
  triggers_update:
    - sensor.pixel_medicijnen
  show_icon: false
  show_name: false
  tap_action:
    action: javascript
    javascript: |
      [[[
        (variables.open_timeline ?? window.huisOpenTimeline)({ title: '💊 Medicijnen van Pixel', defaultDays: 14, lanes: window.huisMedLanes ?? [] });
      ]]]
  custom_fields:
    chart: |
      [[[
        // Banen per medicijn: giften als stippen (correcties tellen niet) en de voorraad na elke regel als lijn
        // De geschiedenis komt nieuwste eerst; voor de lijn op volgorde van tijd
        const events = (entity?.attributes?.geschiedenis ?? []).map(e => ({ ...e, t: new Date(e.tijd).getTime() }))
          .filter(e => !isNaN(e.t)).sort((a, b) => a.t - b.t);
        const lane = (medicine, name, color) => ({ name, color,
          points: events.filter(e => e.medicijn === medicine && e.soort === 'gegeven' && !e.gecorrigeerd).map(e => ({ t: e.t })),
          steps: events.filter(e => e.medicijn === medicine).map(e => ({ t: e.t, v: e.voorraad })) });
        const lanes = [lane('prednison', 'Prednison', '#ffb060'), lane('antibraak', 'Antibraak', '#60a5fa')];
        window.huisMedLanes = lanes;

        // Twee weken, elke dag even breed
        const D = 86400000, end = (() => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); })(), start = end - 14 * D;
        const x = t => (t - start) / (end - start) * 100;
        const frac = v => { const w = Math.floor(v), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round((v - w) * 4) / 4]; return f ? `${w || ''}${f}` : `${w}`; };
        let days = '';
        for (let d = start; d < end; d += D) {
          const dd = new Date(d), today = d + D === end;
          days += `<div style="position:absolute;left:${x(d)}%;width:${100 / 14}%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,0.07);
              ${dd.getDay() === 0 || dd.getDay() === 6 ? 'background:rgba(255,255,255,0.03);' : ''}"></div>
            <div style="position:absolute;left:${x(d)}%;width:${100 / 14}%;bottom:2px;text-align:center;font-size:9px;
              ${today ? 'color:var(--accent-color);font-weight:700' : 'opacity:0.55'}">${today ? 'nu' : dd.getDate()}</div>`;
        }
        let rows = '';
        lanes.forEach((l, i) => {
          const top = 4 + i * 48;
          const max = Math.max(...l.steps.map(p => p.v), 1);
          const before = [...l.steps].reverse().find(p => p.t <= start);
          const pts = [...(before ? [{ t: start, v: before.v }] : []), ...l.steps.filter(p => p.t > start)];
          let path = '';
          pts.forEach((p, j) => { path += j === 0 ? `M${x(p.t)},${top + 40 - p.v / max * 24}` : ` H${x(p.t)} V${top + 40 - p.v / max * 24}`; });
          if (pts.length) path += ` H${x(Math.min(Date.now(), end))}`;
          const now = l.steps.length ? l.steps[l.steps.length - 1].v : null;
          rows += `<div style="position:absolute;left:6px;top:${top}px;font-size:11px;font-weight:600;color:${l.color}">${l.name}${now !== null ? ` · ${frac(now)}` : ''}</div>
            <svg viewBox="0 0 100 104" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:104px;overflow:visible">
              <path d="${path}" fill="none" stroke="${l.color}" stroke-width="2" stroke-opacity="0.7" vector-effect="non-scaling-stroke"/></svg>
            ${l.points.filter(p => p.t >= start).map(p => `<div style="position:absolute;left:${x(p.t)}%;top:${top + 18}px;width:9px;height:9px;margin-left:-4.5px;
              border-radius:50%;background:${l.color};box-shadow:0 0 6px ${l.color}"></div>`).join('')}`;
        });
        return `<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;opacity:0.8">Laatste 2 weken</span>
            <span style="font-size:11px;opacity:0.55">tik om in te zoomen</span></div>
          <div style="position:relative;height:118px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.15)">${days}${rows}</div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"chart"'
    card:
      - padding: 12px 14px
      - cursor: pointer
    custom_fields:
      chart:
        - width: 100%
        - text-align: left

# Datum intikken (of jaar en maand los kiezen) in plaats van HA's kalender, waar je per maand terug moet klikken.
# entity: een input_datetime met alleen een datum. Tik opent een venster boven de pagina met een gewoon datumveld en
# "Opslaan" (een invoerveld in de kaart zelf werkt niet goed: de kaart vangt de klikken af en tekent opnieuw).
date_input:
  template: glass
  show_label: true
  label: |
    [[[
      const m = String(entity?.state ?? '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Nog niet ingevuld · tik om in te vullen';
    ]]]
  tap_action:
    action: javascript
    javascript: |
      [[[
        if (document.getElementById('huis-datum')) return;
        const current = /^\d{4}-\d{2}-\d{2}/.test(entity?.state ?? '') ? entity.state.slice(0, 10) : '';
        const overlay = document.createElement('div');
        overlay.id = 'huis-datum';
        overlay.innerHTML = `<style>
            #huis-datum { position: fixed; inset: 0; z-index: 100000; background: rgba(5,8,16,0.6); backdrop-filter: blur(4px);
              display: flex; align-items: center; justify-content: center; font-family: var(--paper-font-body1_-_font-family, Roboto, sans-serif); }
            #huis-datum .box { background: #151b2b; color: #f2f4f8; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px;
              width: min(340px, 90vw); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
            #huis-datum .title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
            #huis-datum input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.08); color: inherit; font-size: 18px;
              border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; height: 46px; padding: 0 12px; color-scheme: dark; }
            #huis-datum .hint { font-size: 12px; opacity: 0.6; margin: 8px 2px 16px; }
            #huis-datum .buttons { display: flex; gap: 10px; justify-content: flex-end; }
            #huis-datum button { border: none; border-radius: 12px; height: 40px; padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
            #huis-datum .cancel { background: rgba(255,255,255,0.08); color: inherit; }
            #huis-datum .save { background: #4ade80; color: #0b1a10; }
            #huis-datum .save:disabled { opacity: 0.4; cursor: default; }
          </style>
          <div class="box"><div class="title">${entity?.attributes?.friendly_name ?? 'Datum'}</div>
            <input type="date" value="${current}" min="1900-01-01" max="2100-12-31">
            <div class="hint">Tik de datum in (dag, maand, jaar) of kies hem in de kalender</div>
            <div class="buttons"><button class="cancel">Annuleren</button><button class="save">Opslaan</button></div></div>`;
        const input = overlay.querySelector('input'), save = overlay.querySelector('.save');
        const valid = () => /^\d{4}-\d{2}-\d{2}$/.test(input.value) && +input.value.slice(0, 4) >= 1900;
        const check = () => { save.disabled = !valid(); };
        input.addEventListener('input', check); input.addEventListener('change', check); check();
        const close = () => overlay.remove();
        overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        overlay.querySelector('.cancel').addEventListener('click', close);
        save.addEventListener('click', () => {
          if (!valid()) return;
          hass.callService('input_datetime', 'set_datetime', { entity_id: entity.entity_id, date: input.value });
          close();
        });
        input.addEventListener('keyup', e => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') close(); });
        document.body.appendChild(overlay);
        setTimeout(() => input.focus(), 50);
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: auto 1fr
      - column-gap: 12px
    card:
      - min-height: 60px
    icon:
      - width: 22px
      - color: var(--accent-color)
    label:
      - justify-self: start
      - font-size: 13px
      - opacity: 0.8
