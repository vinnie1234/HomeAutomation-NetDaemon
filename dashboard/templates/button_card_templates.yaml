# Gedeelde button-card templates. Elke kaart op het dashboard bouwt hierop voort,
# zodat stijl en gedrag op één plek staan.

# Glazen basiskaart.
glass:
  show_state: false
  styles:
    card:
      - border-radius: 24px
      - padding: 14px
      - background: rgba(255, 255, 255, 0.06)
      - border: 1px solid rgba(255, 255, 255, 0.08)
      - box-shadow: none
      - transition: all 0.4s ease
    name:
      - justify-self: start
      - font-weight: 600
      - font-size: 15px
    label:
      - justify-self: start
      - font-size: 12px
      - opacity: 0.7

# Kamertegel. Gloeit in de kleur van de lampen die aan staan.
# Tik opent de pop-up (navigation_path per kaart), lang drukken zet alles aan of uit.
# variables.lights: lijst met lampen, variables.temperature / variables.motion: optionele sensoren.
room:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    lights: []
    temperature: null
    motion: null
  hold_action:
    haptic: heavy
    action: javascript
    javascript: |
      [[[
        const on = variables.lights.filter(e => states[e]?.state === 'on');
        hass.callService('light', on.length ? 'turn_off' : 'turn_on', {
          entity_id: on.length ? on : variables.lights
        });
      ]]]
  label: |
    [[[
      const on = variables.lights.filter(e => states[e]?.state === 'on').length;
      const parts = [on === 0 ? 'Alles uit' : on === 1 ? '1 lamp aan' : `${on} lampen aan`];
      const t = variables.temperature ? parseFloat(states[variables.temperature]?.state) : NaN;
      if (!isNaN(t)) parts.push(`${t.toFixed(1).replace('.', ',')}°`);
      return parts.join(' · ');
    ]]]
  custom_fields:
    motion: |
      [[[
        return variables.motion && states[variables.motion]?.state === 'on'
          ? '<ha-icon icon="mdi:motion-sensor" style="width:18px;color:#7aa2ff"></ha-icon>'
          : '';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i motion" "n n" "l l"'
      - grid-template-columns: 1fr auto
      - grid-template-rows: 1fr auto auto
    card:
      - height: 118px
      - background: |
          [[[
            const on = variables.lights.map(e => states[e]).filter(s => s?.state === 'on');
            if (!on.length) return 'rgba(255, 255, 255, 0.05)';
            const rgb = (on.find(s => s.attributes.rgb_color)?.attributes.rgb_color ?? [255, 176, 96]).join(',');
            return `linear-gradient(135deg, rgba(${rgb}, 0.38) 0%, rgba(${rgb}, 0.10) 55%, rgba(255, 255, 255, 0.04) 100%)`;
          ]]]
      - box-shadow: |
          [[[
            const on = variables.lights.map(e => states[e]).filter(s => s?.state === 'on');
            if (!on.length) return 'none';
            const rgb = (on.find(s => s.attributes.rgb_color)?.attributes.rgb_color ?? [255, 176, 96]).join(',');
            return `0 10px 36px rgba(${rgb}, 0.30)`;
          ]]]
    img_cell:
      - justify-self: start
      - width: 42px
      - height: 42px
      - border-radius: 50%
      - background: rgba(255, 255, 255, 0.10)
    icon:
      - width: 22px
      - color: |
          [[[
            const on = variables.lights.map(e => states[e]).filter(s => s?.state === 'on');
            if (!on.length) return 'rgba(242, 244, 248, 0.6)';
            const rgb = (on.find(s => s.attributes.rgb_color)?.attributes.rgb_color ?? [255, 176, 96]).join(',');
            return `rgb(${rgb})`;
          ]]]
    custom_fields:
      motion:
        - align-self: start
        - justify-self: end

# Persoon met foto, thuis/weg/slaapt.
# variables.sleeping: input_boolean die aangeeft of deze persoon slaapt.
person:
  template: glass
  show_entity_picture: true
  show_label: true
  variables:
    sleeping: null
  name: '[[[ return entity.attributes.friendly_name.split(" ")[0]; ]]]'
  label: |
    [[[
      if (variables.sleeping && states[variables.sleeping]?.state === 'on') return '😴 Slaapt';
      return entity.state === 'home' ? 'Thuis' : entity.state === 'not_home' ? 'Weg' : entity.state;
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: auto 1fr
      - column-gap: 12px
    card:
      - height: 76px
    img_cell:
      - width: 48px
      - height: 48px
    entity_picture:
      - width: 48px
      - height: 48px
      - border-radius: 50%
      - object-fit: cover
      - border: |
          [[[ return `2px solid ${entity.state === 'home' ? '#4ade80' : 'rgba(255, 255, 255, 0.25)'}`; ]]]
      - filter: '[[[ return entity.state === "home" ? "none" : "grayscale(0.8)"; ]]]'
    icon:
      - width: 28px

# Actieknop (scène of snelle actie). Acties worden per kaart opgegeven.
action:
  template: glass
  show_label: false
  styles:
    grid:
      - grid-template-areas: '"i" "n"'
      - row-gap: 6px
    card:
      - height: 84px
      - padding: 10px
    name:
      - justify-self: center
      - font-size: 13px
    icon:
      - width: 24px
      - color: var(--accent-color)

# Informatietegel (energie, Pixel). Tik navigeert naar de bijbehorende pagina.
info:
  template: glass
  triggers_update: all
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "v v" "l l"'
      - grid-template-columns: auto 1fr
      - grid-template-rows: auto 1fr auto
      - column-gap: 10px
    card:
      - height: 140px
    img_cell:
      - justify-self: start
      - width: 36px
      - height: 36px
      - border-radius: 50%
      - background: rgba(255, 255, 255, 0.10)
    icon:
      - width: 20px
    name:
      - font-size: 13px
      - opacity: 0.8
    label:
      - white-space: normal
      - text-align: left
    custom_fields:
      v:
        - justify-self: start
        - align-self: center
        - font-size: 28px
        - font-weight: 700
        - letter-spacing: -0.5px

# Waardetegel: icoon + naam bovenaan, grote toestand eronder (met eenheid).
stat:
  template: glass
  show_state: true
  styles:
    grid:
      - grid-template-areas: '"i n" "s s"'
      - grid-template-columns: auto 1fr
      - grid-template-rows: auto 1fr
      - column-gap: 10px
    card:
      - height: 100px
    img_cell:
      - justify-self: start
      - width: 34px
      - height: 34px
      - border-radius: 50%
      - background: rgba(255, 255, 255, 0.10)
    icon:
      - width: 18px
    name:
      - font-size: 13px
      - font-weight: 500
      - opacity: 0.8
    state:
      - justify-self: start
      - align-self: end
      - font-size: 22px
      - font-weight: 700
      - letter-spacing: -0.3px

# Voortgangsbalk, bijv. dagen tot filter vervangen.
# variables.max: waarde die 100% is, variables.unit: tekst achter de waarde.
progress:
  template: glass
  triggers_update: all
  show_label: true
  variables:
    max: 30
    unit: dagen
  label: |
    [[[
      const v = parseFloat(entity.state);
      return isNaN(v) ? 'Onbekend' : `${Math.round(v)} ${variables.unit}`;
    ]]]
  custom_fields:
    bar: |
      [[[
        const v = parseFloat(entity.state);
        const pct = isNaN(v) ? 0 : Math.max(0, Math.min(100, v / variables.max * 100));
        const color = pct < 15 ? '#ff6b6b' : pct < 35 ? '#ffb060' : '#4ade80';
        return `<div style="height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden">
                  <div style="width:${pct}%;height:100%;background:${color};border-radius:4px;transition:width 0.6s"></div>
                </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n l" "bar bar bar"'
      - grid-template-columns: auto 1fr auto
      - row-gap: 10px
      - column-gap: 10px
    card:
      - height: 86px
    icon:
      - width: 20px
    label:
      - justify-self: end
      - font-size: 13px
      - opacity: 0.9
    custom_fields:
      bar:
        - display: block
        - width: 100%

# Prijstegel: toont de toestand als "€ 0,39".
price:
  template: stat
  state_display: |
    [[[
      const v = parseFloat(entity.state);
      return isNaN(v) ? '–' : `€ ${v.toFixed(2).replace('.', ',')}`;
    ]]]

# Pollen (Google Pollen-index 0-5): naam, niveau en een balk van 5 blokjes.
pollen:
  template: glass
  show_label: true
  name: |
    [[[
      const names = {
        gras: 'Gras', bomen: 'Bomen', onkruid: 'Onkruid', grassen: 'Grassen', berk: 'Berk', els: 'Els',
        es: 'Es', eik: 'Eik', hazelaar: 'Hazelaar', olijfboom: 'Olijfboom', pijnboom: 'Pijnboom',
        ambrosia: 'Ambrosia', bijvoet: 'Bijvoet', cottonwood: 'Populier'
      };
      const key = entity.entity_id.split('_').pop();
      return names[key] ?? key;
    ]]]
  label: |
    [[[
      const levels = ['Geen', 'Zeer laag', 'Laag', 'Matig', 'Hoog', 'Zeer hoog'];
      return levels[Math.round(parseFloat(entity.state))] ?? entity.state;
    ]]]
  custom_fields:
    bar: |
      [[[
        const level = Math.round(parseFloat(entity.state)) || 0;
        const colors = ['#4ade80', '#a3e635', '#facc15', '#fb923c', '#ff6b6b'];
        return `<div style="display:flex;gap:4px">${colors.map((c, i) =>
          `<div style="flex:1;height:6px;border-radius:3px;background:${i < level ? c : 'rgba(255,255,255,0.1)'}"></div>`
        ).join('')}</div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"n l" "bar bar"'
      - grid-template-columns: 1fr auto
      - row-gap: 10px
    card:
      - height: 72px
    label:
      - justify-self: end
      - font-size: 13px
      - opacity: 0.9
    custom_fields:
      bar:
        - display: block
        - width: 100%

# Zonneboog: waar staat de zon tussen opkomst en ondergang, en hoeveel daglicht is er nog.
# Gebruikt sun.sun; de tijden van vandaag worden afgeleid uit next_rising / next_setting.
sun:
  template: glass
  entity: sun.sun
  triggers_update: all
  show_icon: false
  show_name: false
  custom_fields:
    arc: |
      [[[
        const DAY = 86400000;
        const now = new Date();
        const isToday = d => d.toDateString() === now.toDateString();
        const nextRise = new Date(entity.attributes.next_rising);
        const nextSet = new Date(entity.attributes.next_setting);
        const above = entity.state === 'above_horizon';
        const rise = above || !isToday(nextRise) ? new Date(nextRise - DAY) : nextRise;
        const set = above ? nextSet : isToday(nextSet) ? nextSet : new Date(nextSet - DAY);
        const time = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        const span = ms => `${Math.floor(ms / 3600000)}u ${Math.round(ms % 3600000 / 60000)}m`;

        const f = Math.max(0, Math.min(1, (now - rise) / (set - rise)));
        const x = 100 - 90 * Math.cos(Math.PI * f);
        const y = 95 - 90 * Math.sin(Math.PI * f);
        const text = above
          ? `Nog ${span(set - now)} daglicht`
          : `Zon komt op over ${span(nextRise - now)}`;

        return `
          <svg viewBox="0 0 200 110" style="width:100%;max-height:150px">
            <defs>
              <linearGradient id="sunArc" x1="0" x2="1">
                <stop offset="0" stop-color="#ff9a5a"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#ff6f61"/>
              </linearGradient>
            </defs>
            <path d="M10,95 A90,90 0 0,1 190,95" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="3 4"/>
            ${above ? `<path d="M10,95 A90,90 0 0,1 ${x.toFixed(1)},${y.toFixed(1)}" fill="none" stroke="url(#sunArc)" stroke-width="3" stroke-linecap="round"/>
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#ffd166" style="filter:drop-shadow(0 0 8px #ffd166)"/>` : ''}
            <line x1="0" y1="95" x2="200" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          </svg>
          <div style="display:flex;justify-content:space-between;align-items:end;margin-top:-6px">
            <div style="text-align:left"><div style="font-size:12px;opacity:.6">Zon op</div><div style="font-size:20px;font-weight:700">${time(rise)}</div></div>
            <div style="font-size:13px;opacity:.8;padding-bottom:3px">${text}</div>
            <div style="text-align:right"><div style="font-size:12px;opacity:.6">Zon onder</div><div style="font-size:20px;font-weight:700">${time(set)}</div></div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"arc"'
    card:
      - padding: 16px 18px
    custom_fields:
      arc:
        - display: block
        - width: 100%

# Weer-hero voor Home: een realistische lucht van het weer van nu, aangekleed per seizoen of feestdag
# (input_select.weerkaart_thema, "Automatisch" volgt de datum en sensor.season) en met KNMI-weerwaarschuwingen.
# - Zon op de echte plek (azimut = links/rechts, hoogte = hoe hoog), gouden uur bij een lage zon.
# - Lucht en wolken volgen de bewolking in %: overdag nooit donker, bij veel wolken licht grijsblauw.
# - Wolken zijn afbeeldingen (www/clouds, gemaakt met tools/generate_clouds.py) in drie diepte-lagen, getint per weer.
# - Nacht: sterren en de maan in de juiste fase. Regen schuin met de wind, sneeuw, mist, onweer met bliksem.
# Alleen opnieuw tekenen bij weer, zon en personen, zodat de animaties niet steeds herstarten.
# De klok is een geneste markdown-kaart; die werkt zichzelf elke minuut bij.
weather_hero:
  triggers_update:
    - input_boolean.away
    - input_datetime.pixelfeedfirsttime
    - input_datetime.pixelfeedsecondtime
    - input_datetime.pixelfeedthirdtime
    - input_datetime.pixelfeedfourthtime
    - input_boolean.pixelskipnextautofeed
    - input_boolean.laundryhangingoutside
    - sensor.afval_vandaag
    - sensor.afval_morgen
    - weather.weer_thuis
    - input_select.weerkaart_thema
    - input_select.tijd_van_de_dag
    - sensor.season
    - binary_sensor.weer_thuis_waarschuwing_actief
    - sensor.weer_thuis_waarschuwingscode
    - sensor.weer_thuis_waarschuwingen
    - sensor.keuken_timers
    - sensor.badkamer_speaker_timers
    - sensor.gang_speaker_1_timers
    - sensor.woonkamer_timers
    - sensor.hub_vincent_timers
    - weather.weer_thuis_waarnemingen
    - sun.sun
    - sensor.weer_thuis_temperatuur
    - sensor.weer_thuis_bewolking
    - sensor.weer_thuis_windsnelheid
    - sensor.moon_phase
    - sensor.thuis_pollentypen_52_035_53_gras
    - sensor.thuis_pollentypen_52_035_53_onkruid
    - sensor.thuis_planten_52_035_53_ambrosia
    - sensor.thuis_planten_52_035_53_berk
    - sensor.thuis_planten_52_035_53_bijvoet
    - sensor.thuis_planten_52_035_53_cottonwood
    - sensor.thuis_planten_52_035_53_eik
    - sensor.thuis_planten_52_035_53_els
    - sensor.thuis_planten_52_035_53_es
    - sensor.thuis_planten_52_035_53_grassen
    - sensor.thuis_planten_52_035_53_hazelaar
    - sensor.thuis_planten_52_035_53_olijfboom
    - sensor.thuis_planten_52_035_53_pijnboom
    - person.vincent_maarschalkerweerd
    - person.carleen
    - input_boolean.sleepingvincent
    - input_boolean.sleepingcarleen
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  extra_styles: |
    @keyframes hero-drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @keyframes hero-rain { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
    @keyframes hero-snow {
      0% { transform: translate(0, -20px); }
      50% { transform: translate(16px, 160px); }
      100% { transform: translate(0, 360px); }
    }
    @keyframes hero-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes hero-rays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes hero-flash { 0%, 89%, 100% { opacity: 0; } 90%, 93% { opacity: 0.85; } 91.5% { opacity: 0.2; } }
    @keyframes hero-timer-count { from { --timer-t: var(--timer-from); } to { --timer-t: 0; } }
    .hero-countdown {
      --timer-m: calc((var(--timer-t) - 30) / 60);
      --timer-s: calc(var(--timer-t) - var(--timer-m) * 60);
      counter-reset: timer-m var(--timer-m) timer-s var(--timer-s);
      animation: hero-timer-count var(--timer-dur) linear forwards;
      font-variant-numeric: tabular-nums;
    }
    .hero-countdown::after { content: counter(timer-m) ":" counter(timer-s, decimal-leading-zero); }
    @keyframes hero-timer-color { 0%, 75% { background: rgba(255, 176, 96, 0.92); } 82%, 100% { background: rgba(255, 99, 99, 0.95); } }
    @keyframes hero-timer-blink { 50% { opacity: 0.35; } }
    @keyframes hero-timer-hide { to { opacity: 0; } }
    @keyframes hero-timer-show { to { opacity: 1; } }
    @keyframes hero-petal {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(60px, 170px) rotate(180deg); }
      100% { transform: translate(20px, 360px) rotate(360deg); }
    }
    @keyframes hero-leaf {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(40px, 90px) rotate(120deg); }
      50% { transform: translate(-10px, 180px) rotate(200deg); }
      75% { transform: translate(50px, 270px) rotate(300deg); }
      100% { transform: translate(10px, 370px) rotate(400deg); }
    }
    @keyframes hero-firefly {
      0%, 100% { transform: translate(0, 0); opacity: 0.1; }
      30% { opacity: 1; }
      50% { transform: translate(18px, -12px); opacity: 0.4; }
      70% { opacity: 1; }
    }
    @keyframes hero-birds { from { transform: translateX(0); } to { transform: translateX(130vw); } }
    @keyframes hero-spark {
      0% { transform: rotate(var(--angle)) translateX(0); opacity: 0; }
      8% { opacity: 1; }
      70% { opacity: 0.9; }
      100% { transform: rotate(var(--angle)) translateX(46px) translateY(14px); opacity: 0; }
    }
    @keyframes hero-warning { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes hero-star-glow { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes hero-smoke { 0% { transform: translate(0, 0) scale(0.6); opacity: 0.8; } 100% { transform: translate(-14px, -40px) scale(2.2); opacity: 0; } }
    @keyframes hero-sleigh { 0% { transform: translate(0, 0); } 50% { transform: translate(85vw, -10px); } 100% { transform: translate(170vw, 6px); } }
    @keyframes hero-sint { from { transform: translateX(0); } to { transform: translateX(-140vw); } }
    @keyframes hero-sway { 0%, 100% { transform: rotate(calc(var(--swing) * -0.5)); } 50% { transform: rotate(var(--swing)); } }
    @keyframes hero-drip { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
    @keyframes hero-cat-tail { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    @keyframes hero-cat-frame { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes hero-cat-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8px); } }
    @keyframes hero-chimney-smoke { 0% { transform: translate(0, 0) scale(0.6); opacity: 0.85; } 100% { transform: translate(-3px, -11px) scale(2.6); opacity: 0; } }
    @keyframes hero-cat-hide { 0%, 100% { opacity: 0; } }
    @keyframes hero-cat-show { 0%, 100% { opacity: 1; } }
    @keyframes hero-cat-wag { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }
    @keyframes hero-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes hero-leg { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    @keyframes hero-wave { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(25deg); } }
    @keyframes hero-boat { from { transform: translateX(0); } to { transform: translateX(-150vw); } }
    @keyframes hero-chimney { 0%, 15%, 85%, 100% { transform: translateY(26px); } 35%, 65% { transform: translateY(0); } }
    @keyframes hero-present { 0% { transform: translateY(-30px); opacity: 0; } 15% { opacity: 1; } 80% { transform: translateY(26px); opacity: 1; } 100% { transform: translateY(32px); opacity: 0; } }
    @keyframes hero-hop-x { from { transform: translateX(0); } to { transform: translateX(130vw); } }
    @keyframes hero-hop-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes hero-fog { from { transform: translateX(-10%); } to { transform: translateX(10%); } }
  custom_fields:
    sky: |
      [[[
        // De kaart tekent opnieuw bij elke update van zijn bronnen (zon, weer, timers). Zolang wat je ziet niet verandert,
        // geven we dezelfde tekening terug: dan laat de browser alles staan en lopen de animaties (wolken, de kat) door.
        // De zon telt afgerond mee, anders zou elke kleine stap van de zon alles opnieuw laten beginnen.
        const sunNow = states['sun.sun'];
        const skySignature = JSON.stringify([
          new Date().toDateString(),
          sunNow?.state, Math.round((sunNow?.attributes?.elevation ?? 0) / 2), Math.round((sunNow?.attributes?.azimuth ?? 0) / 10),
          ...['weather.weer_thuis', 'weather.weer_thuis_waarnemingen', 'input_select.weerkaart_thema', 'input_select.tijd_van_de_dag',
            'sensor.season', 'sensor.moon_phase', 'sensor.weer_thuis_bewolking', 'sensor.weer_thuis_windsnelheid',
            'binary_sensor.weer_thuis_waarschuwing_actief', 'sensor.weer_thuis_waarschuwingscode', 'sensor.weer_thuis_waarschuwingen',
            'input_boolean.away', 'input_boolean.laundryhangingoutside', 'input_boolean.pixelskipnextautofeed',
            'sensor.afval_vandaag', 'sensor.afval_morgen', 'input_datetime.pixelfeedfirsttime', 'input_datetime.pixelfeedsecondtime',
            'input_datetime.pixelfeedthirdtime', 'input_datetime.pixelfeedfourthtime'].map(id => states[id]?.state)
        ]);
        if (this._heroSky?.signature === skySignature) return this._heroSky.html;

        // Weer van nu: de waarnemingen zijn actueler dan de verwachting
        const observed = states['weather.weer_thuis_waarnemingen']?.state;
        const w = observed && !['unknown', 'unavailable'].includes(observed) ? observed : states['weather.weer_thuis']?.state ?? 'cloudy';
        const sun = states['sun.sun'];
        // Testen: input_select.tijd_van_de_dag (Ochtend, Middag, Avond, Nacht) overschrijft de echte stand van de zon
        const fakeSun = { ochtend: ['above_horizon', 7, 110], middag: ['above_horizon', 38, 185],
                          avond: ['above_horizon', 3, 255], nacht: ['below_horizon', -30, 0] }[String(states['input_select.tijd_van_de_dag']?.state ?? '').toLowerCase()];
        const day = fakeSun ? fakeSun[0] === 'above_horizon' : sun?.state === 'above_horizon';
        const elevation = fakeSun ? fakeSun[1] : parseFloat(sun?.attributes.elevation ?? 30);
        const azimuth = fakeSun ? fakeSun[2] : parseFloat(sun?.attributes.azimuth ?? 180);
        const rain = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'].includes(w);
        const snow = ['snowy', 'snowy-rainy'].includes(w);
        const storm = ['lightning', 'lightning-rainy'].includes(w);
        const fog = w === 'fog';
        const windSpeed = parseFloat(states['sensor.weer_thuis_windsnelheid']?.state) || 3;

        // Bewolking in % (oktas 0-8 worden omgerekend); zonder sensor een schatting uit het weertype
        let cover = parseFloat(states['sensor.weer_thuis_bewolking']?.state);
        if (!isNaN(cover) && cover <= 8 && ['cloudy', 'rainy', 'pouring', 'fog'].includes(w)) cover *= 12.5;
        if (isNaN(cover)) cover = { sunny: 5, 'clear-night': 5, partlycloudy: 45, windy: 40, cloudy: 90, fog: 95 }[w] ?? 95;
        const t = Math.min(1, cover / 100);

        const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
        const rgb = c => `rgb(${c.join(',')})`;
        const rgba = (c, a) => `rgba(${c.join(',')},${a})`;
        let seed = 31;
        const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

        // Lucht: helder blauw → licht grijsblauw bij bewolking (overdag nooit donker), regen iets donkerder
        const golden = day ? Math.max(0, Math.min(1, (12 - elevation) / 12)) : 0;
        const twilight = !day && elevation > -8 ? (elevation + 8) / 8 : 0;
        let top, bottom;
        if (day) {
          top = rain || storm ? [88, 102, 120] : mix([30, 104, 204], [128, 148, 170], t);
          bottom = rain || storm ? [140, 152, 168] : mix([150, 206, 246], [200, 210, 222], t);
        } else {
          const night = cover > 70 ? [[12, 16, 26], [30, 36, 50]] : [[4, 7, 22], [20, 30, 64]];
          top = mix(night[0], [36, 42, 92], twilight);
          bottom = mix(night[1], [214, 120, 112], twilight * (1 - t * 0.6));
        }
        let out = `<div style="position:absolute;inset:0;background:linear-gradient(180deg, ${rgb(top)} 0%, ${rgb(mix(top, bottom, 0.55))} 55%, ${rgb(bottom)} 100%)"></div>`;
        if (golden > 0) {
          const g = golden * (1 - t * 0.5);
          out += `<div style="position:absolute;inset:0;background:linear-gradient(0deg, rgba(255,150,90,${0.55 * g}) 0%, rgba(255,120,150,${0.25 * g}) 35%, transparent 70%)"></div>`;
        }

        // Nacht: sterren en de maan in de juiste fase (alleen bij weinig bewolking)
        if (!day && cover < 75 && !rain && !storm) {
          for (let i = 0; i < 80; i++) {
            const size = 0.6 + rnd() * rnd() * 2.4;
            out += `<div style="position:absolute;left:${rnd() * 100}%;top:${rnd() * 70}%;width:${size}px;height:${size}px;border-radius:50%;
              background:#fff;opacity:${(1 - t) * (0.4 + rnd() * 0.6)};box-shadow:0 0 ${size * 2}px rgba(255,255,255,0.8);
              animation:hero-twinkle ${2 + rnd() * 5}s ease-in-out ${-rnd() * 6}s infinite"></div>`;
          }
          const phase = states['sensor.moon_phase']?.state ?? 'full_moon';
          const lit = { new_moon: 0, waxing_crescent: 0.25, first_quarter: 0.5, waxing_gibbous: 0.75, full_moon: 1,
                        waning_gibbous: 0.75, last_quarter: 0.5, waning_crescent: 0.25 }[phase] ?? 1;
          const waxing = phase.startsWith('waxing') || phase === 'first_quarter';
          out += `<div style="position:absolute;right:14%;top:13%;width:54px;height:54px;border-radius:50%;overflow:hidden;
              background:radial-gradient(circle at 38% 35%, #fbf8ee 0%, #e9e3d0 55%, #cdc5ae 100%);
              box-shadow:0 0 70px 18px rgba(240,236,220,${0.1 + lit * 0.18})">
              <div style="position:absolute;inset:0;border-radius:50%;transform:translateX(${lit * 56 * (waxing ? -1 : 1)}px);
                background:${rgb(top)};opacity:${lit === 1 ? 0 : 0.95};filter:blur(2px)"></div>
            </div>`;
        }

        // Zon op de echte plek (oost links, west rechts, hoogte = elevatie); gloed zwakker naarmate het bewolkter is
        if (day && cover < 85 && !rain && !storm) {
          const x = Math.max(8, Math.min(92, (azimuth - 90) / 180 * 100));
          const y = Math.max(12, Math.min(80, 82 - elevation * 1.3));
          const warm = golden > 0.4;
          const strength = 1 - t * 0.8;
          out += `<div style="position:absolute;left:${x}%;top:${y}%;width:600px;height:600px;transform:translate(-50%,-50%);
              background:radial-gradient(circle, ${warm ? `rgba(255,180,110,${0.6 * strength})` : `rgba(255,248,220,${0.6 * strength})`} 0%, transparent 55%)"></div>
            <div style="position:absolute;left:${x}%;top:${y}%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);
              opacity:${0.4 + strength * 0.6};
              background:radial-gradient(circle, #ffffff 0%, ${warm ? '#ffd6a0' : '#fff7dc'} 60%, ${warm ? '#ffab66' : '#ffeeb8'} 100%);
              box-shadow:0 0 36px 16px ${warm ? 'rgba(255,170,90,0.65)' : 'rgba(255,248,215,0.75)'}"></div>`;
        }

        // Wolken: echte wolkenafbeeldingen (www/clouds, gemaakt met tools/generate_clouds.py), getint per weer.
        // Wolkendek bij veel bewolking, daarvoor losse stapelwolken in drie diepte-lagen; snelheid volgt de wind.
        const dark = rain || storm;
        let tint = day
          ? (dark ? 'brightness(0.6) saturate(0.7)' : t > 0.7 ? 'brightness(0.92) saturate(0.85)' : '')
          : 'brightness(0.3) saturate(0.6)';
        if (golden > 0) tint += ` sepia(${(0.18 * golden).toFixed(2)}) saturate(${(1 + 0.25 * golden).toFixed(2)})`;
        const speed = Math.max(20, 70 - windSpeed * 3);
        const sprite = (file, x, y, width, opacity, blur, duration) =>
          `<img src="/local/huis/clouds/${file}.webp" onerror="this.remove()" style="position:absolute;left:${x}%;top:${y}%;width:${width}px;
            opacity:${opacity};filter:${tint || 'none'}${blur ? ` blur(${blur}px)` : ''};pointer-events:none;
            animation:hero-drift ${duration}s ease-in-out ${-rnd() * duration}s infinite alternate">`;
        if (t > 0.55) {
          const deck = Math.min(1, (t - 0.45) * 1.8);
          for (let i = 0; i < 3; i++) {
            out += sprite(`stratus_${(i % 2) + 1}`, -35 + i * 42, -28 + rnd() * 22, 1200, (deck * 0.95).toFixed(2), 0, speed * 2.5);
          }
        }
        const count = Math.min(9, Math.round(cover / 11));
        const layers = [
          { share: 0.4, width: 300, opacity: day ? 0.8 : 0.7, blur: 1.2, top: [-2, 28], speed: speed * 1.6 },
          { share: 0.35, width: 470, opacity: 0.92, blur: 0.4, top: [-12, 30], speed: speed * 1.25 },
          { share: 0.25, width: 680, opacity: 1, blur: 0, top: [-22, 22], speed }
        ];
        for (const layer of layers) {
          const n = Math.round(count * layer.share);
          for (let i = 0; i < n; i++) {
            const x = -20 + (i + rnd() * 0.8) / Math.max(1, n) * 100;
            const y = layer.top[0] + rnd() * (layer.top[1] - layer.top[0]);
            out += sprite(`cumulus_${1 + Math.floor(rnd() * 5)}`, x, y, layer.width * (0.85 + rnd() * 0.3), layer.opacity, layer.blur, layer.speed + rnd() * 20);
          }
        }

        // Gouden uur: warm licht van de kant waar de zon staat valt over de wolken
        if (golden > 0 && day) {
          const sx = Math.max(5, Math.min(95, (azimuth - 90) / 180 * 100));
          out += `<div style="position:absolute;inset:0;mix-blend-mode:soft-light;
            background:radial-gradient(ellipse 70% 90% at ${sx}% 100%, rgba(255,150,80,${(0.75 * golden).toFixed(2)}) 0%, rgba(255,120,150,${(0.35 * golden).toFixed(2)}) 45%, transparent 75%)"></div>`;
        }

        // Regen: twee lagen, schuin met de wind
        if (rain) {
          const tilt = Math.min(25, windSpeed * 2);
          const drops = w === 'pouring' ? 160 : 90;
          out += `<div style="position:absolute;inset:-20%;transform:rotate(${tilt}deg)">`;
          for (let i = 0; i < drops; i++) {
            const front = rnd() > 0.6;
            out += `<div style="position:absolute;left:${rnd() * 100}%;top:-40px;width:${front ? 1.6 : 1}px;height:${front ? 22 + rnd() * 10 : 12 + rnd() * 8}px;
              background:linear-gradient(transparent, rgba(210,225,255,${front ? 0.7 : 0.35}));
              animation:hero-rain ${(front ? 0.45 : 0.75) + rnd() * 0.3}s linear ${-rnd() * 2}s infinite"></div>`;
          }
          out += `</div>`;
        }
        if (snow) {
          for (let i = 0; i < 70; i++) {
            const size = 2 + rnd() * 5;
            out += `<div style="position:absolute;left:${rnd() * 100}%;top:-20px;width:${size}px;height:${size}px;border-radius:50%;
              background:rgba(255,255,255,0.9);filter:blur(${size > 5 ? 1.5 : 0}px);
              animation:hero-snow ${5 + rnd() * 6}s linear ${-rnd() * 10}s infinite"></div>`;
          }
        }
        if (fog) {
          for (let i = 0; i < 4; i++) {
            out += `<div style="position:absolute;left:-20%;width:140%;top:${25 + i * 16}%;height:80px;border-radius:40px;
              background:rgba(230,234,240,0.25);filter:blur(20px);animation:hero-fog ${16 + i * 6}s ease-in-out infinite alternate"></div>`;
          }
        }
        if (storm) {
          out += `<div style="position:absolute;inset:0;background:#e8eeff;animation:hero-flash 8s linear infinite"></div>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:58%;top:10%;width:56px;height:62%;
              animation:hero-flash 8s linear infinite;filter:drop-shadow(0 0 8px #cfe0ff)">
              <polyline points="50,0 38,38 55,40 35,100" fill="none" stroke="#f4f8ff" stroke-width="3"/>
            </svg>`;
        }

        // ---------- Thema: seizoen of feestdag ----------
        // Keuze uit input_select.weerkaart_thema; "Automatisch" volgt de datum (feestdagen) en anders sensor.season.
        // Sinterklaas: 1 nov t/m 5 dec · Kerst: 6 dec t/m 6 jan · Nieuwjaar: 31 dec en 1 jan · Pasen: Goede Vrijdag t/m Tweede Paasdag.
        const today = new Date();
        const easterSunday = y => {
          const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
          const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
          const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
          const month = Math.floor((h + l - 7 * m + 114) / 31), dayOfMonth = ((h + l - 7 * m + 114) % 31) + 1;
          return new Date(y, month - 1, dayOfMonth);
        };
        const dayOnly = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
        const easter = easterSunday(today.getFullYear());
        const daysFromEaster = Math.round((dayOnly(today) - easter) / 86400000);
        const month = today.getMonth() + 1, date = today.getDate();
        const autoTheme = () => {
          if ((month === 12 && date === 31) || (month === 1 && date === 1)) return 'nieuwjaar';
          if (month === 11 || (month === 12 && date <= 5)) return 'sinterklaas';
          if ((month === 12 && date >= 6) || (month === 1 && date <= 6)) return 'kerst';
          if (daysFromEaster >= -2 && daysFromEaster <= 1) return 'pasen';
          const season = { spring: 'lente', summer: 'zomer', autumn: 'herfst', winter: 'winter' }[states['sensor.season']?.state];
          return season ?? (month <= 2 || month === 12 ? 'winter' : month <= 5 ? 'lente' : month <= 8 ? 'zomer' : 'herfst');
        };
        const choice = String(states['input_select.weerkaart_thema']?.state ?? '').toLowerCase();
        const theme = ['lente', 'zomer', 'herfst', 'winter', 'sinterklaas', 'pasen', 'kerst', 'nieuwjaar'].includes(choice) ? choice : autoTheme();
        const wintry = ['winter', 'kerst', 'sinterklaas', 'nieuwjaar'].includes(theme);
        const springy = ['lente', 'pasen'].includes(theme);

        // Horizon: zachte heuvels in lagen in de kleur van het seizoen; verder weg lichter (luchtperspectief)
        const hillY = (x, base, amp, freq, phase) => base + Math.sin(x / freq + phase) * amp + Math.sin(x / (freq * 0.4) + phase * 2) * amp * 0.35;
        const hill = (base, amp, freq, phase, color) => {
          let d = `M0,100 L0,${base}`;
          for (let x = 0; x <= 100; x += 2) d += ` L${x},${hillY(x, base, amp, freq, phase).toFixed(2)}`;
          return `<path d="${d} L100,100 Z" fill="${color}"/>`;
        };
        const seasonGround = { lente: [40, 92, 52], pasen: [44, 98, 56], zomer: [74, 92, 38], herfst: [96, 56, 28],
                               winter: [58, 68, 86], kerst: [58, 68, 86], nieuwjaar: [52, 58, 80], sinterklaas: [52, 46, 62] }[theme];
        // Winterse thema's: een besneeuwd landschap (licht blauwwit, 's nachts blauwgrijs) in plaats van groen of bruin
        const ground = wintry ? (day ? [206, 216, 232] : [40, 48, 70])
          : day ? mix([22, 30, 38], seasonGround, 0.55) : mix([4, 6, 12], seasonGround, 0.18);
        const snowCap = day ? 'rgba(240,246,255,0.92)' : 'rgba(170,185,215,0.55)';
        const layers3 = [[62, 6, 11, 1.3, 0.35], [74, 5, 8, 4.1, 0.65], [86, 4, 6, 2.2, 0.9]];
        out += `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:38%">
            ${layers3.map(([b, a, f, p, m]) => hill(b, a, f, p, rgb(mix(bottom, ground, m)))).join('')}
          </svg>`;

        // Bomen en huizen op de voorste heuvel (HTML, zodat ze niet mee uitrekken met de heuvel)
        const groundTop = x => 62 + hillY(x, 86, 4, 6, 2.2) * 0.38;  // in % van de kaarthoogte
        const night = c => day ? c : rgb(mix(c.match(/\d+/g).map(Number), [5, 8, 18], 0.65));
        const crowns = { lente: ['rgb(249,197,213)', 'rgb(253,226,234)', 'rgb(240,170,195)'], pasen: ['rgb(249,197,213)', 'rgb(253,236,200)', 'rgb(214,236,190)'],
                         zomer: ['rgb(47,107,58)', 'rgb(62,128,66)', 'rgb(38,92,50)'], herfst: ['rgb(217,105,43)', 'rgb(184,68,42)', 'rgb(224,160,48)'] }[theme];
        const tree = (x, size) => {
          const top = groundTop(x);
          if (crowns) {
            const crown = night(crowns[Math.floor(rnd() * crowns.length)]);
            return `<div style="position:absolute;left:${x}%;top:${top}%;transform:translate(-50%,-100%);width:${size}px;height:${size * 1.25}px">
                      <div style="position:absolute;left:46%;bottom:0;width:8%;height:40%;background:${night('rgb(70,50,40)')}"></div>
                      <div style="position:absolute;left:0;top:0;width:100%;height:80%;border-radius:50%;background:${crown};
                        box-shadow:inset -${size / 6}px -${size / 8}px 0 rgba(0,0,0,0.18)"></div>
                    </div>`;
          }
          if (theme === 'winter') {
            return `<svg viewBox="0 0 20 24" style="position:absolute;left:${x}%;top:${top}%;transform:translate(-50%,-100%);width:${size}px;height:${size * 1.2}px">
                      <path d="M10 24 V9 M10 14 L4 8 M10 12 L16 6 M10 17 L15 13 M6 10 L5 6 M14 8 L15 4" stroke="${night('rgb(72,62,58)')}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
                    </svg>`;
          }
          // Kerst en Sinterklaas: dennen met sneeuw (met kerst ook lichtjes)
          const lights = theme === 'kerst' ? [[7, 15], [13, 13], [10, 9], [6, 19], [14, 19], [10, 17]].map(([cx, cy], i) =>
            `<circle cx="${cx}" cy="${cy}" r="0.9" fill="${['#ff5a5a', '#ffd166', '#7ee787', '#7aa2ff'][i % 4]}" style="animation:hero-twinkle ${1 + rnd() * 1.5}s ease-in-out ${-rnd() * 2}s infinite"/>`).join('') : '';
          return `<svg viewBox="0 0 20 24" style="position:absolute;left:${x}%;top:${top}%;transform:translate(-50%,-100%);width:${size}px;height:${size * 1.2}px;overflow:visible">
                    <path d="M10 1 L16 10 H13 L18 17 H14 L19 22 H1 L6 17 H2 L7 10 H4 Z" fill="${night('rgb(30,82,58)')}"/>
                    <path d="M10 1 L13 5.5 H7 Z M6 10 H14 L13.2 11 H6.8 Z" fill="${snowCap}"/>
                    <rect x="9" y="22" width="2" height="2" fill="${night('rgb(70,50,40)')}"/>${lights}
                  </svg>`;
        };
        // lit: licht achter het raam (anders donker glas), smoke: rook uit de schoorsteen
        const house = (x, size, chimney, { lit = true, smoke = false } = {}) => {
          const top = groundTop(x);
          const glow = !lit ? (day ? 'rgba(70,82,104,0.75)' : 'rgb(18,22,34)') : day ? 'rgba(255,214,140,0.55)' : '#ffcf73';
          let puffs = '';
          if (chimney && smoke) for (let i = 0; i < 4; i++) puffs += `<circle cx="17.5" cy="1.5" r="${1.3 + i * 0.3}" fill="rgba(236,240,247,${day ? 0.8 : 0.45})"
              style="transform-box:fill-box;transform-origin:center;animation:hero-chimney-smoke 5s ease-out ${-i * 1.25}s infinite"/>`;
          return `<svg viewBox="0 0 24 22" style="position:absolute;left:${x}%;top:${top}%;transform:translate(-50%,-96%);width:${size}px;height:${size * 0.92}px;overflow:visible">
                    ${puffs}${chimney ? `<rect x="16" y="2" width="3" height="7" fill="${night('rgb(90,52,44)')}"/>` : ''}
                    <path d="M2 11 L12 3 L22 11 Z" fill="${night('rgb(120,48,40)')}"/>
                    ${wintry ? `<path d="M2 11 L12 3 L22 11 L20.5 11 L12 4.6 L3.5 11 Z" fill="${snowCap}"/>` : ''}
                    <rect x="4" y="11" width="16" height="11" fill="${night('rgb(168,140,112)')}"/>
                    <rect x="7" y="14" width="4" height="4" fill="${glow}" style="${day || !lit ? '' : 'filter:drop-shadow(0 0 3px #ffcf73)'}"/>
                    <rect x="14" y="15" width="3" height="7" fill="${night('rgb(96,64,46)')}"/>
                  </svg>`;
        };
        // Iemand thuis: rook uit de schoorsteen, en 's avonds en 's nachts licht achter het raam
        const someoneHome = states['input_boolean.away']?.state !== 'on';
        let scene = '';
        if (theme === 'kerst') {
          [[8, 30], [16, 22], [92, 26]].forEach(([x, s]) => { scene += tree(x, s); });
        } else if (theme === 'nieuwjaar') {
          scene += house(76, 36, true);
          [[12, 30], [20, 22], [62, 26], [88, 32], [94, 22]].forEach(([x, s]) => { scene += tree(x, s); });
        } else if (theme === 'pasen') {
          [[8, 26], [66, 24], [86, 22]].forEach(([x, s]) => { scene += tree(x, s); });
        } else if (theme !== 'sinterklaas') {
          [[8, 26], [15, 20], [66, 24], [74, 30], [86, 22], [93, 28]].forEach(([x, s]) => { scene += tree(x, s * (0.9 + rnd() * 0.3)); });
        }
        // Ons huisje op de heuvel met een tuinpad naar de stoep (niet bij Kerst, Sinterklaas en Nieuwjaar: daar staan al huizen)
        const homeX = ['kerst', 'sinterklaas', 'nieuwjaar'].includes(theme) ? null : 54;
        if (homeX !== null) {
          const pathTop = 100 - groundTop(homeX + 0.6) - 0.5;  // % boven de onderrand, bij de voordeur
          scene += `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:${pathTop}%;pointer-events:none">
              <path d="M${homeX + 0.1} 0 L${homeX + 1.6} 0 C${homeX + 2.6} 30 ${homeX + 9} 55 ${homeX + 12} 100 L${homeX + 2.4} 100 C${homeX + 2.2} 60 ${homeX - 0.6} 34 ${homeX + 0.1} 0 Z"
                fill="${night(wintry ? 'rgb(222,228,236)' : 'rgb(206,186,152)')}"/>
              <path d="M${homeX + 0.8} 4 C${homeX + 1.8} 38 ${homeX + 5} 60 ${homeX + 6.2} 96" stroke="${night('rgb(160,140,112)')}" stroke-width="0.25"
                stroke-dasharray="1.2 2.4" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
          scene += house(homeX, 78, true, { lit: someoneHome, smoke: someoneHome });
        }
        out += scene;

        // ---------- Feestdagen: rijke taferelen voor Kerst, Sinterklaas en Pasen ----------
        const svgAt = (x, bottom, width, height, viewBox, body, extra = '') =>
          `<svg viewBox="${viewBox}" style="position:absolute;left:${x}%;bottom:${bottom}%;width:${width}px;height:${height}px;transform:translateX(-50%);overflow:visible;${extra}">${body}</svg>`;
        const groundBottom = x => 100 - groundTop(x);  // hoogte van de voorste heuvel boven de onderrand, in %
        const dim = c => night(c);
        // Slinger langs de bovenrand: y-waarde van de bocht op positie x (0-100)
        const swag = x => 4 + Math.abs(Math.sin(x / 100 * Math.PI * 5)) * 7;
        const swagPath = () => { let d = 'M0,4'; for (let x = 0; x <= 100; x += 1) d += ` L${x},${swag(x).toFixed(2)}`; return d; };
        const bunting = colors => {
