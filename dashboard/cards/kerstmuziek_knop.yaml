# Knop op Home: Kerst (de woonkamerscene Kerst en de kerstplaylist op de keuken-speaker, NetDaemon ChristmasTree). Alleen zichtbaar zolang de kerstlampjes
# er zijn (light.festavia_string_lights_1 bestaat en is aan of uit); na het weghalen van de lampjes (na 6 januari) verdwijnt hij vanzelf.
type: conditional
conditions:
  - condition: state
    entity: light.festavia_string_lights_1
    state:
      - "on"
      - "off"
card:
  type: custom:button-card
  template: action
  name: Kerst
  icon: mdi:pine-tree
  tap_action:
    action: perform-action
    perform_action: input_button.press
    target:
      entity_id: input_button.start_kerstmuziek
  grid_options:
    columns: 6
grid_options:
  columns: 6
