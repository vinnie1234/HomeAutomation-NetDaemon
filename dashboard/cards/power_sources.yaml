# Apparaten voor 'Grootste verbruikers nu' (Energie en Verbruik) en het totaal waarmee power_row het
# percentage berekent als de P1-meter teruglevert. Alleen echte apparaten: geen fases (_l1), kopieën (_2)
# of totalen (all_standby_power, P1), anders telt het dubbel.
- entity_id: sensor.koelkast_power
  state: "> 0.5"
  options:
    type: custom:button-card
    template: power_row
- entity_id: sensor.tv_kast_power
  state: "> 0.5"
  options:
    type: custom:button-card
    template: power_row
    variables:
      name: TV-kast
