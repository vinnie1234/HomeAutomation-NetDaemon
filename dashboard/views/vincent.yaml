# Eigen pagina van Vincent: alleen zichtbaar voor Vincent (visible en de route in de navbar).
# Peuken bijhouden, werk en thuiswerken.
title: Vincent
path: vincent
icon: mdi:account
theme: Glass Home
type: sections
max_columns: 3
dense_section_placement: true
visible:
  - user: 0d3e17e157c247858fd93001d40168c6
sections:
  # Samenvatting
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - type: custom:button-card
        template: summary
        icon: mdi:account
        variables:
          level: |
            [[[
              const packs = parseFloat(states['input_number.peuken_pakjes']?.state);
              return packs < 5 ? 'bad' : packs < 10 ? 'warn' : 'ok';
            ]]]
        name: |
          [[[
            const packs = parseFloat(states['input_number.peuken_pakjes']?.state);
            return packs < 10 ? `Nog maar ${Math.round(packs)} ${packs === 1 ? 'pakje' : 'pakjes'} peuken` : 'Hoi Vincent';
          ]]]
        label: |
          [[[
            const parts = [];
            const packs = parseFloat(states['input_number.peuken_pakjes']?.state);
            if (!isNaN(packs)) parts.push(`${Math.round(packs)} ${packs === 1 ? 'pakje' : 'pakjes'} peuken`);
            parts.push(states['input_boolean.workingvincent']?.state === 'on' ? 'aan het werk' : 'niet aan het werk');
            const cost = parseFloat(states['sensor.thuiswerken_energie']?.state);
            if (states['sensor.thuiswerken_energie']?.attributes?.actief) parts.push(`thuiswerken vandaag € ${cost.toFixed(2).replace('.', ',')}`);
            return parts.join(' · ');
          ]]]

  # Zoeken: de portemonnee (Google Find Hub) en de telefoon, met piepen en lokaliseren
  - type: grid
    cards:
      - type: heading
        heading: Waar is...
        heading_style: title
        icon: mdi:map-search-outline
      - type: custom:button-card
        template: wallet_status
      - type: custom:button-card
        template: phone_status

  # Agenda en taken, en een taak met een plek toevoegen
  - type: grid
    cards:
      - type: heading
        heading: Agenda en taken
        heading_style: title
        icon: mdi:calendar-check
      - !include ../cards/taak_knop.yaml
      - !include ../cards/agenda.yaml

  # Peuken: hoeveel pakjes er nog zijn, -1 met één tik
  - type: grid
    cards:
      - type: heading
        heading: Peuken
        heading_style: title
        icon: mdi:smoking
      - type: custom:button-card
        template: peuken
      - type: custom:button-card
        template: action
        name: "+1 pakje"
        icon: mdi:plus
        tap_action:
          action: perform-action
          perform_action: input_number.increment
          target:
            entity_id: input_number.peuken_pakjes
        grid_options:
          columns: 6
      - type: custom:button-card
        template: action
        name: "+1 slof (8)"
        icon: mdi:package-variant-plus
        tap_action:
          action: javascript
          javascript: |
            [[[
              const packs = parseFloat(states['input_number.peuken_pakjes']?.state) || 0;
              hass.callService('input_number', 'set_value', { entity_id: 'input_number.peuken_pakjes', value: packs + 8 });
            ]]]
          confirmation:
            text: Een slof van 8 pakjes erbij?
        grid_options:
          columns: 6
      # Precies invoeren: het getal intikken
      - type: tile
        entity: input_number.peuken_pakjes
        name: Aantal invoeren
        icon: mdi:pencil-outline
        features_position: inline
        features:
          - type: numeric-input
            style: buttons

  # Werk en thuiswerken
  - type: grid
    cards:
      - type: heading
        heading: Werk
        heading_style: title
        icon: mdi:briefcase-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.workingvincent
        name: Aan het werk
        icon: mdi:briefcase-outline
        show_state: true
      - type: custom:button-card
        template: homework_tile

  # Werkrooster: een tegel die het werkrooster in een pop-up opent (dagen, vervoer, tijden, agenda en het verkeersbericht)
  - type: grid
    cards:
      - type: heading
        heading: Werkrooster
        heading_style: title
        icon: mdi:calendar-week-outline
      - type: custom:button-card
        template: schedule_tile
        variables:
          person: vincent

  # Pop-up: het werkrooster van Vincent
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#werkrooster"
        name: Werkrooster
        icon: mdi:calendar-week-outline
        cards:
          # Per dag (ook het weekend) Vrij, Thuis of Kantoor: tik wisselt. Op een kantoordag staat in de hoek een auto of trein: tik daarop wisselt het vervoer.
          - type: grid
            columns: 7
            square: false
            cards:
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_maandag
                variables:
                  day: ma
                  weekday: 1
                  transport: input_select.vervoer_vincent_maandag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_dinsdag
                variables:
                  day: di
                  weekday: 2
                  transport: input_select.vervoer_vincent_dinsdag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_woensdag
                variables:
                  day: wo
                  weekday: 3
                  transport: input_select.vervoer_vincent_woensdag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_donderdag
                variables:
                  day: do
                  weekday: 4
                  transport: input_select.vervoer_vincent_donderdag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_vrijdag
                variables:
                  day: vr
                  weekday: 5
                  transport: input_select.vervoer_vincent_vrijdag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_zaterdag
                variables:
                  day: za
                  weekday: 6
                  transport: input_select.vervoer_vincent_zaterdag
              - type: custom:button-card
                template: workday_button
                entity: input_select.werkdag_vincent_zondag
                variables:
                  day: zo
                  weekday: 0
                  transport: input_select.vervoer_vincent_zondag
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.vrij_vincent
            name: Vrij (vandaag of tot ik hem uitzet)
            icon: mdi:beach
            show_state: true
          - type: entities
            state_color: true
            entities:
              - type: section
                label: Opstaan (het huis wordt wakker)
              - entity: input_datetime.opstaan_kantoor_vincent
                name: Op een kantoordag
                icon: mdi:office-building-outline
              - entity: input_datetime.opstaan_thuiswerk_vincent
                name: Op een thuiswerkdag
                icon: mdi:home-account
              - type: section
                label: Werkuren
              - entity: input_datetime.werk_start_vincent
                name: Begin
                icon: mdi:briefcase-clock-outline
              - entity: input_datetime.werk_eind_vincent
                name: Eind
                icon: mdi:briefcase-check-outline
          # Wanneer op kantoor: uit de agenda ("C: werk" of "V: werk"), of zelf ingesteld
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.werk_uit_agenda_vincent
            name: Werk uit de agenda halen
            icon: mdi:calendar-sync
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.werk_uit_agenda_vincent
                state: "on"
            card:
              type: custom:button-card
              template: glass
              entity: input_button.sync_agenda_vincent
              name: Agenda nu synchroniseren
              label: De tijden komen uit de afspraken; vanavond om 23:50 gebeurt dit ook vanzelf
              icon: mdi:calendar-sync
              show_label: true
              tap_action:
                action: call-service
                service: input_button.press
                target:
                  entity_id: input_button.sync_agenda_vincent
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.werk_uit_agenda_vincent
                state: "on"
            card:
              type: entities
              entities:
                - entity: input_number.reis_marge_voor_vincent
                  name: Minuten eerder op kantoor dan de afspraak begint
                  icon: mdi:timer-sand
                - entity: input_number.reis_marge_na_vincent
                  name: Minuten na het einde van de afspraak weg
                  icon: mdi:timer-sand-complete
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.werk_uit_agenda_vincent
                state: "off"
            card:
              type: vertical-stack
              cards:
                - type: heading
                  heading: Hoe laat naar kantoor en weer naar huis
                  heading_style: subtitle
                  icon: mdi:clock-outline
                - type: tile
                  entity: input_select.reis_ochtend_soort_vincent
                  name: "'s Ochtends"
                  features_position: bottom
                  features:
                    - type: select-options
                - type: tile
                  entity: input_datetime.reis_ochtend_tijd_vincent
                  name: Hoe laat
                - type: tile
                  entity: input_select.reis_avond_soort_vincent
                  name: "'s Avonds"
                  features_position: bottom
                  features:
                    - type: select-options
                - type: tile
                  entity: input_datetime.reis_avond_tijd_vincent
                  name: Hoe laat
          - type: entities
            state_color: true
            entities:
              - type: section
                label: Verkeersbericht (WhatsApp, op kantoordagen)
              - entity: input_boolean.verkeer_bericht_vincent
                name: Verkeersbericht sturen
                icon: mdi:car-clock
              - entity: input_datetime.verkeer_heen_vincent
                name: Naar kantoor (zonder vaste tijd)
                icon: mdi:office-building-outline
              - entity: input_datetime.verkeer_terug_vincent
                name: Naar huis (zonder vaste tijd)
                icon: mdi:home-import-outline

  # Pop-up: thuiswerken per dag (opent via de tegel Thuiswerken)
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#thuiswerken"
        name: Thuiswerken
        icon: mdi:laptop-account
        cards:
          - type: custom:button-card
            template: homework_days

  # Bijzondere dagen: dan viert de weerkaart feest (de datums staan alleen in Home Assistant, niet in de code)
  - type: grid
    cards:
      - type: heading
        heading: Bijzondere dagen
        heading_style: title
        icon: mdi:party-popper
      - type: custom:button-card
        template: date_input
        entity: input_datetime.verjaardag_vincent
        name: Mijn verjaardag
        icon: mdi:cake-variant-outline
      - type: custom:button-card
        template: date_input
        entity: input_datetime.jubileum
        name: Ons jubileum
        icon: mdi:heart-outline

  # Muziek: de playlist per ruimte en het Spotify-account
  - type: grid
    cards:
      - type: heading
        heading: Muziek
        heading_style: title
        icon: mdi:music
      - !include ../cards/muziek_knop_vincent.yaml

  # Pop-up: taak met plek toevoegen (opent via de tegel Taak met plek)
  - type: grid
    cards:
      - !include ../popups/taak.yaml
      - !include ../popups/muziek_vincent.yaml
