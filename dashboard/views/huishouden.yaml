# Huishouden: Jaap (stofzuiger), wasmachine, afval, taken, agenda en batterijen.
title: Huishouden
path: huishouden
icon: mdi:broom
theme: Glass Home
type: sections
max_columns: 3
dense_section_placement: true
sections:
  # Samenvatting: aandachtspunten en korte info
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - type: custom:button-card
        template: summary
        icon: mdi:home-heart
        variables:
          level: |
            [[[
              // De luchtontvochtiger: dezelfde redenen als het bolletje bij Huis in de navigatie (navbar.yaml)
              const dh = id => states[`binary_sensor.luchtontvochtiger${id}`]?.state === 'on';
              const dhFault = ['', '_2', '_3', '_4', '_5', '_6', '_7'].some(n => dh(`_probleem${n}`));
              const openWindows = ['woonkamer_tv', 'woonkamer_tafel', 'slaapkamer'].filter(key => states[`input_boolean.raam_${key}`]?.state === 'on');
              if (states['binary_sensor.jaap_bin_full']?.state === 'on' || parseInt(states['sensor.battery_devices_critical']?.state) > 0 || dhFault
                || (openWindows.length && states['sensor.raam_advies']?.attributes.sleutel === 'dicht')) return 'bad';
              const low = ['wasmiddel', 'wasverzachter'].some(k => states[`binary_sensor.badkamer_wasmachine_${k}_bijna_op`]?.state === 'on') || dh('_tank_full') || openWindows.length > 0;
              // Afval vandaag en morgen: dezelfde redenen als het bolletje bij Huis in de navigatie (navbar.yaml)
              const afval = ['sensor.afval_vandaag', 'sensor.afval_morgen'].some(id => !['Geen', 'unknown', 'unavailable', undefined].includes(states[id]?.state));
              return low || afval ? 'warn' : 'ok';
            ]]]
        name: |
          [[[
            const issues = [];
            if (states['binary_sensor.jaap_bin_full']?.state === 'on') issues.push('bak van Jaap legen');
            const crit = parseInt(states['sensor.battery_devices_critical']?.state) || 0;
            if (crit) issues.push(`${crit} ${crit === 1 ? 'batterij' : 'batterijen'} vervangen`);
            // De luchtontvochtiger: de tank of een storing (dezelfde redenen als het bolletje bij Huis in de navigatie)
            const dh = id => states[`binary_sensor.luchtontvochtiger${id}`]?.state === 'on';
            if (dh('_tank_full')) issues.push('tank luchtontvochtiger legen');
            if (['', '_2', '_3', '_4', '_5', '_6', '_7'].some(n => dh(`_probleem${n}`))) issues.push('luchtontvochtiger meldt een storing');
            // Ramen die open staan (dezelfde reden als het bolletje bij Huis in de navigatie)
            const windowNames = { woonkamer_tv: 'woonkamer bij de tv', woonkamer_tafel: 'woonkamer bij de tafel', slaapkamer: 'slaapkamer' };
            const openWindows = Object.keys(windowNames).filter(key => states[`input_boolean.raam_${key}`]?.state === 'on');
            if (openWindows.length) issues.push(`raam ${openWindows.map(key => windowNames[key]).join(' en ')} open`);
            ['wasmiddel', 'wasverzachter'].forEach(k => {
              if (states[`binary_sensor.badkamer_wasmachine_${k}_bijna_op`]?.state === 'on') issues.push(`${k} kopen`);
            });
            const today = states['sensor.afval_vandaag']?.state;
            if (!['Geen', 'unknown', 'unavailable', undefined].includes(today)) issues.push(`${today} buiten zetten`);
            // Het bolletje bij Huis in de navigatie staat ook voor afval dat morgen wordt opgehaald: dat moet hier dus ook staan
            const tomorrow = states['sensor.afval_morgen']?.state;
            if (!['Geen', 'unknown', 'unavailable', undefined].includes(tomorrow)) issues.push(`${tomorrow} vanavond buiten zetten`);
            return issues.length ? `Aandacht nodig: ${issues.join(', ')}` : 'Alles op orde in huis';
          ]]]
        label: |
          [[[
            const jaap = { cleaning: 'aan het zuigen', docked: 'in het dock', idle: 'staat stil', paused: 'gepauzeerd', returning: 'onderweg naar dock', error: 'probleem' };
            const washer = { active: 'bezig', pause: 'gepauzeerd', idle: 'staat klaar' };
            const parts = [];
            const j = states['vacuum.jaap']?.state;
            if (j) parts.push(`Jaap ${jaap[j] ?? j}`);
            const w = states['sensor.badkamer_wasmachine_machinestatus']?.state;
            if (w && !['unknown', 'unavailable'].includes(w)) parts.push(`wasmachine ${washer[w] ?? w}`);
            const parcels = ['postnl', 'dhl', 'dpd', 'gls']
              .reduce((n, c) => n + (parseInt(states[`sensor.buiten_${c}_inkomende_pakketten`]?.state) || 0), 0);
            if (parcels) parts.push(`${parcels} ${parcels === 1 ? 'pakket' : 'pakketten'} onderweg`);
            return parts.join(' · ');
          ]]]

  # Jaap en afval
  - type: grid
    cards:
      - type: heading
        heading: Jaap
        heading_style: title
        icon: mdi:robot-vacuum
      # Jaap: status met batterijring, en de bediening eronder (eigen kaart, onafhankelijk van extra sensoren)
      - type: custom:button-card
        template: glass
        entity: vacuum.jaap
        triggers_update: all
        show_icon: false
        show_label: true
        tap_action:
          action: more-info
        name: |
          [[[
            const map = {
              cleaning: 'Aan het zuigen', docked: 'In het dock', idle: 'Staat stil', paused: 'Gepauzeerd',
              returning: 'Gaat terug naar het dock', error: 'Heeft een probleem', unavailable: 'Niet bereikbaar'
            };
            return map[entity.state] ?? entity.state;
          ]]]
        label: |
          [[[
            const parts = [];
            if (states['binary_sensor.jaap_bin_full']?.state === 'on') parts.push('Bak is vol!');
            if (states['binary_sensor.woonkamer_jaap_opladen']?.state === 'on') parts.push('Laadt op');
            const missions = parseInt(states['sensor.jaap_totaal_aantal_missies']?.state);
            if (!isNaN(missions)) parts.push(`${missions} missies`);
            return parts.join(' · ');
          ]]]
        custom_fields:
          ring: |
            [[[
              const battery = parseFloat(states['sensor.jaap_battery_level']?.state ?? entity.attributes.battery_level);
              const pct = isNaN(battery) ? 0 : battery;
              const color = pct < 20 ? '#ff6b6b' : pct < 50 ? '#ffb060' : '#4ade80';
              const cleaning = entity.state === 'cleaning';
              return `<div style="width:72px;height:72px;border-radius:50%;
                        background:conic-gradient(${color} ${pct * 3.6}deg, rgba(255,255,255,0.08) 0);
                        display:flex;align-items:center;justify-content:center">
                        <div style="width:60px;height:60px;border-radius:50%;background:#121828;display:flex;flex-direction:column;
                          align-items:center;justify-content:center">
                          <ha-icon icon="mdi:robot-vacuum" style="--mdc-icon-size:24px;color:${cleaning ? '#4ade80' : 'rgba(242,244,248,0.7)'}"></ha-icon>
                          <span style="font-size:11px;font-weight:600">${isNaN(battery) ? '–' : Math.round(battery) + '%'}</span>
                        </div>
                      </div>`;
            ]]]
        styles:
          grid:
            - grid-template-areas: '"ring n" "ring l"'
            - grid-template-columns: auto 1fr
            - column-gap: 16px
          card:
            - height: 100px
          name:
            - align-self: end
            - font-size: 17px
          label:
            - align-self: start
            - white-space: normal
            - text-align: left
            - color: '[[[ return states["binary_sensor.jaap_bin_full"]?.state === "on" ? "#ff6b6b" : "var(--secondary-text-color)"; ]]]'
      - type: custom:button-card
        template: action
        name: Start
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.jaap
        grid_options:
          columns: 3
      - type: custom:button-card
        template: action
        name: Pauze
        icon: mdi:pause
        tap_action:
          action: perform-action
          perform_action: vacuum.pause
          target:
            entity_id: vacuum.jaap
        grid_options:
          columns: 3
      - type: custom:button-card
        template: action
        name: Naar dock
        icon: mdi:home-import-outline
        tap_action:
          action: perform-action
          perform_action: vacuum.return_to_base
          target:
            entity_id: vacuum.jaap
        grid_options:
          columns: 3
      - type: custom:button-card
        template: action
        name: Zoek
        icon: mdi:map-marker-question-outline
        tap_action:
          action: perform-action
          perform_action: vacuum.locate
          target:
            entity_id: vacuum.jaap
        grid_options:
          columns: 3
      - type: heading
        heading: Ruimte zuigen
        heading_style: subtitle
      - type: custom:button-card
        template: action
        name: Woonkamer
        icon: mdi:sofa-outline
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.vacuumcleanwoonkamer
        grid_options:
          columns: 4
      - type: custom:button-card
        template: action
        name: Bank
        icon: mdi:sofa
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.vacuumcleanbank
        grid_options:
          columns: 4
      - type: custom:button-card
        template: action
        name: Gang
        icon: mdi:door-open
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.vacuumcleangang
        grid_options:
          columns: 4
      - type: custom:button-card
        template: action
        name: Slaapkamer
        icon: mdi:bed-outline
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.vacuumcleanslaapkamer
        grid_options:
          columns: 6
      - type: custom:button-card
        template: action
        name: Kattenbak
        icon: mdi:cat
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.vacuumcleankattenbak
        grid_options:
          columns: 6

      - type: heading
        heading: Afval
        heading_style: title
        icon: mdi:trash-can-outline
      - type: custom:button-card
        template: stat
        entity: sensor.afval_pmd
        name: PMD
        show_label: true
        label: |
          [[[
            const n = parseInt(states['sensor.garbage_placed_pmd']?.state);
            const d = new Date(states['sensor.afval_pmd']?.state);
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const diff = isNaN(d) ? null : Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 86400000);
            const parts = [];
            if (diff !== null && diff > 1) parts.push(`over ${diff} dagen`);
            if (!isNaN(n)) parts.push(`${n}× buiten gezet`);
            return parts.join(' · ');
          ]]]
        icon: mdi:recycle
        state_display: &afval_datum |
          [[[
            const d = new Date(entity.state);
            if (isNaN(d)) return ['unknown', 'unavailable'].includes(entity.state) ? 'Onbekend' : entity.state;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const day = new Date(d); day.setHours(0, 0, 0, 0);
            const diff = Math.round((day - today) / 86400000);
            const date = d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
            return diff === 0 ? 'Vandaag' : diff === 1 ? 'Morgen' : date;
          ]]]
        styles:
          grid:
            - grid-template-areas: '"i n" "s s" "l l"'
            - grid-template-columns: auto 1fr
            - grid-template-rows: auto 1fr auto
          card:
            - height: 120px
          label:
            - justify-self: start
            - white-space: normal
          icon:
            - color: "#ffb060"
          state:
            - font-size: 17px
        grid_options:
          columns: 6
      - type: custom:button-card
        template: stat
        entity: sensor.afval_papier
        name: Papier
        show_label: true
        label: |
          [[[
            const n = parseInt(states['sensor.garbage_placed_papier']?.state);
            const d = new Date(states['sensor.afval_papier']?.state);
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const diff = isNaN(d) ? null : Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 86400000);
            const parts = [];
            if (diff !== null && diff > 1) parts.push(`over ${diff} dagen`);
            if (!isNaN(n)) parts.push(`${n}× buiten gezet`);
            return parts.join(' · ');
          ]]]
        icon: mdi:newspaper-variant-outline
        state_display: *afval_datum
        styles:
          grid:
            - grid-template-areas: '"i n" "s s" "l l"'
            - grid-template-columns: auto 1fr
            - grid-template-rows: auto 1fr auto
          card:
            - height: 120px
          label:
            - justify-self: start
            - white-space: normal
          icon:
            - color: "#7aa2ff"
          state:
            - font-size: 17px
        grid_options:
          columns: 6

  # Wasmachine en batterijen
  - type: grid
    cards:
      - type: heading
        heading: Wasmachine
        heading_style: title
        icon: mdi:washing-machine
      # Compact: status met voortgangsring; tik opent de pop-up #wasmachine met bediening en instellingen
      - type: custom:button-card
        template: glass
        triggers_update: all
        entity: sensor.badkamer_wasmachine_machinestatus
        show_icon: false
        show_label: true
        tap_action:
          action: navigate
          navigation_path: "#wasmachine"
        name: |
          [[[
            if (entity.state === 'active') {
              const phase = states['sensor.badkamer_wasmachine_voortgang'];
              return phase && !['unknown', 'unavailable', 'idle'].includes(phase.state) ? `Bezig: ${hass.formatEntityState(phase)}` : 'Bezig met wassen';
            }
            const map = { pause: 'Gepauzeerd', idle: 'Staat klaar' };
            return map[entity.state] ?? (['off', 'unavailable'].includes(entity.state) ? 'Uit' : hass.formatEntityState(entity));
          ]]]
        label: |
          [[[
            const left = states['sensor.badkamer_wasmachine_resterende_tijd']?.state ?? '';
            const leftMinutes = /^\d+:\d+/.test(left) ? left.split(':').map(Number).reduce((h, m) => h * 60 + m) : parseFloat(left);
            let end = new Date(states['sensor.badkamer_wasmachine_geschatte_eindtijd']?.state);
            if (isNaN(end) && !isNaN(leftMinutes)) end = new Date(Date.now() + leftMinutes * 60000);
            const low = ['wasmiddel', 'wasverzachter']
              .filter(k => states[`binary_sensor.badkamer_wasmachine_${k}_bijna_op`]?.state === 'on')
              .map(k => `${k[0].toUpperCase()}${k.slice(1)} bijna op`);
            const parts = [];
            if (entity.state === 'active' && !isNaN(end)) {
              const min = Math.max(0, Math.round((end - new Date()) / 60000));
              parts.push(`Klaar om ${end.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })} · nog ${min} min`);
            } else {
              parts.push('Tik om te starten of in te stellen');
            }
            return [...parts, ...low].join(' · ');
          ]]]
        custom_fields:
          ring: |
            [[[
              const running = ['active', 'pause'].includes(entity.state);
              const pct = running ? Math.min(100, parseFloat(states['sensor.badkamer_wasmachine_voortgangspercentage']?.state) || 0) : 0;
              return `<div style="width:64px;height:64px;border-radius:50%;
                        background:conic-gradient(#38bdf8 ${pct * 3.6}deg, rgba(255,255,255,0.08) 0);
                        display:flex;align-items:center;justify-content:center">
                        <div style="width:52px;height:52px;border-radius:50%;background:#121828;display:flex;
                          align-items:center;justify-content:center">
                          ${running
                            ? `<span style="font-size:15px;font-weight:700">${Math.round(pct)}%</span>`
                            : '<ha-icon icon="mdi:washing-machine" style="--mdc-icon-size:26px;opacity:0.6"></ha-icon>'}
                        </div>
                      </div>`;
            ]]]
          arrow: '<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:22px;opacity:0.5"></ha-icon>'
        styles:
          grid:
            - grid-template-areas: '"ring n arrow" "ring l arrow"'
            - grid-template-columns: auto 1fr auto
            - column-gap: 14px
          card:
            - height: 88px
          name:
            - align-self: end
            - font-size: 16px
          label:
            - align-self: start
            - white-space: normal
            - text-align: left
            - color: |
                [[[
                  const low = ['wasmiddel', 'wasverzachter'].some(k => states[`binary_sensor.badkamer_wasmachine_${k}_bijna_op`]?.state === 'on');
                  return low ? '#ffb060' : 'var(--secondary-text-color)';
                ]]]
          custom_fields:
            arrow:
              - align-self: center
      - type: custom:button-card
        template: wash_advice
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.laundryhangingoutside
        name: Was hangt buiten
        icon: mdi:hanger

      - type: heading
        heading: Luchtontvochtiger
        heading_style: title
        icon: mdi:air-humidifier
      # Compact, zoals de wasmachine (hij heeft geen vaste ruimte): ring met de luchtvochtigheid, tik opent de pop-up #luchtontvochtiger
      - type: custom:button-card
        template: glass
        triggers_update: all
        entity: humidifier.luchtontvochtiger
        show_icon: false
        show_label: true
        tap_action:
          action: navigate
          navigation_path: "#luchtontvochtiger"
        name: |
          [[[
            const B = 'luchtontvochtiger';
            const on = id => states[`binary_sensor.${B}${id}`]?.state === 'on';
            if (on('_tank_full')) return 'Tank vol: legen';
            if (['', '_2', '_3', '_4', '_5', '_6', '_7'].some(n => on(`_probleem${n}`))) return 'Storing';
            if (['unavailable', 'unknown'].includes(entity.state)) return 'Niet bereikbaar';
            if (entity.state !== 'on') return 'Uit';
            const now = parseFloat(entity.attributes.current_humidity);
            return `Aan · ${isNaN(now) ? '–' : Math.round(now)}% (doel ${entity.attributes.humidity}%)`;
          ]]]
        label: |
          [[[
            const B = 'luchtontvochtiger';
            if (entity.state !== 'on') return 'Tik om aan te zetten of in te stellen';
            const modes = { Continuities: 'Continu', Auto: 'Auto', Sleep: 'Slaap' };
            const parts = [modes[entity.attributes.mode] ?? entity.attributes.mode];
            const speed = parseFloat(states[`fan.${B}`]?.attributes.percentage);
            if (!isNaN(speed)) parts.push(speed >= 100 ? 'hoge snelheid' : 'lage snelheid');
            const temp = parseFloat(states[`sensor.${B}_temperatuur`]?.state);
            if (!isNaN(temp)) parts.push(`${temp.toFixed(1).replace('.', ',')}°`);
            const timer = states[`select.${B}_aftellen`]?.state;
            if (/^\d+h$/.test(timer)) parts.push(`timer ${parseInt(timer)} u`);
            return parts.join(' · ');
          ]]]
        custom_fields:
          ring: |
            [[[
              const B = 'luchtontvochtiger';
              // De tank vol of een storing (een van de zeven "Probleem"-sensoren)
              const ids = ['_tank_full', ...['', '_2', '_3', '_4', '_5', '_6', '_7'].map(n => `_probleem${n}`)];
              const bad = ids.some(id => states[`binary_sensor.${B}${id}`]?.state === 'on');
              const running = entity.state === 'on';
              const now = parseFloat(entity.attributes.current_humidity);
              const goal = parseFloat(entity.attributes.humidity);
              const pct = bad ? 100 : running && !isNaN(now) ? Math.min(100, now) : 0;
              const color = bad ? '#ff6b6b' : now <= goal ? '#4ade80' : '#38bdf8';
              return `<div style="width:64px;height:64px;border-radius:50%;
                        background:conic-gradient(${color} ${pct * 3.6}deg, rgba(255,255,255,0.08) 0);
                        display:flex;align-items:center;justify-content:center">
                        <div style="width:52px;height:52px;border-radius:50%;background:#121828;display:flex;
                          align-items:center;justify-content:center">
                          ${running && !isNaN(now)
                            ? `<span style="font-size:15px;font-weight:700">${Math.round(now)}%</span>`
                            : '<ha-icon icon="mdi:air-humidifier" style="--mdc-icon-size:26px;opacity:0.6"></ha-icon>'}
                        </div>
                      </div>`;
            ]]]
          arrow: '<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:22px;opacity:0.5"></ha-icon>'
        styles:
          grid:
            - grid-template-areas: '"ring n arrow" "ring l arrow"'
            - grid-template-columns: auto 1fr auto
            - column-gap: 14px
          card:
            - height: 88px
          name:
            - align-self: end
            - font-size: 16px
          label:
            - align-self: start
            - white-space: normal
            - text-align: left
          custom_fields:
            arrow:
              - align-self: center

      - type: heading
        heading: Ramen
        heading_style: title
        icon: mdi:window-open-variant
      # Eén tik opent de pop-up #ramen: het advies met de redenen, de ramen per ruimte (open gezet of dicht gedaan, met de duur) en hoe lang ze open stonden.
      # Er zijn geen raamsensoren: de knoppen in de pop-up zetten input_boolean.raam_<ruimte> aan en uit, NetDaemon (WindowMonitor) rekent het advies uit.
      - type: custom:button-card
        template: glass
        triggers_update: all
        entity: sensor.raam_advies
        show_icon: false
        show_label: true
        tap_action:
          action: navigate
          navigation_path: "#ramen"
        name: |
          [[[
            const rooms = { woonkamer_tv: 'Woonkamer bij de tv', woonkamer_tafel: 'Woonkamer bij de tafel', slaapkamer: 'Slaapkamer' };
            const open = Object.entries(rooms).filter(([key]) => states[`input_boolean.raam_${key}`]?.state === 'on');
            const minutes = key => Math.max(0, Math.round((Date.now() - new Date(states[`input_boolean.raam_${key}`].last_changed)) / 60000));
            const duration = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} u ${min % 60} min`;
            if (open.length === 1) return `Raam open: ${open[0][1]} · ${duration(minutes(open[0][0]))}`;
            if (open.length > 1) return `${open.length} ramen open`;
            return ['unavailable', 'unknown'].includes(entity.state) ? 'Raamadvies niet beschikbaar' : entity.state;
          ]]]
        label: |
          [[[
            const rooms = ['woonkamer_tv', 'woonkamer_tafel', 'slaapkamer'];
            const open = rooms.filter(key => states[`input_boolean.raam_${key}`]?.state === 'on');
            const reasons = entity.attributes.redenen ?? [];
            if (open.length) return `Advies: ${String(entity.state).toLowerCase()}${reasons.length ? ` · ${reasons[0]}` : ''}`;
            return `${entity.attributes.minuten ? `${entity.attributes.minuten} min · ` : ''}${reasons[0] ?? 'Tik voor het advies'}`;
          ]]]
        custom_fields:
          ring: |
            [[[
              const rooms = ['woonkamer_tv', 'woonkamer_tafel', 'slaapkamer'];
              const open = rooms.filter(key => states[`input_boolean.raam_${key}`]?.state === 'on').length;
              const key = entity.attributes.sleutel;
              const color = open ? (key === 'dicht' ? '#ff6b6b' : '#ffb060')
                : { luchten: '#4ade80', kort: '#38bdf8', weinig_nut: '#7aa2ff', dicht: '#ff6b6b' }[key] ?? 'rgba(255,255,255,0.35)';
              return `<div style="width:64px;height:64px;border-radius:50%;border:4px solid ${color};box-sizing:border-box;
                        display:flex;align-items:center;justify-content:center;background:#121828">
                        ${open ? `<span style="font-size:22px;font-weight:700">${open}</span>`
                               : `<ha-icon icon="mdi:window-closed-variant" style="--mdc-icon-size:28px;color:${color}"></ha-icon>`}
                      </div>`;
            ]]]
          arrow: '<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:22px;opacity:0.5"></ha-icon>'
        styles:
          grid:
            - grid-template-areas: '"ring n arrow" "ring l arrow"'
            - grid-template-columns: auto 1fr auto
            - column-gap: 14px
          card:
            - height: 88px
          name:
            - align-self: end
            - font-size: 16px
          label:
            - align-self: start
            - white-space: normal
            - text-align: left
            # Hooguit twee regels: de redenen zijn lange zinnen en de kaart is even hoog als de andere
            - display: -webkit-box
            - -webkit-line-clamp: 2
            - -webkit-box-orient: vertical
            - overflow: hidden
            - color: |
                [[[
                  const open = ['woonkamer_tv', 'woonkamer_tafel', 'slaapkamer'].some(key => states[`input_boolean.raam_${key}`]?.state === 'on');
                  return open ? '#ffb060' : 'var(--secondary-text-color)';
                ]]]
          custom_fields:
            arrow:
              - align-self: center

      - type: heading
        heading: Batterijen
        heading_style: title
        icon: mdi:battery-heart-variant
      # Eén samenvatting; onbekende waarden worden weggelaten
      - type: custom:button-card
        template: glass
        triggers_update: all
        icon: mdi:battery-heart-variant
        show_label: true
        name: |
          [[[
            const crit = parseInt(states['sensor.battery_devices_critical']?.state) || 0;
            const warn = parseInt(states['sensor.battery_devices_warning']?.state) || 0;
            if (crit) return `${crit} ${crit === 1 ? 'batterij' : 'batterijen'} bijna leeg`;
            if (warn) return `${warn} ${warn === 1 ? 'batterij' : 'batterijen'} binnenkort vervangen`;
            return 'Alle batterijen in orde';
          ]]]
        label: |
          [[[
            const low = Object.entries(states)
              .filter(([id, st]) => st.attributes?.device_class === 'battery' && parseFloat(st.state) < 30).length;
            return low ? `${low} onder 30%` : '';
          ]]]
        styles:
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: auto 1fr
            - column-gap: 14px
          card:
            - min-height: 72px
          icon:
            - width: 30px
            - color: |
                [[[
                  const crit = parseInt(states['sensor.battery_devices_critical']?.state) || 0;
                  const warn = parseInt(states['sensor.battery_devices_warning']?.state) || 0;
                  return crit ? '#ff6b6b' : warn ? '#ffb060' : '#4ade80';
                ]]]
          name:
            - font-size: 16px
          label:
            - white-space: normal
            - text-align: left
      - type: custom:auto-entities
        card:
          type: entities
          title: Bijna leeg
        filter:
          include:
            - attributes:
                device_class: battery
              state: "< 30"
          exclude:
            - state: unavailable
            - state: unknown
        sort:
          method: state
          numeric: true
        show_empty: false
      - type: heading
        heading: Post & pakketten
        heading_style: title
        icon: mdi:package-variant-closed
      - type: custom:button-card
        template: carrier
        entity: sensor.buiten_postnl_inkomende_pakketten
        name: PostNL
        variables:
          key: postnl
          color: 255, 98, 0
          pickup: onderweg_naar_postnl_punt
        grid_options:
          columns: 6
      - type: custom:button-card
        template: carrier
        entity: sensor.buiten_dhl_inkomende_pakketten
        name: DHL
        variables:
          key: dhl
          color: 255, 204, 0
          pickup: onderweg_naar_servicepoint
        grid_options:
          columns: 6
      - type: custom:button-card
        template: carrier
        entity: sensor.buiten_dpd_inkomende_pakketten
        name: DPD
        variables:
          key: dpd
          color: 220, 0, 50
          pickup: onderweg_naar_parcelshop
        grid_options:
          columns: 6
      - type: custom:button-card
        template: carrier
        entity: sensor.buiten_gls_inkomende_pakketten
        name: GLS
        variables:
          key: gls
          color: 60, 110, 200
          pickup: onderweg_naar_parcelshop
        grid_options:
          columns: 6
      - type: custom:button-card
        template: parcel_list
        grid_options:
          columns: full
      - type: heading
        heading: Brieven
        heading_style: subtitle
        icon: mdi:email-outline
        badges:
          - type: entity
            entity: sensor.brieven_deze_week
            show_state: true
            show_icon: false
      # Alle brieven in één keer als ontvangen afvinken (alleen zichtbaar zolang er brieven zijn)
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.brieven_deze_week
            above: 0
        card:
          type: custom:button-card
          template: action
          name: Alle brieven ontvangen
          icon: mdi:email-check-outline
          tap_action:
            action: javascript
            javascript: |
              [[[
                const keys = (states['sensor.brieven_deze_week']?.attributes?.entities ?? [])
                  .map(e => String(states[e]?.attributes?.id ?? '').replace('mailitem-', '').slice(0, 8)).filter(Boolean);
                const current = String(states['input_text.brieven_ontvangen']?.state ?? '').split(',').filter(k => k && k !== 'unknown');
                hass.callService('input_text', 'set_value', { entity_id: 'input_text.brieven_ontvangen', value: [...new Set([...current, ...keys])].slice(-25).join(',') });
              ]]]
      # Scans van de brieven van de laatste 7 dagen, nieuwste eerst (sensor.brieven_deze_week, zie ha/template.yaml)
      - type: custom:auto-entities
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: >
            {% set ns = namespace(l=[]) %}
            {% for e in (state_attr('sensor.brieven_deze_week', 'entities') or [])[:4] %}
              {% set ns.l = ns.l + [{'entity': e, 'type': 'custom:button-card', 'template': 'letter_card'}] %}
            {% endfor %}
            {{ ns.l }}
        show_empty: false

