# Eigen pagina van Carleen: alleen zichtbaar voor Carleen (visible en de route in de navbar).
title: Carleen
path: carleen
icon: mdi:account-heart
theme: Glass Home
type: sections
max_columns: 3
dense_section_placement: true
visible:
  - user: 9514100788474b41a07a5e773d81bac2
sections:
  # Samenvatting
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - type: custom:button-card
        template: summary
        icon: mdi:account-heart
        variables:
          level: "[[[ return 'ok'; ]]]"
        name: Hoi Carleen
        label: |
          [[[
            const parts = [];
            parts.push(states['input_boolean.workingcarleen']?.state === 'on' ? 'aan het werk' : 'niet aan het werk');
            if (states['input_boolean.sleepingcarleen']?.state === 'on') parts.push('slaapt');
            const battery = parseInt(states['sensor.carleen_mobiel_battery_level']?.state);
            if (!isNaN(battery)) parts.push(`telefoon ${battery}%`);
            return parts.join(' · ');
          ]]]

  # Agenda en taken, en een taak met een plek toevoegen
  - type: grid
    cards:
      - type: heading
        heading: Agenda en taken
        heading_style: title
        icon: mdi:calendar-check
      - !include ../cards/taak_knop.yaml
      - !include ../cards/agenda.yaml

  # Werk en slapen
  - type: grid
    cards:
      - type: heading
        heading: Werk
        heading_style: title
        icon: mdi:briefcase-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.workingcarleen
        name: Aan het werk
        icon: mdi:briefcase-outline
        show_state: true
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.sleepingcarleen
        name: Slapen
        icon: mdi:sleep
        show_state: true

  # Werkrooster: een tegel die het werkrooster in een pop-up opent (dagen, vervoer, tijden, agenda en het verkeersbericht)
  - type: grid
    cards:
      - type: heading
        heading: Werkrooster
        heading_style: title
        icon: mdi:calendar-week-outline
      - type: custom:button-card
        template: schedule_tile
        variables:
          person: carleen

  # Pop-up: het werkrooster van Carleen
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#werkrooster"
        name: Werkrooster
        icon: mdi:calendar-week-outline
        cards:
          # Per dag (ook het weekend) Vrij, Thuis of Kantoor: tik wisselt. Onder een kantoordag kies je met wat je gaat.
          - type: grid
            columns: 7
            square: false
            cards:
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_maandag
            variables:
              day: ma
              weekday: 1
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_dinsdag
            variables:
              day: di
              weekday: 2
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_woensdag
            variables:
              day: wo
              weekday: 3
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_donderdag
            variables:
              day: do
              weekday: 4
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_vrijdag
            variables:
              day: vr
              weekday: 5
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_zaterdag
            variables:
              day: za
              weekday: 6
          - type: custom:button-card
            template: workday_button
            entity: input_select.werkdag_carleen_zondag
            variables:
              day: zo
              weekday: 0
          - type: grid
            columns: 7
            square: false
            cards:
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_maandag
            variables:
              workday: input_select.werkdag_carleen_maandag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_dinsdag
            variables:
              workday: input_select.werkdag_carleen_dinsdag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_woensdag
            variables:
              workday: input_select.werkdag_carleen_woensdag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_donderdag
            variables:
              workday: input_select.werkdag_carleen_donderdag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_vrijdag
            variables:
              workday: input_select.werkdag_carleen_vrijdag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_zaterdag
            variables:
              workday: input_select.werkdag_carleen_zaterdag
          - type: custom:button-card
            template: transport_day
            entity: input_select.vervoer_carleen_zondag
            variables:
              workday: input_select.werkdag_carleen_zondag
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.vrij_carleen
            name: Vrij (vandaag of tot ik hem uitzet)
            icon: mdi:beach
            show_state: true
          - type: entities
            state_color: true
            entities:
              - type: section
                label: Opstaan (het huis wordt wakker)
              - entity: input_datetime.opstaan_kantoor_carleen
                name: Op een kantoordag
                icon: mdi:office-building-outline
              - entity: input_datetime.opstaan_thuiswerk_carleen
                name: Op een thuiswerkdag
                icon: mdi:home-account
              - type: section
                label: Werkuren
              - entity: input_datetime.werk_start_carleen
                name: Begin
                icon: mdi:briefcase-clock-outline
              - entity: input_datetime.werk_eind_carleen
                name: Eind
                icon: mdi:briefcase-check-outline
          # Wanneer op kantoor: uit de agenda ("C: werk" of "V: werk"), of zelf ingesteld
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.werk_uit_agenda_carleen
            name: Werk uit de agenda halen
            icon: mdi:calendar-sync
            show_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.werk_uit_agenda_carleen
                state: "on"
            card:
              type: custom:button-card
              template: glass
              entity: input_button.sync_agenda_carleen
              name: Agenda nu synchroniseren
              label: De tijden komen uit de afspraken; vanavond om 23:50 gebeurt dit ook vanzelf
              icon: mdi:calendar-sync
              show_label: true
              tap_action:
                action: call-service
                service: input_button.press
                target:
                  entity_id: input_button.sync_agenda_carleen
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.werk_uit_agenda_carleen
                state: "off"
            card:
              type: vertical-stack
              cards:
                - type: heading
                  heading: Hoe laat naar kantoor en weer naar huis
                  heading_style: subtitle
                  icon: mdi:clock-outline
                - type: tile
                  entity: input_select.reis_ochtend_soort_carleen
                  name: "'s Ochtends"
                  features_position: bottom
                  features:
                    - type: select-options
                - type: tile
                  entity: input_datetime.reis_ochtend_tijd_carleen
                  name: Hoe laat
                - type: tile
                  entity: input_select.reis_avond_soort_carleen
                  name: "'s Avonds"
                  features_position: bottom
                  features:
                    - type: select-options
                - type: tile
                  entity: input_datetime.reis_avond_tijd_carleen
                  name: Hoe laat
          - type: entities
            state_color: true
            entities:
              - type: section
                label: Verkeersbericht (WhatsApp, op kantoordagen)
              - entity: input_boolean.verkeer_bericht_carleen
                name: Verkeersbericht sturen
                icon: mdi:car-clock
              - entity: input_datetime.verkeer_heen_carleen
                name: Naar kantoor (zonder vaste tijd)
                icon: mdi:office-building-outline
              - entity: input_datetime.verkeer_terug_carleen
                name: Naar huis (zonder vaste tijd)
                icon: mdi:home-import-outline

  # Bijzondere dagen: dan viert de weerkaart feest (de datums staan alleen in Home Assistant, niet in de code)
  - type: grid
    cards:
      - type: heading
        heading: Bijzondere dagen
        heading_style: title
        icon: mdi:party-popper
      - type: custom:button-card
        template: date_input
        entity: input_datetime.verjaardag_carleen
        name: Mijn verjaardag
        icon: mdi:cake-variant-outline
      - type: custom:button-card
        template: date_input
        entity: input_datetime.jubileum
        name: Ons jubileum
        icon: mdi:heart-outline

  # Pop-up: taak met plek toevoegen (opent via de tegel Taak met plek)
  - type: grid
    cards:
      - !include ../popups/taak.yaml
