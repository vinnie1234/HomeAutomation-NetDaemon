# Energie → Verbruik & zon: verbruik, zonneproductie en verwachting, per apparaat en bronnen.
title: Verbruik & zon
path: energie-verbruik
icon: mdi:solar-power-variant
theme: Glass Home
type: sections
subview: true
back_path: /dashboard-huis/energie
max_columns: 3
dense_section_placement: true
sections:
  # Navigatie en Energie-menu
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - !include ../cards/energie_samenvatting.yaml
      - !include ../cards/energie_tabs.yaml
      - type: energy-date-selection
        grid_options:
          columns: full
  # Grafieken
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Verbruik
        heading_style: title
        icon: mdi:home-lightning-bolt-outline
      - type: energy-usage-graph
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        hours_12: false
        now:
          show: true
          label: Nu
          color: "#ffffff"
        header:
          show: true
          title: Zonneproductie en verbruik vandaag
          show_states: true
          colorize_states: true
          standard_format: true
        apex_config:
          chart:
            type: area
            height: 300
          legend:
            show: false
          stroke:
            curve: smooth
            width: 2
          fill:
            type: gradient
            gradient:
              shadeIntensity: 1
              opacityFrom: 0.45
              opacityTo: 0.05
              stops:
                - 100
          grid:
            borderColor: "rgba(255, 255, 255, 0.06)"
          xaxis:
            labels:
              format: HH:mm
          yaxis:
            min: 0
        all_series_config:
          type: area
          stroke_width: 2
          unit: W
          show:
            legend_value: false
        series:
          - entity: sensor.energyusages
            name: Verbruik
            color: "#ff6b6b"
          - entity: sensor.power_production_now
            name: Zonneproductie
            transform: return x * 4;
            color: "#4ade80"
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        hours_12: false
        now:
          show: true
          label: Nu
          color: "#ffffff"
        header:
          show: true
          title: Zonneproductie en verwachting
          show_states: true
          colorize_states: true
          standard_format: true
        apex_config:
          chart:
            type: area
            height: 300
          legend:
            show: false
          stroke:
            curve: smooth
            width: 2
          fill:
            type: gradient
            gradient:
              shadeIntensity: 1
              opacityFrom: 0.45
              opacityTo: 0.05
              stops:
                - 100
          grid:
            borderColor: "rgba(255, 255, 255, 0.06)"
          xaxis:
            labels:
              format: HH:mm
          yaxis:
            min: 0
        all_series_config:
          type: area
          stroke_width: 2
          unit: W
          show:
            legend_value: false
        series:
          - entity: sensor.energy_current_hour
            name: Verwacht
            transform: return x * 4 * 1000;
            color: "#ffb060"
          - entity: sensor.power_production_now
            name: Zonneproductie
            transform: return x * 4;
            color: "#4ade80"
        grid_options:
          columns: full
      - type: heading
        heading: Per apparaat
        heading_style: subtitle
        icon: mdi:devices
      - type: energy-devices-detail-graph
        grid_options:
          columns: full

  # Netbalans en bronnen
  - type: grid
    cards:
      - type: heading
        heading: Netbalans
        heading_style: title
        icon: mdi:scale-balance
      - type: energy-grid-neutrality-gauge
      - type: energy-distribution
        link_dashboard: false
      - type: heading
        heading: Bronnen
        heading_style: subtitle
        icon: mdi:format-list-bulleted
      - type: energy-sources-table
        show_only_totals: true
        types:
          - grid
          - solar
          - battery
          - water
