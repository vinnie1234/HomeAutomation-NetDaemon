# Energie → Verbruik & zon: verbruik, zonneproductie en verwachting, per apparaat en bronnen.
title: Verbruik & zon
path: energie-verbruik
icon: mdi:solar-power-variant
theme: Glass Home
type: sections
subview: true
back_path: /dashboard-huis/energie
max_columns: 3
dense_section_placement: true
sections:
  # Navigatie en Energie-menu
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - !include ../cards/energie_samenvatting.yaml
      - !include ../cards/energie_tabs.yaml
      - type: energy-date-selection
        grid_options:
          columns: full
  # Grafieken
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Verbruik
        heading_style: title
        icon: mdi:home-lightning-bolt-outline
      - type: energy-usage-graph
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        hours_12: false
        now:
          show: true
          label: Nu
          color: "#ffffff"
        header:
          show: true
          title: Zonneproductie en verbruik vandaag
          show_states: true
          colorize_states: true
          standard_format: true
        apex_config:
          chart:
            type: area
            height: 300
          legend:
            show: false
          stroke:
            curve: smooth
            width: 2
          fill:
            type: gradient
            gradient:
              shadeIntensity: 1
              opacityFrom: 0.45
              opacityTo: 0.05
              stops:
                - 100
          grid:
            borderColor: "rgba(255, 255, 255, 0.06)"
          xaxis:
            labels:
              format: HH:mm
          yaxis:
            min: 0
        all_series_config:
          type: area
          stroke_width: 2
          unit: W
          show:
            legend_value: false
        series:
          - entity: sensor.energyusages
            name: Verbruik
            color: "#ff6b6b"
          - entity: sensor.power_production_now
            name: Zonneproductie
            transform: return x * 4;
            color: "#4ade80"
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        hours_12: false
        now:
          show: true
          label: Nu
          color: "#ffffff"
        header:
          show: true
          title: Zonneproductie en verwachting
          show_states: true
          colorize_states: true
          standard_format: true
        apex_config:
          chart:
            type: area
            height: 300
          legend:
            show: false
          stroke:
            curve: smooth
            width: 2
          fill:
            type: gradient
            gradient:
              shadeIntensity: 1
              opacityFrom: 0.45
              opacityTo: 0.05
              stops:
                - 100
          grid:
            borderColor: "rgba(255, 255, 255, 0.06)"
          xaxis:
            labels:
              format: HH:mm
          yaxis:
            min: 0
        all_series_config:
          type: area
          stroke_width: 2
          unit: W
          show:
            legend_value: false
        series:
          - entity: sensor.energy_current_hour
            name: Verwacht
            transform: return x * 4 * 1000;
            color: "#ffb060"
          - entity: sensor.power_production_now
            name: Zonneproductie
            transform: return x * 4;
            color: "#4ade80"
        grid_options:
          columns: full
      - type: heading
        heading: Per apparaat
        heading_style: subtitle
        icon: mdi:devices
      - type: energy-devices-detail-graph
        grid_options:
          columns: full

  # Netbalans en bronnen
  - type: grid
    cards:
      - type: heading
        heading: Zonneverwachting
        heading_style: title
        icon: mdi:solar-power-variant
      - type: custom:button-card
        template: stat
        entity: sensor.energy_production_today
        name: Vandaag
        icon: mdi:weather-sunny
        styles:
          icon:
            - color: "#ffd166"
        grid_options:
          columns: 6
      - type: custom:button-card
        template: stat
        entity: sensor.energy_production_today_remaining
        name: Nog te gaan
        icon: mdi:timer-sand
        grid_options:
          columns: 6
      - type: custom:button-card
        template: stat
        entity: sensor.energy_production_tomorrow
        name: Morgen
        icon: mdi:weather-sunny-alert
        grid_options:
          columns: 6
      - type: custom:button-card
        template: stat
        entity: sensor.power_highest_peak_time_today
        name: Piek vandaag
        icon: mdi:chart-bell-curve
        state_display: |
          [[[
            const t = new Date(entity?.state);
            return isNaN(t) ? 'Onbekend' : t.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          ]]]
        grid_options:
          columns: 6
      # Grootste verbruikers nu (alle lampen en stekkers met een vermogenssensor)
      - type: custom:button-card
        template: top_power
        variables:
          count: 8
          sensors:
            - sensor.koelkast_power
            - sensor.tv_kast_power
            - sensor.tv_power_meter
            - sensor.soundbar_power_meter
            - sensor.hue_play_links_power
            - sensor.hue_play_midden_power
            - sensor.hue_play_rechts_power
            - sensor.plafond_woonkamer_power
            - sensor.plafond_slaapkamer_power
            - sensor.plafond_badkamer_power
            - sensor.nachtkastje_power
            - sensor.keuken_power
            - sensor.berging_power
            - sensor.hal_power
            - sensor.buiten_deur_power
            - sensor.sigaret_device_power
            - sensor.plug_bureau_device_power
            - sensor.nestmini9818_power
            - sensor.woonkamer_power
            - sensor.energysocket_5c2faf02a546_active_power
            - sensor.energysocket_5c2faf0c7564_active_power
            - sensor.energysocket_5c2faf0d8364_active_power
          names:
            sensor.tv_power_meter: TV
            sensor.soundbar_power_meter: Soundbar
            sensor.tv_kast_power: TV-kast
            sensor.nestmini9818_power: Nest Mini keuken
            sensor.plug_bureau_device_power: Bureau
            sensor.energysocket_5c2faf02a546_active_power: Stekker 1
            sensor.energysocket_5c2faf0c7564_active_power: Stekker 2
            sensor.energysocket_5c2faf0d8364_active_power: Stekker 3
      - type: heading
        heading: Stekkers
        heading_style: subtitle
        icon: mdi:power-socket-eu
      - type: custom:button-card
        template: stat
        entity: sensor.energysocket_5c2faf02a546_active_power
        name: Stekker 1
        icon: mdi:power-socket-eu
        grid_options:
          columns: 4
      - type: custom:button-card
        template: stat
        entity: sensor.energysocket_5c2faf0c7564_active_power
        name: Stekker 2
        icon: mdi:power-socket-eu
        grid_options:
          columns: 4
      - type: custom:button-card
        template: stat
        entity: sensor.energysocket_5c2faf0d8364_active_power
        name: Stekker 3
        icon: mdi:power-socket-eu
        grid_options:
          columns: 4
      - type: heading
        heading: Netbalans
        heading_style: title
        icon: mdi:scale-balance
      - type: energy-grid-neutrality-gauge
      - type: energy-distribution
        link_dashboard: false
      - type: heading
        heading: Bronnen
        heading_style: subtitle
        icon: mdi:format-list-bulleted
      - type: energy-sources-table
        show_only_totals: true
        types:
          - grid
          - solar
          - battery
          - water
