# Medicijnen van Pixel (subpagina van Pixel): voorraad instellen, geven, en de hele geschiedenis.
# NetDaemon PixelMedication houdt de voorraad en de geschiedenis bij (voor altijd) en publiceert sensor.pixel_medicijnen.
title: Medicijnen
path: pixel_medicijnen
icon: mdi:pill
theme: Glass Home
type: sections
subview: true
back_path: /dashboard-huis/pixel
max_columns: 3
dense_section_placement: true
sections:
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      # Tik op de samenvatting (of Pixel in de navigatie) om terug te gaan
      - type: custom:button-card
        template: summary
        icon: mdi:pill
        tap_action:
          action: navigate
          navigation_path: /dashboard-huis/pixel
        variables:
          level: |
            [[[
              const s = states['sensor.pixel_medicijnen']?.state;
              const low = parseFloat(states['input_number.pixel_prednison_voorraad']?.state) < 2 || parseFloat(states['input_number.pixel_antibraak_voorraad']?.state) < 5;
              return s === 'vergeten' ? 'bad' : s === 'nodig' || low ? 'warn' : 'ok';
            ]]]
        name: |
          [[[
            return { gegeven: 'Prednison van vandaag is gegeven', nodig: 'Pixel moet zijn prednison nog krijgen', vergeten: 'Prednison vergeten!', wacht: 'Prednison vanavond' }[states['sensor.pixel_medicijnen']?.state] ?? 'Medicijnen van Pixel';
          ]]]
        label: |
          [[[
            const a = states['sensor.pixel_medicijnen']?.attributes ?? {};
            return `Herinnering om ${a.herinnering ?? '20:00'} · tik op een medicijn om te geven`;
          ]]]

  # Voorraad en geven
  - type: grid
    cards:
      - type: heading
        heading: Voorraad
        heading_style: title
        icon: mdi:pill
      - type: custom:button-card
        template: med_stock
        entity: input_number.pixel_prednison_voorraad
        variables:
          medicine: prednison
          dose: 0.25
          low: 2
      - type: custom:button-card
        template: med_stock
        entity: input_number.pixel_antibraak_voorraad
        variables:
          medicine: antibraak
          dose: 0.5
          low: 5
      # Voorraad instellen door het aantal in te tikken, bijvoorbeeld bij een nieuwe strip (komt ook in de geschiedenis)
      - type: entities
        title: Voorraad invullen
        entities:
          - entity: input_number.pixel_prednison_voorraad
            name: Prednison (pillen)
            icon: mdi:pencil-outline
          - entity: input_number.pixel_antibraak_voorraad
            name: Antibraak (pillen)
            icon: mdi:pencil-outline
      - type: tile
        entity: input_datetime.pixel_prednison_tijd
        name: Herinnering prednison
        icon: mdi:alarm
      # Per ongeluk gegeven? De laatste gift ongedaan maken: de pil gaat terug en er komt een correctieregel bij
      - type: custom:button-card
        template: glass
        entity: sensor.pixel_medicijnen
        triggers_update:
          - sensor.pixel_medicijnen
        icon: mdi:undo
        name: Laatste gift ongedaan maken
        show_label: true
        label: |
          [[[
            const u = entity?.attributes?.ongedaan_maken;
            if (!u) return 'Er is niets om ongedaan te maken';
            const t = new Date(u.tijd);
            const amount = Math.abs(u.hoeveelheid) === 0.25 ? '¼' : Math.abs(u.hoeveelheid);
            return `${amount} ${u.medicijn} van ${t.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} ${t.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`;
          ]]]
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.pixel_medicijn_ongedaan
          confirmation:
            text: De laatste gift ongedaan maken? De pil gaat terug in de voorraad; de gift blijft in de geschiedenis staan als ongedaan gemaakt.
        styles:
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: auto 1fr
            - column-gap: 14px
          card:
            - min-height: 68px
          icon:
            - width: 24px
            - color: '#9ca3af'
          label:
            - white-space: normal
            - text-align: left

  # Geschiedenis
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Geschiedenis
        heading_style: title
        icon: mdi:history
      - type: custom:button-card
        template: med_history
