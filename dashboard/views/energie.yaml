# Energie → Overzicht: samenvatting, de kaart Energiestroom (nu, prijs, kamers, totalen), het verloop van 24 uur, het wasadvies en thuiswerken (die staan in de kaart zelf).
# Details staan in de tabs Prijs, Verbruik & zon, Kosten en Water.
title: Energie
path: energie
icon: mdi:lightning-bolt
theme: Glass Home
type: sections
max_columns: 3
dense_section_placement: true
sections:
  # Navigatie en Energie-menu
  - type: grid
    column_span: 3
    cards:
      - !include ../navbar.yaml
      - !include ../cards/energie_samenvatting.yaml
      - !include ../cards/energie_tabs.yaml
      - type: custom:huis-energiestroom
        grid_options:
          columns: full

  # Pop-up: thuiswerken per dag (opent via de tegel Thuiswerken)
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#thuiswerken"
        name: Thuiswerken
        icon: mdi:laptop-account
        cards:
          - type: custom:button-card
            template: homework_days
