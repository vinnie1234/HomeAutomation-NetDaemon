# Pop-up thema, opent via #thema (tik op het thema-label linksboven in de weerkaart): van wanneer tot wanneer het thema
# er staat en wanneer de feestdag zelf is.
type: custom:bubble-card
card_type: pop-up
# Zo hoog als de inhoud, niet over de hele hoogte van het scherm
popup_mode: fit-content
hash: "#thema"
name: Thema
icon: mdi:palette-outline
cards:
  - type: custom:button-card
    template: theme_info_card
