# Fails when a NuGet package (direct or transitive) has a known vulnerability.
# Runs weekly as well, so newly disclosed vulnerabilities in existing packages are found without a push.

name: Vulnerable packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Check for vulnerable packages
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "::error::Vulnerable NuGet packages found, see the output above"
          exit 1
        fi
